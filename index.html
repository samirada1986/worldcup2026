== null) updated++;\n    }\n  });\n  return updated;\n}\n\n// Rebuild all group stats and user points from current MATCHES\nfunction rebuildAllStats() {\n  // Reset group stats\n  Object.keys(GROUPS).forEach(k => {\n    GROUP_STATS[k] = {};\n    GROUPS[k].teams.forEach(t => { GROUP_STATS[k][t] = {p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}; });\n  });\n  MATCHES.filter(m => m.status === 'finished' && m.homeScore !== null)\n         .forEach(m => updateGroupStats(m.id));\n  // Rebuild all user points from scratch (with streak bonus)\n  Object.values(users).forEach(u => {\n    u.points = 0; u.correct = 0; u.exact = 0; u.streak = 0; u.maxStreak = 0;\n    // Recount predictions from the preds tree — the stored scalar can be stale\n    u.predictions = Object.values(u.preds || {}).filter(p => p && p.saved).length;\n    // Process matches in order for streak tracking\n    const finishedMatches = MATCHES\n      .filter(m => m.status === 'finished' && m.homeScore !== null)\n      .sort((a, b) => a.id - b.id);\n    let currentStreak = 0;\n    finishedMatches.forEach(m => {\n      const p = u.preds[m.id];\n      if (!p || !p.saved) { currentStreak = 0; return; }\n      const pts = calcPoints(p, m);\n      if (pts > 0) {\n        u.points += pts;\n        u.correct++;\n        if (p.home === m.homeScore && p.away === m.awayScore) u.exact++;\n        currentStreak++;\n        // Streak bonus: every 3 consecutive correct predictions\n        if (currentStreak > 0 && currentStreak % 3 === 0) {\n          u.points += 3;\n          u.streakBonus = (u.streakBonus || 0) + 1;\n        }\n        if (currentStreak > (u.maxStreak || 0)) u.maxStreak = currentStreak;\n      } else {\n        currentStreak = 0;\n      }\n    });\n    u.streak = currentStreak;\n  });\n  // Keep my own freshly-computed stats in Firebase so other (and older)\n  // clients see up-to-date numbers. Guarded against identical re-writes.\n  fbSaveUser();\n}\n\n// Refresh all visible UI\nfunction refreshUI(updated) {\n  renderDashMatches();\n  renderAllMatches();\n  renderMiniLb();\n  updateStats();\n  updateGroupProgress();\n  updateBracketFromGroups(); propagateWinners(); syncKnockoutMatches();\n  if (document.getElementById('page-groups').classList.contains('active')) renderGroupTables();\n  if (document.getElementById('page-bracket')?.classList.contains('active')) renderBracket();\n  if (document.getElementById('page-leaderboard').classList.contains('active')) { renderPodium(); renderFullLb(); }\n  if (document.getElementById('page-reports').classList.contains('active')) renderReports();\n  if (updated > 0) {\n    addAct('🔴 زنده', `${FN(updated)} نتیجه از TheSportsDB دریافت شد`, 'r');\n    toast(`🔴 ${FN(updated)} بازی آپدیت شد`, 's', 3000);\n  }\n}\n\n// ── Main fetch: TheSportsDB eventsseason ─────────────────────────────────────\nasync function fetchSportsDB() {\n  // Try primary endpoint: all events for WC season\n  const url = `${SPORTSDB_BASE}/eventsseason.php?id=${WC_LEAGUE_ID}&s=${WC_SEASON}`;\n  const resp = await fetch(url, { signal: AbortSignal.timeout(8000) });\n  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);\n  const data = await resp.json();\n  return (data.events || []);\n}\n\n// ── Supplemental: fetch last 15 events for league (catches live scores) ──────\nasync function fetchRecentEvents() {\n  const url = `${SPORTSDB_BASE}/eventspastleague.php?id=${WC_LEAGUE_ID}`;\n  const resp = await fetch(url, { signal: AbortSignal.timeout(6000) });\n  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);\n  const data = await resp.json();\n  return (data.events || []);\n}\n\n// ── Supplemental: fetch next 15 upcoming events (for live countdown) ─────────\nasync function fetchNextEvents() {\n  const url = `${SPORTSDB_BASE}/eventsnextleague.php?id=${WC_LEAGUE_ID}`;\n  const resp = await fetch(url, { signal: AbortSignal.timeout(6000) });\n  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);\n  const data = await resp.json();\n  return (data.events || []);\n}\n\n// ── Custom token: football-data.org ──────────────────────────────────────────\nasync function fetchFootballData(token) {\n  const url = 'https://api.football-data.org/v4/competitions/WC/matches';\n  const resp = await fetch(url, {\n    headers: { 'X-Auth-Token': token },\n    signal: AbortSignal.timeout(8000)\n  });\n  if (!resp.ok) throw new Error(`FD HTTP ${resp.status}`);\n  const data = await resp.json();\n  return (data.matches || []).map(m => ({\n    strHomeTeam: m.homeTeam.name,\n    strAwayTeam: m.awayTeam.name,\n    intHomeScore: m.score?.fullTime?.home ?? null,\n    intAwayScore: m.score?.fullTime?.away ?? null,\n    strStatus: m.status,\n  }));\n}\n\n// ── Main sync orchestrator ───────────────────────────────────────────────────\nasync function syncLiveData(manual = false) {\n  if (manual) setSyncBtnSpin(true);\n  setSyncStatus('⏳ دریافت داده از TheSportsDB...', 'var(--blue)');\n  syncCount++;\n\n  let events = [];\n  const fdToken = window.__FD_TOKEN || '';\n\n  try {\n    // Priority 1: football-data.org if token available\n    if (fdToken) {\n      try {\n        events = await fetchFootballData(fdToken);\n        setSyncStatus('🟢 football-data.org', 'var(--green)');\n      } catch (e) {\n        console.warn('football-data failed:', e.message);\n      }\n    }\n\n    // Priority 2: TheSportsDB full season\n    if (!events.length) {\n      try {\n        events = await fetchSportsDB();\n      } catch (e) {\n        console.warn('SportsDB season failed:', e.message);\n      }\n    }\n\n    // Priority 3: TheSportsDB recent + next (smaller, faster, often cached)\n    if (!events.length) {\n      try {\n        const [recent, next] = await Promise.allSettled([fetchRecentEvents(), fetchNextEvents()]);\n        if (recent.status === 'fulfilled') events.push(...recent.value);\n        if (next.status === 'fulfilled') events.push(...next.value);\n      } catch (e) {\n        console.warn('SportsDB recent/next failed:', e.message);\n      }\n    }\n\n    if (events.length) {\n      const updated = applyAPIData(events);\n      if (updated > 0) rebuildAllStats();\n      refreshUI(updated);\n      lastSyncTime = new Date();\n      const t = lastSyncTime.toLocaleTimeString('fa-IR', {hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tehran'});\n      setSyncStatus(`🟢 آخرین آپدیت: ${t} (${FN(events.length)} رویداد)`, 'var(--green)');\n    } else {\n      setSyncStatus('🟡 سرور پاسخ نداد — داده محلی فعال', 'var(--gold)');\n    }\n  } catch (err) {\n    console.warn('Sync error:', err);\n    setSyncStatus('🔴 خطا در اتصال', 'var(--red)');\n  } finally {\n    if (manual) setSyncBtnSpin(false);\n  }\n}\n\nfunction openSyncSettings() {\n  openModal('⚙️ تنظیمات همگام‌سازی', `\n    <div style=\"font-size:13px;line-height:1.9\">\n      <p style=\"margin-bottom:14px;color:var(--tx2)\">\n        اپ هر <strong>۶۰ ثانیه<\u002Fstrong> به‌صورت خودکار نتایج را از سرور می‌گیره \n        و امتیاز همه کاربران رو آپدیت می‌کنه.\n      <\u002Fp>\n      <div style=\"padding:10px;background:var(--gs);border-radius:8px;margin-bottom:8px;border:1px solid rgba(10,191,111,.15)\">\n        ✅ <strong>TheSportsDB<\u002Fstrong> (id=4429) — رایگان، بدون کلید، فعال<br>\n        <span style=\"font-size:11px;color:var(--tx3)\">endpoints: eventsseason + eventspastleague + eventsnextleague<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:10px;background:var(--blues);border-radius:8px;margin-bottom:14px;border:1px solid rgba(45,127,232,.12)\">\n        🔑 <strong>football-data.org<\u002Fstrong> — دقیق‌تر، نیاز به کلید رایگان<br>\n        <span style=\"font-size:11px;color:var(--tx3)\">ثبت‌نام رایگان: football-data.org/client/register<\u002Fspan>\n      <\u002Fdiv>\n      <label class=\"flabel\" style=\"display:block;margin-bottom:5px;\">کلید football-data.org (اختیاری):<\u002Flabel>\n      <input class=\"finput\" id=\"fdTokenInput\" placeholder=\"کلید API خود را اینجا وارد کنید\"\n        style=\"width:100%;margin-bottom:12px;\" value=\"${window.__FD_TOKEN || ''}\">\n      <button class=\"btn btn-g\" style=\"width:100%\" onclick=\"saveFdToken()\">\n        💾 ذخیره و همگام‌سازی الان\n      <\u002Fbutton>\n      <div style=\"margin-top:12px;font-size:11px;color:var(--tx3);text-align:center;\">\n        آخرین همگام‌سازی: ${lastSyncTime ? lastSyncTime.toLocaleString('fa-IR') : 'هنوز انجام نشده'} | \n        تعداد: ${syncCount}\n      <\u002Fdiv>\n    <\u002Fdiv>`);\n}\n\nfunction saveFdToken() {\n  const v = (document.getElementById('fdTokenInput')?.value || '').trim();\n  window.__FD_TOKEN = v;\n  closeModal();\n  toast(v ? '🔑 کلید ذخیره شد' : '🔄 حالت TheSportsDB فعال', 'i', 2000);\n  syncLiveData(true);\n}\n\n// ═════════════════════════════════════════════════════════════════\n// ██  FRIEND GROUPS — private mini-leagues  ██\n// ═════════════════════════════════════════════════════════════════\nlet friendGroups = {};\nlet pendingJoin = null;\nconst FG_EMOJIS = ['🦁','🔥','⚡','🚀','🐉','👑','🎯','🦅','🐯','🌟','💪','🏆','⭐','🦈','🐺'];\n\nfunction myName(){ return currentUser ? currentUser.name : null; }\n\n// ── Global league: every player is automatically in it (no floating users) ──\nfunction globalLeague(){\n  const members={};\n  Object.keys(users).forEach(n=>{ if(users[n]&&!users[n].isAdmin) members[n]=true; });\n  const me=myName(); if(me) members[me]=true;\n  return {id:'global',name:'لیگ عمومی',emoji:'🌍',global:true,owner:null,members,createdAt:0};\n}\nfunction getGroup(id){ return id==='global' ? globalLeague() : friendGroups[id]; }\nfunction myPrivateGroups(){\n  const me=myName(); if(!me) return [];\n  return Object.values(friendGroups).filter(g=> g && !g.global && g.members && g.members[me]);\n}\n\nfunction genGroupId(){\n  return 'g' + Math.random().toString(36).slice(2,7) + Date.now().toString(36).slice(-3);\n}\n\n// members object → array of {name, points, rank} sorted desc\nfunction groupBoard(g){\n  const names = Object.keys(g.members||{});\n  const arr = names.map(n=>({ name:n, points:(users[n]&&users[n].points)||0,\n                              exact:(users[n]&&users[n].exact)||0,\n                              correct:(users[n]&&users[n].correct)||0,\n                              preds:(users[n]&&users[n].predictions)||0 }));\n  arr.sort((a,b)=> b.points-a.points || b.exact-a.exact || b.correct-a.correct\n                || String(a.name).localeCompare(String(b.name),'fa'));\n  // competition ranking: equal scores share a rank\n  let rank=0,seen=0,prevKey=null;\n  arr.forEach(x=>{\n    seen++;\n    const k=x.points+'|'+x.exact+'|'+x.correct;\n    if(k!==prevKey){rank=seen;prevKey=k;}\n    x.rank=rank;\n  });\n  return arr;\n}\n\nfunction myGroups(){\n  const me = myName(); if(!me) return [];\n  return [globalLeague(), ...myPrivateGroups()];\n}\n\n// ── Create ───────────────────────────────────────────────────────\nfunction createGroupModal(){\n  if(!myName()){ toast('اول وارد شو','e'); return; }\n  const picks = FG_EMOJIS.map((e,i)=>`<button type=\"button\" class=\"fg-ep\" data-e=\"${e}\" onclick=\"pickFgEmoji(this)\" style=\"width:42px;height:42px;border-radius:12px;border:2px solid var(--brd);background:var(--sur2);font-size:20px;cursor:pointer;transition:all .15s;${i===0?'border-color:var(--green);background:var(--gs);':''}\">${e}<\u002Fbutton>`).join('');\n  openModal('🆕 ساخت لیگ دوستانه', `\n    <div style=\"font-size:13px;color:var(--tx3);margin-bottom:16px;line-height:1.8;\">یه گروه خصوصی بساز، لینکش رو برای دوستات بفرست و فقط بین خودتون رقابت کنید.<\u002Fdiv>\n    <label class=\"llabel\" style=\"display:block;margin-bottom:7px;\">اسم گروه<\u002Flabel>\n    <input id=\"fgNameInp\" class=\"linput\" placeholder=\"مثلاً: رفقای محل، همکارا، فامیل…\" maxlength=\"24\" style=\"margin-bottom:16px;\">\n    <label class=\"llabel\" style=\"display:block;margin-bottom:9px;\">آیکن گروه<\u002Flabel>\n    <div id=\"fgEmojiPick\" data-sel=\"${FG_EMOJIS[0]}\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;\">${picks}<\u002Fdiv>\n    <button class=\"fg-btn fg-btn-primary\" style=\"width:100%;justify-content:center;\" onclick=\"submitCreateGroup()\">🚀 بساز و شروع کن<\u002Fbutton>\n  `);\n  setTimeout(()=>{const i=document.getElementById('fgNameInp');if(i)i.focus();},120);\n}\nfunction pickFgEmoji(btn){\n  document.querySelectorAll('#fgEmojiPick .fg-ep').forEach(b=>{b.style.borderColor='var(--brd)';b.style.background='var(--sur2)';});\n  btn.style.borderColor='var(--green)';btn.style.background='var(--gs)';\n  document.getElementById('fgEmojiPick').dataset.sel=btn.dataset.e;\n}\nfunction submitCreateGroup(){\n  const name=(document.getElementById('fgNameInp').value||'').trim();\n  if(name.length<2){ toast('یه اسم برای گروه بنویس','e'); return; }\n  const emoji=document.getElementById('fgEmojiPick').dataset.sel||'🏆';\n  const id=genGroupId(); const me=myName();\n  const g={ id, name, emoji, owner:me, createdAt:Date.now(), members:{[me]:true} };\n  friendGroups[id]=g;\n  fbSet('friendGroups/'+id, g);\n  closeModal();\n  confetti();\n  toast('گروه «'+name+'» ساخته شد! 🎉 حالا لینکش رو بفرست','s',3500);\n  renderFriends();\n  setTimeout(()=>shareGroupModal(id),500);\n}\n\n// ── Join / Leave ─────────────────────────────────────────────────\nfunction joinGroup(id){\n  if(id==='global'){ nav('friends'); return; }\n  const me=myName(); if(!me){ toast('اول وارد شو','e'); return; }\n  const doJoin=(g)=>{\n    if(!g){ toast('این گروه پیدا نشد یا حذف شده','e'); return; }\n    friendGroups[id]=g;\n    if(g.members&&g.members[me]){ toast('تو الان عضو این گروهی ✅','i'); nav('friends'); return; }\n    if(!g.members)g.members={};\n    g.members[me]=true;\n    fbUpdate('friendGroups/'+id+'/members', {[me]:true});\n    confetti();\n    toast('به «'+g.name+'» پیوستی! 👋','s',3000);\n    renderFriends();\n  };\n  if(friendGroups[id]) return doJoin(friendGroups[id]);\n  if(fbReady){ db.ref('friendGroups/'+id).once('value').then(s=>doJoin(s.val())); }\n  else doJoin(null);\n}\nfunction leaveGroup(id){\n  if(id==='global'){ toast('لیگ عمومی همیشگیه و نمی‌تونی ازش خارج شی 🌍','i'); return; }\n  const me=myName(); const g=friendGroups[id]; if(!g)return;\n  if(g.members)delete g.members[me];\n  if(fbReady)db.ref('friendGroups/'+id+'/members/'+me).remove();\n  toast('از گروه خارج شدی','i');\n  closeModal(); renderFriends();\n}\n\n// ── Share ────────────────────────────────────────────────────────\nfunction inviteLink(id){\n  const base=location.href.split('#')[0];\n  return base+'#join='+id;\n}\nfunction shareGroupModal(id){\n  const g=getGroup(id); if(!g)return;\n  if(g.global){\n    const link=location.href.split('#')[0];\n    const txt='بیا تو لیگ پیش‌بینی جام جهانی ۲۰۲۶ پیش‌بینی کن و باهام رقابت کن! 🏆⚽\\n'+link;\n    const wa='https://wa.me/?text='+encodeURIComponent(txt);\n    const tg='https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent('بیا تو لیگ پیش‌بینی جام جهانی ۲۰۲۶ باهام رقابت کن! 🏆');\n    openModal('🌍 دعوت به لیگ', `\n      <div style=\"font-size:13px;color:var(--tx3);margin-bottom:4px;line-height:1.8;\">لینک اپ رو برای دوستات بفرست. هرکی وارد شه خودکار توی «لیگ عمومی» با همه رقابت می‌کنه.<\u002Fdiv>\n      <div class=\"fg-link-box\">\n        <input id=\"fgLinkInp\" value=\"${link}\" readonly onclick=\"this.select()\">\n        <button class=\"fg-link-copy\" onclick=\"copyInvite('global')\">📋 کپی<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;margin-top:14px;\">\n        <a href=\"${wa}\" target=\"_blank\" class=\"fg-btn fg-btn-primary\" style=\"flex:1;justify-content:center;text-decoration:none;background:linear-gradient(135deg,#25D366,#128C7E);box-shadow:0 8px 20px -8px rgba(37,211,102,.5);\">واتساپ<\u002Fa>\n        <a href=\"${tg}\" target=\"_blank\" class=\"fg-btn fg-btn-primary\" style=\"flex:1;justify-content:center;text-decoration:none;background:linear-gradient(135deg,#2AABEE,#229ED9);box-shadow:0 8px 20px -8px rgba(42,171,238,.5);\">تلگرام<\u002Fa>\n      <\u002Fdiv>\n    `);\n    return;\n  }\n  const link=inviteLink(id);\n  const wa='https://wa.me/?text='+encodeURIComponent('بیا تو لیگ پیش‌بینی جام جهانی ۲۰۲۶ توی گروه «'+g.name+'» باهام رقابت کن! 🏆⚽\\n'+link);\n  const tg='https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent('بیا تو گروه «'+g.name+'» پیش‌بینی کنیم! 🏆');\n  openModal(g.emoji+' دعوت به «'+g.name+'»', `\n    <div style=\"font-size:13px;color:var(--tx3);margin-bottom:4px;line-height:1.8;\">این لینک رو برای دوستات بفرست. هرکی بازش کنه مستقیم وارد گروه می‌شه.<\u002Fdiv>\n    <div class=\"fg-link-box\">\n      <input id=\"fgLinkInp\" value=\"${link}\" readonly onclick=\"this.select()\">\n      <button class=\"fg-link-copy\" onclick=\"copyInvite('${id}')\">📋 کپی<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;margin-top:14px;\">\n      <a href=\"${wa}\" target=\"_blank\" class=\"fg-btn fg-btn-primary\" style=\"flex:1;justify-content:center;text-decoration:none;background:linear-gradient(135deg,#25D366,#128C7E);box-shadow:0 8px 20px -8px rgba(37,211,102,.5);\">واتساپ<\u002Fa>\n      <a href=\"${tg}\" target=\"_blank\" class=\"fg-btn fg-btn-primary\" style=\"flex:1;justify-content:center;text-decoration:none;background:linear-gradient(135deg,#2AABEE,#229ED9);box-shadow:0 8px 20px -8px rgba(42,171,238,.5);\">تلگرام<\u002Fa>\n    <\u002Fdiv>\n  `);\n}\nfunction copyInvite(id){\n  const link=id==='global'?location.href.split('#')[0]:inviteLink(id);\n  const inp=document.getElementById('fgLinkInp');\n  if(inp){inp.select();}\n  if(navigator.clipboard){ navigator.clipboard.writeText(link).then(()=>toast('لینک کپی شد! حالا بفرستش 📨','s')).catch(()=>{try{document.execCommand('copy');toast('لینک کپی شد 📨','s');}catch(e){}}); }\n  else { try{document.execCommand('copy');toast('لینک کپی شد 📨','s');}catch(e){} }\n}\n\n// ── Detail modal ─────────────────────────────────────────────────\nfunction openGroup(id){\n  const g=getGroup(id); if(!g)return;\n  const me=myName();\n  // Privacy: non-global groups are only visible to members and admin\n  if(!g.global && !isAdmin && !(g.members && g.members[me])){\n    openModal((g.emoji||'🏆')+' '+g.name,`\n      <div style=\"text-align:center;padding:32px 16px;\">\n        <div style=\"font-size:52px;margin-bottom:14px;\">🔒<\u002Fdiv>\n        <div style=\"font-size:17px;font-weight:800;margin-bottom:8px;\">دسترسی فقط برای اعضای گروه<\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--tx3);line-height:1.9;\">پیش‌بینی‌های این لیگ فقط برای اعضا نمایش داده می‌شه.<br>از یکی از اعضا لینک دعوت بگیر.<\u002Fdiv>\n      <\u002Fdiv>`);\n    return;\n  }\n  const board=groupBoard(g);\n  const rows=board.map(p=>{\n    const medal=p.rank===1?'🥇':p.rank===2?'🥈':p.rank===3?'🥉':FN(p.rank);\n    return `<div class=\"lb-item${p.name===me?' me':''}\" style=\"display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;${p.name===me?'background:var(--gs);':''}margin-bottom:5px;border:1px solid var(--brd2);\">\n      <div style=\"width:26px;text-align:center;font-weight:900;font-size:15px;\">${medal}<\u002Fdiv>\n      ${avatarEl(p.name,34,15)}\n      <div style=\"flex:1;\"><div style=\"font-weight:800;font-size:13.5px;color:var(--tx);\">${p.name}${p.name===me?' <span style=\"font-size:10px;color:var(--green2);\">(تو)<\u002Fspan>':''}${g.owner===p.name?' 👑':''}<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--tx3);\">${FN(p.preds)} پیش‌بینی • ${FN(p.exact)} دقیق<\u002Fdiv><\u002Fdiv>\n      <div style=\"font-weight:900;font-size:17px;color:var(--green2);\">${FN(p.points)}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n  const isMember=g.members&&g.members[me];\n  // tabs: leaderboard + per-group prediction comparison\n  openModal(g.emoji+' '+g.name, `\n    <div style=\"display:flex;gap:6px;background:var(--sur2);padding:4px;border-radius:12px;margin-bottom:16px;\">\n      <button id=\"gtab-lb\" class=\"gtab gtab-on\" onclick=\"switchGroupTab('${id}','lb')\">🏆 جدول گروه<\u002Fbutton>\n      <button id=\"gtab-cmp\" class=\"gtab\" onclick=\"switchGroupTab('${id}','cmp')\">⚔️ مقایسه پیش‌بینی‌ها<\u002Fbutton>\n    <\u002Fdiv>\n    <div id=\"gpane-lb\">\n      <div style=\"font-size:12px;color:var(--tx3);margin-bottom:14px;\">${g.global?FN(board.length)+' بازیکن • جدول کل لیگ عمومی':FN(board.length)+' عضو • جدول رتبه‌بندی خصوصی این گروه'}<\u002Fdiv>\n      ${rows||'<div class=\"fg-empty\">هنوز عضوی نیست<\u002Fdiv>'}\n    <\u002Fdiv>\n    <div id=\"gpane-cmp\" style=\"display:none;\">\n      <div style=\"font-size:12px;color:var(--tx3);margin-bottom:10px;\">یه بازی انتخاب کن تا پیش‌بینی همهٔ اعضای این گروه رو کنار هم ببینی.<\u002Fdiv>\n      <select id=\"gcMatch_${id}\" onchange=\"renderGroupCompare('${id}')\" style=\"width:100%;height:40px;background:var(--sur2);border:1.5px solid var(--brd);border-radius:11px;color:var(--tx);font-size:13px;font-family:var(--font);font-weight:700;padding:0 10px;margin-bottom:14px;\">\n        ${MATCHES.map(m=>`<option value=\"${m.id}\">${m.home} — ${m.away} · ${matchDateLabel(m)}<\u002Foption>`).join('')}\n      <\u002Fselect>\n      <div id=\"gcResult_${id}\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:9px;margin-top:16px;\">\n      <button class=\"fg-btn fg-btn-primary\" style=\"flex:1;justify-content:center;\" onclick=\"shareGroupModal('${id}')\">${g.global?'📨 دعوت دوستان به اپ':'📨 دعوت دوستان'}<\u002Fbutton>\n      ${isMember&&!g.global&&g.owner!==me?`<button class=\"fg-chip\" style=\"flex:0 0 auto;padding:12px 16px;background:var(--reds);color:var(--red);\" onclick=\"leaveGroup('${id}')\">خروج<\u002Fbutton>`:''}\n    <\u002Fdiv>\n  `);\n  renderGroupCompare(id);\n}\n\nfunction switchGroupTab(id,tab){\n  document.getElementById('gpane-lb').style.display = tab==='lb'?'block':'none';\n  document.getElementById('gpane-cmp').style.display = tab==='cmp'?'block':'none';\n  document.getElementById('gtab-lb').classList.toggle('gtab-on',tab==='lb');\n  document.getElementById('gtab-cmp').classList.toggle('gtab-on',tab==='cmp');\n}\n\n// per-group prediction comparison for the selected match\nfunction renderGroupCompare(id){\n  const g=getGroup(id); if(!g)return;\n  const sel=document.getElementById('gcMatch_'+id);\n  const box=document.getElementById('gcResult_'+id);\n  if(!sel||!box)return;\n  const mid=parseInt(sel.value);\n  const m=MATCHES.find(x=>x.id===mid); if(!m)return;\n  const me=myName();\n  const fin=m.status==='finished'&&m.homeScore!==null;\n  const members=Object.keys(g.members||{});\n  // header showing the fixture / actual result\n  let head=`<div style=\"display:flex;align-items:center;justify-content:center;gap:10px;background:var(--sur2);border-radius:12px;padding:11px;margin-bottom:12px;font-weight:800;font-size:14px;color:var(--tx);\">\n    <span>${flag(m.home,20)} ${m.home}<\u002Fspan>\n    <span style=\"background:${fin?'var(--green2)':'var(--brd)'};color:${fin?'#fff':'var(--tx3)'};border-radius:8px;padding:3px 10px;font-size:13px;\">${fin?FN(m.homeScore)+' - '+FN(m.awayScore):'؟ - ؟'}<\u002Fspan>\n    <span>${m.away} ${flag(m.away,20)}<\u002Fspan>\n  <\u002Fdiv>`;\n  const rows=members.map(n=>{\n    const u=users[n];\n    const p=u&&u.preds&&u.preds[mid]&&u.preds[mid].saved?u.preds[mid]:null;\n    let right;\n    if(!p){\n      right=`<span style=\"font-size:11px;color:var(--tx3);font-weight:600;\">ثبت نکرده<\u002Fspan>`;\n    }else{\n      let tag='';\n      if(fin){\n        const pts=(typeof calcPoints==='function')?calcPoints(p,m):0;\n        const exact=p.home===m.homeScore&&p.away===m.awayScore;\n        const aw=m.homeScore>m.awayScore?'h':m.homeScore<m.awayScore?'a':'d';\n        const pw=p.home>p.away?'h':p.home<p.away?'a':'d';\n        const ok=aw===pw;\n        const col=exact?'var(--green2)':ok?'var(--gold)':'var(--red)';\n        const bg=exact?'var(--gs)':ok?'var(--golds)':'var(--reds)';\n        const lbl=exact?'دقیق! +'+FN(pts):ok?'درست +'+FN(pts):'غلط';\n        tag=`<span style=\"font-size:10px;font-weight:800;color:${col};background:${bg};padding:2px 8px;border-radius:20px;\">${lbl}<\u002Fspan>`;\n      }\n      right=`<span style=\"font-weight:900;font-size:15px;color:var(--tx);\">${FN(p.home)} - ${FN(p.away)}<\u002Fspan>${tag}`;\n    }\n    return `<div style=\"display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;margin-bottom:6px;border:1px solid var(--brd2);${n===me?'background:var(--gs);':'background:#fff;'}\">\n      ${avatarEl(n,30,13)}\n      <div style=\"flex:1;font-weight:700;font-size:13px;color:var(--tx);\">${n}${n===me?' <span style=\"font-size:10px;color:var(--green2)\">(تو)<\u002Fspan>':''}${g.owner===n?' 👑':''}<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;\">${right}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n  box.innerHTML=head+rows;\n}\n\n// ── Render friends page ──────────────────────────────────────────\nfunction renderFriends(){\n  const cont=document.getElementById('friendsContainer'); if(!cont)return;\n  const me=myName();\n  const gl=globalLeague();\n  const glBoard=groupBoard(gl);\n  const glCount=glBoard.length;\n  const myGl=glBoard.find(b=>b.name===me);\n  const real=myPrivateGroups();\n  let html=`<div class=\"fg-hero\">\n      <div style=\"position:relative;z-index:1;\">\n        <h2>🏆 با دوستات رقابت کن<\u002Fh2>\n        <p>تو از همین حالا توی «لیگ عمومی» با همه‌ی بازیکن‌ها رقابت می‌کنی. می‌خوای فقط بین رفقای خودت رقابت باشه؟ یه لیگ خصوصی بساز و لینکش رو بفرست.<\u002Fp>\n        <div class=\"fg-hero-actions\">\n          <button class=\"fg-btn fg-btn-primary\" onclick=\"createGroupModal()\">➕ ساخت لیگ خصوصی<\u002Fbutton>\n          <button class=\"fg-btn fg-btn-ghost\" onclick=\"nav('leaderboard')\">🌍 جدول کل<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n\n  // Global league — everyone is automatically in it (no floating users)\n  html+=`<div class=\"fg-global\" data-tour=\"global\" onclick=\"openGroup('global')\">\n      <div class=\"fg-global-emoji\">🌍<\u002Fdiv>\n      <div style=\"flex:1;min-width:0;\">\n        <div class=\"fg-global-name\">لیگ عمومی <span class=\"fg-global-tag\">عضو خودکار<\u002Fspan><\u002Fdiv>\n        <div class=\"fg-global-meta\">${FN(glCount)} بازیکن • با همه رقابت می‌کنی${myGl?' • رتبه‌ی تو <b style=\"color:#fff\">#'+FN(myGl.rank)+'<\u002Fb>':''}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fg-global-go\">جدول ←<\u002Fdiv>\n    <\u002Fdiv>`;\n\n  html+=`<div class=\"fg-sec-head\"><span>لیگ‌های خصوصی من<\u002Fspan><button class=\"fg-chip fg-chip-add\" onclick=\"event.stopPropagation();createGroupModal()\">➕ لیگ جدید<\u002Fbutton><\u002Fdiv>`;\n\n  if(!real.length){\n    html+=`<div class=\"card\"><div class=\"card-body\"><div class=\"fg-empty\">\n      <div class=\"fg-empty-ic\">👥<\u002Fdiv>\n      <div style=\"font-size:16px;font-weight:800;color:var(--tx);margin-bottom:6px;\">هنوز لیگ خصوصی‌ای نساختی<\u002Fdiv>\n      <div style=\"font-size:13px;margin-bottom:18px;line-height:1.8;\">یه لیگ بساز و لینکش رو برای دوستات بفرست.<br>هرکی لینک رو باز کنه مستقیم میاد تو لیگ شما — لازم نیست دستی اضافه‌اش کنی.<\u002Fdiv>\n      <button class=\"fg-btn fg-btn-primary\" style=\"margin:0 auto;\" onclick=\"createGroupModal()\">➕ همین حالا بساز<\u002Fbutton>\n    <\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  } else {\n    html+='<div class=\"fg-grid\">';\n    real.forEach(g=>{\n      const board=groupBoard(g);\n      const myRow=board.find(b=>b.name===me);\n      const top=board.slice(0,3).map(p=>{\n        const medal=p.rank===1?'🥇':p.rank===2?'🥈':'🥉';\n        return `<div class=\"fg-mini-row${p.name===me?' me':''}\"><span class=\"fg-mini-rank\">${medal}<\u002Fspan><span class=\"fg-mini-name\">${p.name}${g.owner===p.name?' 👑':''}<\u002Fspan><span class=\"fg-mini-pts\">${FN(p.points)}<\u002Fspan><\u002Fdiv>`;\n      }).join('');\n      html+=`<div class=\"fg-card\" onclick=\"openGroup('${g.id}')\">\n        <div class=\"fg-card-top\">\n          <div class=\"fg-emoji\">${g.emoji||'🏆'}<\u002Fdiv>\n          <div style=\"flex:1;min-width:0;\">\n            <div class=\"fg-card-name\">${g.name}<\u002Fdiv>\n            <div class=\"fg-card-meta\">${FN(board.length)} عضو${myRow?' • رتبه‌ی تو: '+'<b style=\\\"color:var(--green2)\\\">#'+FN(myRow.rank)+'<\u002Fb>':''}<\u002Fdiv>\n          <\u002Fdiv>\n          ${myRow&&myRow.rank<=3?`<span class=\"fg-rankpill\">${myRow.rank===1?'🥇':myRow.rank===2?'🥈':'🥉'}<\u002Fspan>`:''}\n        <\u002Fdiv>\n        <div class=\"fg-mini-lb\">${top||'<div style=\"font-size:12px;color:var(--tx3);text-align:center;padding:8px;\">هنوز امتیازی ثبت نشده<\u002Fdiv>'}<\u002Fdiv>\n        <div class=\"fg-card-foot\">\n          <button class=\"fg-chip\" onclick=\"event.stopPropagation();shareGroupModal('${g.id}')\">📨 دعوت<\u002Fbutton>\n          <button class=\"fg-chip\" onclick=\"event.stopPropagation();openGroup('${g.id}')\">📊 جدول کامل<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    });\n    html+='<\u002Fdiv>';\n  }\n  cont.innerHTML=html;\n}\n\n// rank summary inside profile: overall rank + rank in every league I'm in\nfunction renderProfileRanks(){\n  const el=document.getElementById('profileRanks'); if(!el)return;\n  const me=myName(); if(!me)return;\n  const gl=globalLeague();\n  const glBoard=groupBoard(gl);\n  const glRow=glBoard.find(b=>b.name===me);\n  const glRank=glRow?glRow.rank:glBoard.length;\n  const glTotal=glBoard.length;\n  const rows=[];\n  // Global league row (pinned)\n  rows.push({id:'global',name:'لیگ عمومی',emoji:'🌍',rank:glRank,total:glTotal,points:glRow?glRow.points:0,global:true});\n  // Each private league\n  myPrivateGroups().forEach(g=>{\n    const b=groupBoard(g); const r=b.find(x=>x.name===me);\n    rows.push({id:g.id,name:g.name,emoji:g.emoji||'🏆',rank:r?r.rank:b.length,total:b.length,points:r?r.points:0});\n  });\n  el.innerHTML=`<div class=\"rank-list\">${rows.map(r=>{\n    const medal=r.rank===1?'🥇':r.rank===2?'🥈':r.rank===3?'🥉':'';\n    const top=r.rank===1;\n    return `<div class=\"rank-row${r.global?' rank-row-g':''}\" onclick=\"openGroup('${r.id}')\">\n      <div class=\"rank-emoji\">${r.emoji}<\u002Fdiv>\n      <div class=\"rank-info\">\n        <div class=\"rank-name\">${r.name}<\u002Fdiv>\n        <div class=\"rank-sub\">${FN(r.total)} ${r.global?'بازیکن':'عضو'} • ${FN(r.points)} امتیاز<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rank-pos${top?' rank-pos-top':''}\">\n        ${medal?`<span class=\"rank-medal\">${medal}<\u002Fspan>`:''}\n        <span class=\"rank-num\">#${FN(r.rank)}<\u002Fspan>\n        <span class=\"rank-of\">از ${FN(r.total)}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('')}<\u002Fdiv>`;\n}\n\n// small list inside profile\nfunction renderProfileGroups(){\n  const el=document.getElementById('profileGroups'); if(!el)return;\n  const mine=myPrivateGroups();\n  if(!mine.length){ el.innerHTML=`<div class=\"card\"><div class=\"card-body\" style=\"text-align:center;padding:24px;color:var(--tx3);font-size:13px;\">هنوز عضو هیچ لیگ دوستانه‌ای نیستی. <a onclick=\"nav('friends')\" style=\"color:var(--green2);font-weight:800;cursor:pointer;\">یکی بساز ←<\u002Fa><\u002Fdiv><\u002Fdiv>`; return; }\n  el.innerHTML='<div class=\"fg-grid\">'+mine.map(g=>{\n    const board=groupBoard(g); const myRow=board.find(b=>b.name===myName());\n    return `<div class=\"fg-card\" onclick=\"nav('friends')\"><div class=\"fg-card-top\"><div class=\"fg-emoji\">${g.emoji}<\u002Fdiv><div style=\"flex:1;min-width:0;\"><div class=\"fg-card-name\">${g.name}<\u002Fdiv><div class=\"fg-card-meta\">${FN(board.length)} عضو • رتبه #${FN(myRow?myRow.rank:'-')}<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  }).join('')+'<\u002Fdiv>';\n}\n\n// ── Handle invite links ──────────────────────────────────────────\nfunction checkInviteHash(){\n  const m=location.hash.match(/join=([a-z0-9]+)/i);\n  if(m){\n    pendingJoin=m[1];\n    const b=document.getElementById('loginInviteBanner');\n    if(b)b.style.display='flex';\n  }\n}\nfunction processPendingJoin(){\n  if(!(pendingJoin && myName())) return;\n  const id=pendingJoin; pendingJoin=null;\n  history.replaceState(null,'',location.href.split('#')[0]);\n  // Wait until Firebase is connected so the group record can actually be fetched,\n  // otherwise the auto-join would silently fail with \"گروه پیدا نشد\".\n  let tries=0;\n  const attempt=()=>{\n    tries++;\n    if(fbReady || friendGroups[id] || tries>24){\n      nav('friends');\n      joinGroup(id);\n    } else {\n      setTimeout(attempt,300);\n    }\n  };\n  setTimeout(attempt,400);\n}\ncheckInviteHash();\n\n// ═════════════════════════════════════════════════════════════════\n// ██  LOGIN SCREEN — live atmosphere  ██\n// ═════════════════════════════════════════════════════════════════\nfunction lxBuildLogin(){\n  // flags marquee (decorative)\n  const fl=document.getElementById('lxFlags');\n  if(fl){\n    const codes=['br','ar','fr','de','es','pt','nl','gb-eng','hr','jp','mx','us','ma','ca','be','ir','sn','co','ch','au','no','dz','at','eg','uy','kr','sa','gh','pa','iq'];\n    const one=codes.map(c=>`<img src=\"https://flagcdn.com/w40/${c}.png\" alt=\"${c}\" loading=\"lazy\">`).join('');\n    fl.innerHTML=one+one;\n  }\n  // invite hint\n  if(pendingJoin){\n    const sub=document.querySelector('.lx-card-sub');\n    if(sub)sub.innerHTML='🎟️ یه دوست تو رو به یه لیگ خصوصی دعوت کرده! فقط اسمت رو بنویس تا عضو بشی.';\n    const t=document.querySelector('.lx-card-title');\n    if(t)t.textContent='به لیگ دوستانه بپیوند';\n  }\n}\ndocument.addEventListener('DOMContentLoaded',lxBuildLogin);\n\n// ═══════════════════════════════════════════════════════════════\n// ██  WELCOME TOUR — first login only  ██\n// ═══════════════════════════════════════════════════════════════\nconst TOUR_STEPS=[\n  {page:'predictions',emoji:'🎯',title:'نتیجه رو حدس بزن',\n   txt:'برای هر بازی با دکمه‌های + و − نتیجه رو ثبت کن. تا <b>۵ دقیقه قبل از شروع بازی<\u002Fb> هر چند بار خواستی می‌تونی تغییرش بدی.'},\n  {page:'leaderboard',emoji:'🌍',title:'تو الان توی لیگ عمومی هستی',\n   txt:'همه‌ی بازیکن‌ها خودکار عضو لیگ عمومی‌ان — لازم نیست کاری کنی. نتیجه دقیق <b>۱۰ امتیاز<\u002Fb>، برنده + تفاضل گل <b>۷<\u002Fb>، فقط برنده <b>۴<\u002Fb>.'},\n  {page:'friends',emoji:'👥',title:'با رفقات لیگ خصوصی بساز',\n   txt:'یه لیگ بساز و <b>لینکش<\u002Fb> رو بفرست. هرکی لینک رو باز کنه خودکار عضو لیگ شما می‌شه — بدون تأیید دستی.'},\n  {page:'profile',emoji:'📊',title:'رتبه‌هات همیشه اینجاست',\n   txt:'رتبه‌ی کلت بین همه + رتبه‌ت توی هر لیگ خصوصی، با آمار دقت پیش‌بینی‌هات. موفق باشی! 🍀'},\n];\nlet tourStep=0;\nfunction maybeStartTour(){\n  if(isAdmin)return;\n  try{ if(localStorage.getItem('wc26_tour_done'))return; }catch(_){ return; }\n  setTimeout(()=>startTour(),1400);\n}\nfunction startTour(){\n  tourStep=0;\n  if(document.getElementById('tourOverlay'))return;\n  const ov=document.createElement('div');\n  ov.id='tourOverlay';\n  ov.innerHTML='<div class=\"tour-card\" id=\"tourCard\"><\u002Fdiv>';\n  document.body.appendChild(ov);\n  renderTourStep();\n}\nfunction renderTourStep(){\n  const s=TOUR_STEPS[tourStep];\n  nav(s.page);\n  const card=document.getElementById('tourCard'); if(!card)return;\n  card.classList.remove('tour-card-in'); void card.offsetWidth; card.classList.add('tour-card-in');\n  card.innerHTML=`\n    <div class=\"tour-emoji\">${s.emoji}<\u002Fdiv>\n    <div class=\"tour-title\">${s.title}<\u002Fdiv>\n    <div class=\"tour-txt\">${s.txt}<\u002Fdiv>\n    <div class=\"tour-dots\">${TOUR_STEPS.map((_,i)=>`<span class=\"tour-dot${i===tourStep?' on':''}\"><\u002Fspan>`).join('')}<\u002Fdiv>\n    <div class=\"tour-btns\">\n      <button class=\"tour-skip\" onclick=\"endTour()\">رد کردن<\u002Fbutton>\n      ${tourStep>0?'<button class=\"tour-prev\" onclick=\"tourStep--;renderTourStep()\">قبلی<\u002Fbutton>':''}\n      <button class=\"tour-next\" onclick=\"tourNext()\">${tourStep===TOUR_STEPS.length-1?'شروع کن! 🚀':'بعدی ←'}<\u002Fbutton>\n    <\u002Fdiv>`;\n}\nfunction tourNext(){\n  if(tourStep>=TOUR_STEPS.length-1){ endTour(true); return; }\n  tourStep++; renderTourStep();\n}\nfunction endTour(finished){\n  try{ localStorage.setItem('wc26_tour_done','1'); }catch(_){}\n  const ov=document.getElementById('tourOverlay');\n  if(ov){ ov.classList.add('tour-out'); setTimeout(()=>ov.remove(),350); }\n  nav('dashboard');\n  if(finished){ confetti(); toast('حالا اولین پیش‌بینیت رو ثبت کن! 🎯','s',3500); }\n}\n\n// ===== INIT =====\nfunction initApp(){\n  // Show or hide admin nav item\n  const adminNav=document.getElementById('adminNavItem');\n  if(adminNav)adminNav.style.display=isAdmin?'flex':'none';\n  // Developer bar (Firebase / API / sync status) is admin-only\n  const devBar=document.getElementById('devBar');\n  if(devBar)devBar.style.display=isAdmin?'flex':'none';\n  // Manual live-sync button is admin-only too (data auto-syncs every 60s for everyone)\n  const syncBtn=document.getElementById('syncBtn');\n  if(syncBtn)syncBtn.style.display=isAdmin?'flex':'none';\n  // Firebase: connect and attach real-time listeners\n  initFirebase();\n  attachFbListeners();\n  // Register this user in the `users` node immediately on login, even before\n  // they make any prediction — otherwise they stay invisible to everyone else\n  // in the leaderboard / reports until their first pick.\n  // NAME ONLY: at this moment local stats are still 0 (the Firebase snapshot\n  // hasn't arrived yet) — writing full stats here was wiping everyone's real\n  // points/accuracy to zero on every login/refresh.\n  if (fbReady && currentUser && !currentUser.isAdmin) {\n    fbUpdate(`users/${currentUser.name}`, { name: currentUser.name });\n  }\n  updateBracketFromGroups(); propagateWinners(); syncKnockoutMatches();\n  renderDashMatches();\n  renderAllMatches();\n  renderMiniLb();\n  renderMiniAct();\n  updateStats();\n  updateGroupProgress();\n  setInterval(updateCountdown,1000);\n  updateCountdown();\n  // Live sync: fetch now, then every 60s\n  setSyncStatus('⏳ اتصال به TheSportsDB...','var(--blue)');\n  syncLiveData(true);\n  if(syncTimer)clearInterval(syncTimer);\n  syncTimer=setInterval(()=>syncLiveData(false),60000);\n  setTimeout(()=>toast(`خوش آمدی ${currentUser.name}! 👋 جام جهانی ۲۰۲۶ 🎉`,'i',4000),800);\n  addAct(currentUser.name,'وارد لیگ شد 🎉','g');\n  processPendingJoin();\n  maybeStartTour();\n}\n\nbuildQuickUsers();\n// ── Restore session: refresh shouldn't log the user out ──\nfunction _autoLogin(name){\n  isAdmin=false;\n  currentUser=getUser(name);\n  const ls=document.getElementById('loginScreen');\n  document.getElementById('appLayout').style.display='flex';\n  ls.style.display='none';\n  initApp();\n}\ntry{\n  const savedName=localStorage.getItem('wc26_user');\n  if(savedName){ _autoLogin(savedName); }\n}catch(_){}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
