QuickUsers();\n  setTimeout(()=>{if(ni)ni.focus();},100);\n}\n\n// ===== NAVIGATION =====\nconst PAGE_META={\n  dashboard:['داشبورد','جام جهانی ۲۰۲۶ 🌍'],\n  predictions:['پیش‌بینی بازی‌ها','⚽ نتایج را پیش‌بینی کنید'],\n  groups:['جداول گروه‌ها','📋 وضعیت ۱۲ گروه'],\n  bracket:['مرحله حذفی','🏆 جدول حذفی تا فینال'],\n  friends:['لیگ دوستان','👥 گروه بساز و با دوستات رقابت کن'],\n  compare:['مقایسه پیش‌بینی‌ها','🔍 پیش‌بینی من و بقیه'],\n  leaderboard:['جدول امتیازات','🏅 بهترین پیش‌بینی‌گران'],\n  activity:['فعالیت دوستان','📢 آخرین رویدادها'],\n  reports:['گزارش کاربران','📊 آمار کامل'],\n  rules:['قوانین لیگ','📜 قوانین و امتیازدهی'],\n  profile:['پروفایل من','👤 اطلاعات کاربری'],\n  admin:['پنل مدیریت','⚙️ ثبت نتایج و مدیریت'],\n};\n\nfunction nav(page){\n  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('active'));\n  document.getElementById('page-'+page).classList.add('active');\n  const ni=document.querySelector(`[data-page=\"${page}\"]`);\n  if(ni)ni.classList.add('active');\n  const[t,s]=PAGE_META[page]||[page,''];\n  document.getElementById('pageTitle').textContent=t;\n  document.getElementById('pageSub').textContent=s;\n  closeSb();\n  if(page==='activity'){document.getElementById('actBadge').style.display='none';renderFullAct();}\n  if(page==='reports')renderReports();\n  if(page==='leaderboard'){renderPodium();renderFullLb();}\n  if(page==='profile')renderProfile();\n  if(page==='admin'){\n    if(!isAdmin){toast('⛔ فقط ادمین دسترسی دارد','e',3000);nav('dashboard');return;}\n    renderAdminMatches();renderAdminUsers();\n  }\n  if(page==='groups')renderGroupTables();\n  if(page==='friends')renderFriends();\n  // sync bottom nav\n  document.querySelectorAll('.bni').forEach(b=>b.classList.toggle('active',b.dataset.page===page));\n  if(page==='compare'){populateCompareSelect();renderCompare();}\n  if(page==='predictions')renderAllMatches();\n  if(page==='bracket')renderBracket();\n}\n\nfunction toggleSb(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sbOverlay').classList.toggle('open');}\nfunction closeSb(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sbOverlay').classList.remove('open');}\nfunction focusSearch(){nav('predictions');setTimeout(()=>{const s=document.getElementById('matchSearch');if(s)s.focus();},100);}\n\n// ===== MODAL =====\nfunction openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalOverlay').classList.add('open');}\nfunction closeModal(e){if(!e||e.target===document.getElementById('modalOverlay'))document.getElementById('modalOverlay').classList.remove('open');}\ndocument.getElementById('modalBox').addEventListener('click',e=>e.stopPropagation());\n\nfunction showHelp(){\n  openModal('راهنمای امتیازدهی 🎯',`\n    <div style=\"font-size:13px;line-height:1.9\">\n      <div style=\"font-weight:800;font-size:14px;margin-bottom:10px;color:var(--tx)\">📋 سیستم امتیازدهی<\u002Fdiv>\n      <div style=\"padding:10px 12px;background:var(--gs);border-radius:8px;border:1px solid rgba(10,191,111,.2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;\">\n        <span>🎯 <strong>نتیجه کاملاً دقیق<\u002Fstrong> (گل به گل)<\u002Fspan>\n        <span style=\"font-weight:900;font-size:16px;color:var(--green)\">۸ امتیاز<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:10px 12px;background:var(--blues);border-radius:8px;border:1px solid rgba(45,127,232,.2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;\">\n        <span>⚡ <strong>برنده + تفاضل گل<\u002Fstrong> درست<\u002Fspan>\n        <span style=\"font-weight:900;font-size:16px;color:var(--blue)\">۵ امتیاز<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:10px 12px;background:var(--golds);border-radius:8px;border:1px solid rgba(232,156,10,.2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;\">\n        <span>✅ <strong>فقط برنده<\u002Fstrong> یا تساوی درست<\u002Fspan>\n        <span style=\"font-weight:900;font-size:16px;color:var(--gold)\">۳ امتیاز<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:10px 12px;background:var(--vios);border-radius:8px;border:1px solid rgba(124,58,237,.2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;\">\n        <span>🏟️ <strong>وقت اضافه / پنالتی<\u002Fstrong> درست (مراحل حذفی)<\u002Fspan>\n        <span style=\"font-weight:900;font-size:16px;color:var(--vio)\">+۲ بونوس<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:10px 12px;background:var(--reds);border-radius:8px;border:1px solid rgba(232,48,80,.15);margin-bottom:12px;display:flex;justify-content:space-between;\">\n        <span>❌ <strong>پیش‌بینی اشتباه<\u002Fstrong><\u002Fspan>\n        <span style=\"font-weight:900;font-size:16px;color:var(--red)\">۰ امتیاز<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--tx3);background:var(--sur2);padding:10px;border-radius:8px;\">\n        ⚡ وقتی ادمین نتیجه ثبت کنه، امتیاز <strong>همه<\u002Fstrong> کاربران خودکار آپدیت میشه\n      <\u002Fdiv>\n    <\u002Fdiv>`);\n}\n\nfunction showNotifs(){\n  openModal('اعلان‌ها 🔔',activityFeed.length?`\n    <div class=\"act-list\">${activityFeed.slice(0,6).map(a=>`\n      <div class=\"act-item\"><div class=\"adot ${a.type}\"><\u002Fdiv>\n      <div><div class=\"atext\"><strong>${a.user}<\u002Fstrong> ${a.text}<\u002Fdiv><div class=\"atime\">${timeAgo(a.time)}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>`).join('')}<\u002Fdiv>`:'<div style=\"padding:20px;text-align:center;color:var(--tx3)\">هنوز اعلانی نیست<\u002Fdiv>');\n}\n\n// ===== MATCH CARD =====\nfunction renderMatchCard(match,inDash=false){\n  const isUp=match.status==='upcoming';\n  // Lock prediction only once the REAL kickoff time (synced from the API) has\n  // passed. Fixtures still carrying the placeholder time (hasRealTime not set)\n  // must NEVER lock pre-emptively — they only lock the instant the API marks\n  // them live/finished (which flips status, hiding the prediction UI anyway).\n  const matchTime = (match.hasRealTime && match.dateObj) ? new Date(match.dateObj) : null;\n  const now_t = new Date();\n  const minsUntil = matchTime ? (matchTime - now_t) / 60000 : 999;\n  // Group matches lock at their real (API-synced) kickoff. Knockout matches have\n  // no synced kickoff time, so they stay open for predictions until the admin\n  // posts the result (status flips to 'finished' → card becomes read-only).\n  const isLocked = !match.knockout && isUp && matchTime && (now_t - matchTime) >= 0;\n  const isLive=match.status==='live';\n  const isFin=match.status==='finished';\n  const u=currentUser;\n  const pred=u&&u.preds&&u.preds[match.id]?u.preds[match.id]:{home:0,away:0,saved:false};\n  const hf=flag(match.home);const af=flag(match.away);\n  const allCmts=getAllCmts(match.id);\n  const cc=allCmts.length;\n\n  let scoreArea=isLive||isFin\n    ?`<div class=\"score-disp\"><span>${FN(match.homeScore)}<\u002Fspan><span style=\"color:var(--tx3);margin:0 4px\">-<\u002Fspan><span>${FN(match.awayScore)}<\u002Fspan><\u002Fdiv>`\n    :`<div class=\"vs-btn\">VS<\u002Fdiv>`;\n\n  let predArea='';\n  if(!inDash&&isUp&&!isLocked){\n    const isKnockout=!['A','B','C','D','E','F','G','H','I','J','K','L'].includes(match.group);\n    predArea=`<div class=\"pred-area\">\n      <div class=\"pred-label\">🎯 پیش‌بینی من<\u002Fdiv>\n      <div class=\"sinputs\">\n        <div class=\"sgroup\">\n          <button class=\"sbtn\" onclick=\"chP(${match.id},'h',-1,event)\">−<\u002Fbutton>\n          <div class=\"snum\" id=\"ph-${match.id}\">${FN(pred.home)}<\u002Fdiv>\n          <button class=\"sbtn\" onclick=\"chP(${match.id},'h',1,event)\">+<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"psep\">:<\u002Fdiv>\n        <div class=\"sgroup\">\n          <button class=\"sbtn\" onclick=\"chP(${match.id},'a',-1,event)\">−<\u002Fbutton>\n          <div class=\"snum\" id=\"pa-${match.id}\">${FN(pred.away)}<\u002Fdiv>\n          <button class=\"sbtn\" onclick=\"chP(${match.id},'a',1,event)\">+<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      ${isKnockout?`\n      <div style=\"margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;\">\n        <span style=\"font-size:10px;color:var(--tx3);font-weight:700;\">در صورت تساوی:<\u002Fspan>\n        <label style=\"display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer;\">\n          <input type=\"radio\" name=\"ot-${match.id}\" value=\"none\" ${(!pred.extra||pred.extra==='none')?'checked':''} onchange=\"chExtra(${match.id},'none')\">\n          <span>نود دقیقه<\u002Fspan>\n        <\u002Flabel>\n        <label style=\"display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer;\">\n          <input type=\"radio\" name=\"ot-${match.id}\" value=\"et\" ${pred.extra==='et'?'checked':''} onchange=\"chExtra(${match.id},'et')\">\n          <span>⏱ وقت اضافه<\u002Fspan>\n        <\u002Flabel>\n        <label style=\"display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer;\">\n          <input type=\"radio\" name=\"ot-${match.id}\" value=\"pen\" ${pred.extra==='pen'?'checked':''} onchange=\"chExtra(${match.id},'pen')\">\n          <span>🥅 پنالتی<\u002Fspan>\n        <\u002Flabel>\n      <\u002Fdiv>`:''}\n      <div class=\"pactions\">\n        ${pred.saved\n          ?`<span class=\"saved-pred\">✅ ${FN(pred.home)}-${FN(pred.away)}${pred.extra&&pred.extra!=='none'?' ('+( pred.extra==='et'?'وقت اضافه':'پنالتی')+')':''}<\u002Fspan>\n            <button class=\"btn btn-sec btn-sm\" onclick=\"editP(${match.id},event)\">✏️ ویرایش<\u002Fbutton>`\n          :`<button class=\"btn btn-g btn-sm\" onclick=\"saveP(${match.id},event)\">💾 ذخیره<\u002Fbutton>`}\n      <\u002Fdiv><\u002Fdiv>`;\n  }else if(!inDash&&isUp&&isLocked){\n    const p=u&&u.preds&&u.preds[match.id];\n    predArea=`<div class=\"pred-area\" style=\"background:rgba(232,48,80,.04);\">\n      <div style=\"display:flex;align-items:center;gap:8px;font-size:12px;\">\n        <span style=\"font-size:16px;\">🔒<\u002Fspan>\n        <span style=\"font-weight:700;color:var(--red)\">پیش‌بینی قفل شد<\u002Fspan>\n        ${p&&p.saved?`<span style=\"color:var(--tx3)\">— پیش‌بینی شما: ${FN(p.home)}-${FN(p.away)}<\u002Fspan>`:'<span style=\"color:var(--tx3)\">— پیش‌بینی ثبت نشده<\u002Fspan>'}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }else if(isFin&&u&&u.preds&&u.preds[match.id]){\n    const p=u.preds[match.id];\n    const pts=calcPoints(p,match);\n    const badges=buildResultBadges(p,match);\n    const extraTxt=p.extra&&p.extra!=='none'?` (${p.extra==='et'?'وقت اضافه':'پنالتی'})`:'';\n    predArea=`<div class=\"pred-area\">\n      <div class=\"pred-label\" style=\"display:flex;align-items:center;gap:6px;flex-wrap:wrap;\">\n        <span>پیش‌بینی: ${FN(p.home)}-${FN(p.away)}${extraTxt}<\u002Fspan>\n        ${badges}\n        ${pts>0?`<span style=\"font-weight:900;color:var(--green);font-size:13px;\">+${FN(pts)} امتیاز<\u002Fspan>`:''}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }\n\n  let commentSection='';\n  if(!inDash){\n    commentSection=`<div class=\"comment-sec\">\n      <button class=\"ctoggle\" onclick=\"toggleCmts(${match.id},this)\">\n        💬 <span class=\"cc\">${cc}<\u002Fspan> کامنت\n        <span style=\"margin-right:auto;font-size:10px;opacity:.5\">▼<\u002Fspan>\n      <\u002Fbutton>\n      <div class=\"cbox\" id=\"cmts-${match.id}\">\n        <div class=\"clist\" id=\"clist-${match.id}\">${allCmts.map(c=>cmtHtml(c,match.id)).join('')}<\u002Fdiv>\n        <div class=\"cinrow\">\n          <input class=\"cinput\" type=\"text\" id=\"cin-${match.id}\" placeholder=\"نظرت رو بنویس...\">\n          <button class=\"btn btn-b btn-sm\" onclick=\"addCmt(${match.id})\">ارسال 💬<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }\n\n  return `<div class=\"match-card${isLive?' live':''}\">\n    ${isLive?'<div class=\"live-bar\"><\u002Fdiv>':''}\n    <div class=\"mc-top\">\n      <div class=\"match-meta\">\n        <span class=\"mg\">${match.knockout ? match.koLabel : 'گروه '+match.group} • ${matchDateLabel(match)}<\u002Fspan>\n        ${isLive?`<span class=\"lb-badge\">🔴 زنده<\u002Fspan>`:(match.time?`<span class=\"mt\">${match.time}<\u002Fspan>`:'')}\n      <\u002Fdiv>\n      <div class=\"match-teams\">\n        <div class=\"mteam\"><div class=\"mflag\">${hf}<\u002Fdiv><div class=\"mname\">${match.home}<\u002Fdiv><\u002Fdiv>\n        <div class=\"score-area\">${scoreArea}<\u002Fdiv>\n        <div class=\"mteam\"><div class=\"mflag\">${af}<\u002Fdiv><div class=\"mname\">${match.away}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      ${(match.stadium||match.ref)?`<div class=\"mc-venue\">\n        ${match.stadium?`<span class=\"mcv-item\"><span class=\"mcv-ico\">📍<\u002Fspan>${match.stadium}${match.city?'، '+match.city:''}<\u002Fspan>`:''}\n        ${match.ref?`<span class=\"mcv-item\"><span class=\"mcv-ico\">🟨<\u002Fspan>داور: ${match.ref}<\u002Fspan>`:''}\n      <\u002Fdiv>`:''}\n    <\u002Fdiv>\n    ${predArea}${commentSection}\n  <\u002Fdiv>`;\n}\n\nfunction escHtml(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));}\nfunction renderMentions(text){return escHtml(text).replace(/@([^\\s@]+)/g,'<span class=\"cmention\">@$1<\u002Fspan>');}\nfunction cmtHtml(c,mid){\n  const replyChip=c.reply?`<span class=\"creply\">↩ در پاسخ به ${escHtml(c.reply)}<\u002Fspan>`:'';\n  const replyBtn=(mid!=null)?`<button class=\"creplybtn\" onclick=\"replyTo(${mid},this)\">↩ پاسخ<\u002Fbutton>`:'';\n  return `<div class=\"citem\" data-cuser=\"${escHtml(c.user)}\">\n  <div class=\"cav\" style=\"background:${astyle(c.user)}\">${uinit(c.user)}<\u002Fdiv>\n  <div class=\"cbody\"><div class=\"cmeta\"><span class=\"cname\">${escHtml(c.user)}<\u002Fspan><span class=\"ctime\">${timeAgo(c.time)}<\u002Fspan>${replyBtn}<\u002Fdiv>${replyChip}<div class=\"ctext\">${renderMentions(c.text)}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>`;}\n\n// ===== COMMENTS =====\nconst pendingReply={}; // mid -> name being replied to (set by replyTo button)\nfunction replyTo(mid,btn){\n  const item=btn.closest('.citem');\n  const name=item?item.getAttribute('data-cuser'):'';\n  if(!name)return;\n  pendingReply[mid]=name;\n  const box=document.getElementById('cmts-'+mid);\n  if(box&&!box.classList.contains('open'))box.classList.add('open');\n  const inp=document.getElementById('cin-'+mid);\n  if(inp){inp.value='@'+name+' ';inp.focus();}\n}\nfunction getAllCmts(matchId){\n  let all=[];\n  Object.values(users).forEach(u=>{if(u.comments&&u.comments[matchId])u.comments[matchId].forEach(c=>all.push({...c,user:u.name}));});\n  return all;\n}\nfunction toggleCmts(mid,btn){\n  const box=document.getElementById('cmts-'+mid);\n  box.classList.toggle('open');\n  const arr=btn.querySelector('span:last-child');\n  if(arr)arr.textContent=box.classList.contains('open')?'▲':'▼';\n}\nfunction addCmt(mid){\n  const inp=document.getElementById('cin-'+mid);\n  const text=inp?.value?.trim();\n  if(!text){toast('متن کامنت را وارد کنید','e');return;}\n  if(!currentUser)return;\n  const reply=pendingReply[mid]||null;\n  if(!currentUser.comments[mid])currentUser.comments[mid]=[];\n  const cobj={text,time:now(),reply};\n  currentUser.comments[mid].unshift(cobj);\n  fbSaveComment(mid, cobj);  // ← ذخیره در Firebase\n  delete pendingReply[mid];\n  const all=getAllCmts(mid);\n  const listEl=document.getElementById('clist-'+mid);\n  if(listEl)listEl.innerHTML=all.map(c=>cmtHtml(c,mid)).join('');\n  const toggleBtn=document.querySelector(`[onclick=\"toggleCmts(${mid},this)\"]`);\n  if(toggleBtn)toggleBtn.innerHTML=`💬 <span class=\"cc\">${all.length}<\u002Fspan> کامنت <span style=\"margin-right:auto;font-size:10px;opacity:.5\">▲<\u002Fspan>`;\n  inp.value='';\n  const m=MATCHES.find(m=>m.id===mid);\n  addAct(currentUser.name,`کامنت گذاشت روی ${m?m.home+' 🆚 '+m.away:'بازی'}`,'b');\n  toast('کامنت ثبت شد 💬','i',2000);\n}\n\n// ===== PREDICTIONS =====\nfunction renderDashMatches(){\n  const shown=MATCHES.filter(m=>m.status==='live'||m.status==='upcoming').slice(0,3);\n  document.getElementById('dashMatches').innerHTML=shown.map(m=>renderMatchCard(m,true)).join('')\n    ||'<div style=\"padding:20px;text-align:center;color:var(--tx3)\">بازی فعال یا آتی وجود ندارد<\u002Fdiv>';\n}\nfunction renderAllMatches(){\n  const s=(document.getElementById('matchSearch')?.value||'').toLowerCase();\n  let list=MATCHES;\n  if(currentFilter!=='all')list=list.filter(m=>m.status===currentFilter);\n  if(s)list=list.filter(m=>m.home.toLowerCase().includes(s)||m.away.toLowerCase().includes(s)||m.group.toLowerCase().includes(s));\n  document.getElementById('allMatchesList').innerHTML=list.map(m=>renderMatchCard(m,false)).join('')\n    ||'<div style=\"padding:40px;text-align:center;color:var(--tx3)\">بازی‌ای یافت نشد<\u002Fdiv>';\n}\nfunction filterMatches(){renderAllMatches();}\nfunction setFilter(f,btn){currentFilter=f;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderAllMatches();}\n\nfunction chP(mid,side,delta,e){\n  if(e)e.stopPropagation();\n  const u=currentUser;if(!u)return;\n  if(!u.preds[mid])u.preds[mid]={home:0,away:0,saved:false};\n  const p=u.preds[mid];\n  if(side==='h'){p.home=Math.max(0,Math.min(20,p.home+delta));const el=document.getElementById('ph-'+mid);if(el)el.textContent=FN(p.home);}\n  else{p.away=Math.max(0,Math.min(20,p.away+delta));const el=document.getElementById('pa-'+mid);if(el)el.textContent=FN(p.away);}\n}\nfunction saveP(mid,e){\n  if(e)e.stopPropagation();\n  if(!currentUser)return;\n  const u=currentUser;\n  if(!u.preds[mid])u.preds[mid]={home:0,away:0,saved:false,extra:'none'};\n  u.preds[mid].saved=true;\n  if(!(u.preds[mid].extra))u.preds[mid].extra='none';\n  u.predictions=Object.values(u.preds).filter(p=>p&&p.saved).length;\n  const m=MATCHES.find(m=>m.id===mid);const p=u.preds[mid];\n  const extraTxt=p.extra&&p.extra!=='none'?' ('+( p.extra==='et'?'وقت اضافه':'پنالتی')+')':'';\n  addAct(u.name,`پیش‌بینی کرد: ${m.home} ${FN(p.home)}-${FN(p.away)} ${m.away}${extraTxt}`,'g');\n  renderAllMatches();renderDashMatches();updateStats();\n\n  // Confirm the write actually REACHED the server. In Iran, Firebase is often\n  // filtered, so writes fail/queue silently and the player thinks they saved.\n  if (!fbReady || isAdmin) { toast('پیش‌بینی ذخیره شد 🎯','s'); return; }\n  if (_fbConnected === false) {\n    toast('⚠️ پیش‌بینی روی این دستگاه ذخیره شد ولی به سرور نرسید (اتصال قطع است). VPN را روشن کن و دوباره روی ذخیره بزن، وگرنه برای بقیه ثبت نمی‌شود.','e',7000);\n    return;\n  }\n  let settled=false;\n  const timer=setTimeout(()=>{ if(settled)return; settled=true;\n    toast('⚠️ پیش‌بینی روی این دستگاه ذخیره شد ولی به سرور نرسید. اتصال/VPN را چک کن و دوباره روی ذخیره بزن.','e',7000);\n  },6000);\n  Promise.resolve(fbSavePred(mid, p))\n    .then(()=>{ if(settled)return; settled=true; clearTimeout(timer); toast('پیش‌بینی ذخیره و همگام شد 🎯','s'); })\n    .catch(()=>{ if(settled)return; settled=true; clearTimeout(timer); toast('⚠️ ذخیره روی سرور ناموفق بود. اتصال/VPN را چک کن و دوباره بزن.','e',7000); });\n}\n// ── SCORING SYSTEM ─────────────────────────────────────────────────────────\n// Exact score:              10 pts\n// Correct winner+goal diff:  7 pts\n// Correct winner/draw only:  4 pts\n// Correct OT/Pen (knockout): +2 bonus\n// Streak (3 correct in row): +3 bonus (calculated in rebuildAllStats)\n//\nfunction calcPoints(pred, match) {\n  if (!pred||!pred.saved||match.homeScore===null||match.awayScore===null) return 0;\n  const hs=match.homeScore, as=match.awayScore;\n  const ph=pred.home, pa=pred.away;\n  const actualWinner = hs>as?'h':hs<as?'a':'d';\n  const predWinner   = ph>pa?'h':ph<pa?'a':'d';\n  if (actualWinner!==predWinner) return 0; // wrong\n\n  let pts=0;\n  if (ph===hs && pa===as) {\n    pts=10; // exact\n  } else if ((hs-as)===(ph-pa)) {\n    pts=7;  // correct winner + goal difference\n  } else {\n    pts=4;  // correct winner or draw\n  }\n  // Bonus: correct OT/Pen (knockout)\n  if (match.extra && pred.extra && pred.extra!=='none' && pred.extra===match.extra) pts+=2;\n  return pts;\n}\n\nfunction buildResultBadges(pred, match) {\n  if (!pred||!pred.saved||match.homeScore===null) return '';\n  const hs=match.homeScore, as=match.awayScore;\n  const ph=pred.home, pa=pred.away;\n  const actualW=hs>as?'h':hs<as?'a':'d';\n  const predW=ph>pa?'h':ph<pa?'a':'d';\n  let badges='';\n  if (ph===hs&&pa===as) {\n    badges+=`<span class=\"prb exact\">🎯 دقیق<\u002Fspan>`;\n  } else if (actualW===predW) {\n    if ((hs-as)===(ph-pa)) {\n      badges+=`<span class=\"prb\" style=\"background:var(--vios);color:var(--vio);border:1px solid rgba(124,58,237,.2)\">⚡ برنده+تفاضل<\u002Fspan>`;\n    } else {\n      badges+=`<span class=\"prb winner\">✅ برنده درست<\u002Fspan>`;\n    }\n  } else {\n    badges+=`<span class=\"prb wrong\">❌ اشتباه<\u002Fspan>`;\n  }\n  if (match.extra&&pred.extra&&pred.extra!=='none'&&pred.extra===match.extra)\n    badges+=`<span class=\"prb\" style=\"background:var(--golds);color:var(--gold);border:1px solid rgba(232,156,10,.2)\">🏟️ ${pred.extra==='et'?'وقت اضافه':'پنالتی'}<\u002Fspan>`;\n  return badges;\n}\n\nfunction chExtra(mid, val, e) {\n  if(e)e.stopPropagation();\n  const u=currentUser; if(!u)return;\n  if(!u.preds[mid])u.preds[mid]={home:0,away:0,saved:false,extra:'none'};\n  u.preds[mid].extra=val;\n}\n\nfunction editP(mid,e){\n  if(e)e.stopPropagation();\n  if(currentUser&&currentUser.preds[mid])currentUser.preds[mid].saved=false;\n  renderAllMatches();renderDashMatches();\n}\n\n// ===== GROUP TABLES =====\nfunction updateGroupStats(matchId){\n  const m=MATCHES.find(m=>m.id===matchId);\n  if(!m||m.homeScore===null)return;\n  const gs=GROUP_STATS[m.group];if(!gs)return;\n  if(!gs[m.home])gs[m.home]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};\n  if(!gs[m.away])gs[m.away]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};\n  const h=gs[m.home],a=gs[m.away];\n  h.p++;a.p++;h.gf+=m.homeScore;h.ga+=m.awayScore;a.gf+=m.awayScore;a.ga+=m.homeScore;\n  if(m.homeScore>m.awayScore){h.w++;h.pts+=3;a.l++;}\n  else if(m.homeScore===m.awayScore){h.d++;h.pts+=1;a.d++;a.pts+=1;}\n  else{a.w++;a.pts+=3;h.l++;}\n}\n\nfunction getGroupRanking(groupKey){\n  const group=GROUPS[groupKey];if(!group)return[];\n  const gs=GROUP_STATS[groupKey]||{};\n  return [...group.teams].sort((a,b)=>{\n    const sa=gs[a]||{pts:0,gf:0,ga:0,w:0};const sb=gs[b]||{pts:0,gf:0,ga:0,w:0};\n    if(sb.pts!==sa.pts)return sb.pts-sa.pts;\n    if((sb.gf-sb.ga)!==(sa.gf-sa.ga))return(sb.gf-sb.ga)-(sa.gf-sa.ga);\n    return sb.gf-sa.gf;\n  });\n}\n\nfunction renderGroupTables(){\n  const cont=document.getElementById('groupTablesContainer');\n  let html='<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;\">';\n  Object.entries(GROUPS).forEach(([key,group])=>{\n    const gs=GROUP_STATS[key]||{};\n    const teams=getGroupRanking(key);\n    const anyPlayed=teams.some(t=>(gs[t]||{p:0}).p>0);\n    html+=`<div class=\"card\">\n      <div class=\"group-header\" style=\"background:linear-gradient(135deg,var(--green),var(--green2));padding:10px 14px;display:flex;align-items:center;justify-content:space-between;\">\n        <div style=\"font-size:13px;font-weight:900;color:#fff\">📋 ${group.name}<\u002Fdiv>\n        <div style=\"display:flex;gap:5px;\">${teams.slice(0,2).map(t=>`${flag(t,20)}`).join('')}<\u002Fdiv>\n      <\u002Fdiv>\n      <table class=\"group-table\" style=\"width:100%;border-collapse:collapse;\">\n        <thead><tr>\n          <th style=\"text-align:right;padding:7px 10px;font-size:10px;color:var(--tx3);background:var(--sur2);\">تیم<\u002Fth>\n          <th title=\"تعداد بازی‌های انجام‌شده\" style=\"text-align:center;padding:7px 5px;font-size:10px;color:var(--tx3);background:var(--sur2);\">بازی<\u002Fth>\n          <th title=\"برد\" style=\"text-align:center;padding:7px 5px;font-size:10px;color:var(--tx3);background:var(--sur2);\">برد<\u002Fth>\n          <th title=\"مساوی\" style=\"text-align:center;padding:7px 5px;font-size:10px;color:var(--tx3);background:var(--sur2);\">مساوی<\u002Fth>\n          <th title=\"باخت\" style=\"text-align:center;padding:7px 5px;font-size:10px;color:var(--tx3);background:var(--sur2);\">باخت<\u002Fth>\n          <th title=\"گل زده - گل خورده\" style=\"text-align:center;padding:7px 5px;font-size:10px;color:var(--tx3);background:var(--sur2);\">گل<\u002Fth>\n          <th style=\"text-align:center;padding:7px 8px;font-size:10px;color:var(--tx3);background:var(--sur2);font-weight:900;\">امتیاز<\u002Fth>\n        <\u002Ftr><\u002Fthead>\n        <tbody>${teams.map((t,i)=>{\n          const s=gs[t]||{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};\n          const qualify=i<2&&anyPlayed;const maybe=i===2&&anyPlayed;\n          const rowStyle=qualify?'background:rgba(10,191,111,0.06);':maybe?'background:rgba(232,156,10,0.06);':'';\n          const badge=qualify?`<span style=\"width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-left:4px;\"><\u002Fspan>`:maybe?`<span style=\"width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block;margin-left:4px;\"><\u002Fspan>`:'';\n          return `<tr style=\"${rowStyle}\">\n            <td style=\"padding:8px 10px;border-bottom:1px solid var(--brd2);cursor:pointer;\" onclick=\"openTeamModal('${t.replace(/'/g,\"\\\\'\")}')\" title=\"بازی‌های ${t}\">\n              <div style=\"display:flex;align-items:center;gap:6px;font-weight:700;font-size:12px;color:var(--tx);\">\n                ${badge}${flag(t,20)}${t}<span style=\"margin-right:auto;color:var(--tx3);font-size:11px;\">›<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Ftd>\n            <td style=\"text-align:center;padding:8px 5px;border-bottom:1px solid var(--brd2);font-size:12px;color:var(--tx2)\">${FN(s.p)||'-'}<\u002Ftd>\n            <td style=\"text-align:center;padding:8px 5px;border-bottom:1px solid var(--brd2);font-size:12px;color:var(--tx2)\">${FN(s.w)||'-'}<\u002Ftd>\n            <td style=\"text-align:center;padding:8px 5px;border-bottom:1px solid var(--brd2);font-size:12px;color:var(--tx2)\">${FN(s.d)||'-'}<\u002Ftd>\n            <td style=\"text-align:center;padding:8px 5px;border-bottom:1px solid var(--brd2);font-size:12px;color:var(--tx2)\">${FN(s.l)||'-'}<\u002Ftd>\n            <td style=\"text-align:center;padding:8px 5px;border-bottom:1px solid var(--brd2);font-size:12px;color:var(--tx3)\">${s.p>0?FN(s.gf)+'-'+FN(s.ga):'-'}<\u002Ftd>\n            <td style=\"text-align:center;padding:8px 8px;border-bottom:1px solid var(--brd2);font-size:14px;font-weight:900;color:var(--green)\">${FN(s.pts)||'—'}<\u002Ftd>\n          <\u002Ftr>`;\n        }).join('')}<\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>`;\n  });\n  html+='<\u002Fdiv>';\n  html+=`<div style=\"padding:10px 14px;background:var(--sur2);border-radius:var(--r3);font-size:11px;color:var(--tx3);display:flex;gap:16px;flex-wrap:wrap;\">\n    <span><span style=\"width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-left:4px;vertical-align:middle;\"><\u002Fspan>صعود قطعی<\u002Fspan>\n    <span><span style=\"width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block;margin-left:4px;vertical-align:middle;\"><\u002Fspan>احتمال صعود<\u002Fspan>\n    <span>ب=بازی • پ=پیروزی • ت=تساوی • ش=شکست • گل=زده‑خورده<\u002Fspan>\n  <\u002Fdiv>`;\n  cont.innerHTML=html;\n}\n\n// ─── TEAM DETAIL MODAL — fixtures + standing + news ──────────────────────────\nfunction openTeamModal(team){\n  // locate group\n  let gkey=null;\n  Object.keys(GROUPS).forEach(k=>{ if(GROUPS[k].teams.includes(team)) gkey=k; });\n  const s=(gkey&&GROUP_STATS[gkey]&&GROUP_STATS[gkey][team])||{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};\n  const tms=MATCHES.filter(m=>m.home===team||m.away===team);\n  const u=currentUser;\n  const statusMap={upcoming:['🔵 پیش‌رو','var(--blue)','var(--blues)'],live:['🔴 زنده','var(--red)','var(--reds)'],finished:['✅ تمام‌شده','var(--green2)','var(--gs)']};\n\n  const fixtures=tms.map(m=>{\n    const opp=m.home===team?m.away:m.home;\n    const homeAway=m.home===team?'خانه':'میهمان';\n    const [stLbl,stCol,stBg]=statusMap[m.status]||statusMap.upcoming;\n    let score='';\n    if(m.status==='finished'&&m.homeScore!==null){\n      const tg=m.home===team?m.homeScore:m.awayScore;\n      const og=m.home===team?m.awayScore:m.homeScore;\n      const res=tg>og?'برد':tg<og?'باخت':'مساوی';\n      const rc=tg>og?'var(--green2)':tg<og?'var(--red)':'var(--tx2)';\n      score=`<span style=\"font-weight:900;font-size:15px;color:var(--tx);\">${FN(tg)} - ${FN(og)}<\u002Fspan> <span style=\"font-size:10px;font-weight:800;color:${rc};\">${res}<\u002Fspan>`;\n    } else {\n      score=`<span style=\"font-size:11px;color:var(--tx3);\">${matchDateLabel(m)}${m.time?' • '+m.time:''}<\u002Fspan>`;\n    }\n    const mypred=u&&u.preds&&u.preds[m.id]&&u.preds[m.id].saved?u.preds[m.id]:null;\n    const ph=mypred?(m.home===team?mypred.home:mypred.away):null;\n    const pa=mypred?(m.home===team?mypred.away:mypred.home):null;\n    const predLine=mypred?`<div style=\"font-size:10.5px;color:var(--green2);font-weight:700;margin-top:3px;\">پیش‌بینی تو: ${FN(ph)}-${FN(pa)}<\u002Fdiv>`:'';\n    return `<div style=\"display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--brd2);border-radius:12px;margin-bottom:7px;background:#fff;\">\n      ${flag(opp,26)}\n      <div style=\"flex:1;min-width:0;\">\n        <div style=\"font-weight:800;font-size:13px;color:var(--tx);\">مقابل ${opp}<\u002Fdiv>\n        <div style=\"font-size:10.5px;color:var(--tx3);\">گروه ${m.group} • ${homeAway}<\u002Fdiv>\n        ${predLine}\n      <\u002Fdiv>\n      <div style=\"text-align:left;display:flex;flex-direction:column;align-items:flex-end;gap:4px;\">\n        ${score}\n        <span style=\"font-size:9px;font-weight:800;color:${stCol};background:${stBg};padding:2px 7px;border-radius:20px;\">${stLbl}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n\n  const news='https://news.google.com/search?q='+encodeURIComponent(team+' فوتبال جام جهانی')+'&hl=fa-IR&gl=IR&ceid=IR:fa';\n  openModal(`${flagTxt(team)} ${team}`, `\n    <div style=\"display:flex;align-items:center;gap:12px;background:var(--sur2);border-radius:14px;padding:13px 15px;margin-bottom:16px;\">\n      ${flag(team,40)}\n      <div style=\"flex:1;\">\n        <div style=\"font-weight:900;font-size:15px;color:var(--tx);\">${team}<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--tx3);\">${gkey?'گروه '+gkey:'—'} • ${FN(s.p)} بازی • ${FN(s.pts)} امتیاز<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;text-align:center;\">\n        <div><div style=\"font-weight:900;color:var(--green2);font-size:16px;\">${FN(s.w)}<\u002Fdiv><div style=\"font-size:9px;color:var(--tx3);\">برد<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-weight:900;color:var(--tx2);font-size:16px;\">${FN(s.d)}<\u002Fdiv><div style=\"font-size:9px;color:var(--tx3);\">مساوی<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-weight:900;color:var(--red);font-size:16px;\">${FN(s.l)}<\u002Fdiv><div style=\"font-size:9px;color:var(--tx3);\">باخت<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:12.5px;font-weight:800;color:var(--tx);margin-bottom:9px;\">⚽ بازی‌های ${team} (${FN(tms.length)})<\u002Fdiv>\n    ${fixtures||'<div class=\"fg-empty\" style=\"padding:24px;\">بازی‌ای برای این تیم ثبت نشده<\u002Fdiv>'}\n    <a href=\"${news}\" target=\"_blank\" rel=\"noopener\" class=\"fg-btn fg-btn-primary\" style=\"display:flex;justify-content:center;text-decoration:none;margin-top:14px;width:100%;\">📰 آخرین اخبار ${team}<\u002Fa>\n  `);\n}\n\n// ─── BRACKET DIAGRAM ─────────────────────────────────────────────────────────\n// WC 2026 format: 12 groups × 2 = 24 + 8 best 3rd place = 32 teams → R32\n//\n// Bracket slots (0-indexed, left=top of draw):\n//   R32: 32 teams = 16 matches (idx 0-15)\n//   R16:           8 matches   (idx 0-7)\n//   QF:            4 matches   (idx 0-3)\n//   SF:            2 matches   (idx 0-1)\n//   F:             1 match     (idx 0)\n//   W:             champion\n//\n// Seeding order (FIFA WC 2026):\n//   R32 match 0:  1A vs best-3rd(BCDF)\n//   R32 match 1:  2C vs 2D  ... etc.\n// For simplicity we seed: 1A vs 2B, 1B vs 2A pattern × 12 groups\n// Actual draw will be done post-group stage.\n\nlet BRACKET = {\n  R32: Array(32).fill(null),   // [winner0, winner1, ...] = teams that enter R32\n  R16: Array(16).fill(null),\n  QF:  Array(8).fill(null),\n  SF:  Array(4).fill(null),\n  F:   Array(2).fill(null),\n  W:   null,\n  // scores[roundKey][matchIdx] = {h, a, pen_h, pen_a}\n  scores: {}\n};\n\n// Which group winner/runner-up goes into which R32 slot\n// Groups: A B C D E F G H I J K L  (index 0-11)\n// R32 slots 0-23 from groups; slots 24-31 = 8 best 3rd place (TBD at runtime)\nconst R32_SEEDING = [\n  // [groupIdx, pos]  pos: 0=winner, 1=runner-up\n  [0,0],[1,1],  // match 0: 1A vs 2B\n  [1,0],[0,1],  // match 1: 1B vs 2A\n  [2,0],[3,1],  // match 2: 1C vs 2D\n  [3,0],[2,1],  // match 3: 1D vs 2C\n  [4,0],[5,1],  // match 4: 1E vs 2F\n  [5,0],[4,1],  // match 5: 1F vs 2E\n  [6,0],[7,1],  // match 6: 1G vs 2H\n  [7,0],[6,1],  // match 7: 1H vs 2G\n  [8,0],[9,1],  // match 8: 1I vs 2J\n  [9,0],[8,1],  // match 9: 1J vs 2I\n  [10,0],[11,1],// match 10: 1K vs 2L\n  [11,0],[10,1],// match 11: 1L vs 2K\n  // matches 12-15: 4 best 3rd-place matchups (filled dynamically)\n  [-1,-1],[-1,-1],[-1,-1],[-1,-1],\n];\n\nfunction getGroupRanking(groupKey){\n  const group=GROUPS[groupKey];if(!group)return[];\n  const gs=GROUP_STATS[groupKey]||{};\n  return [...group.teams].sort((a,b)=>{\n    const sa=gs[a]||{pts:0,gf:0,ga:0,w:0};const sb=gs[b]||{pts:0,gf:0,ga:0,w:0};\n    if(sb.pts!==sa.pts)return sb.pts-sa.pts;\n    if((sb.gf-sb.ga)!==(sa.gf-sa.ga))return(sb.gf-sb.ga)-(sa.gf-sa.ga);\n    return sb.gf-sa.gf;\n  });\n}\n\nfunction getBest3rdPlaces(){\n  const groupKeys=Object.keys(GROUPS);\n  const thirds=[];\n  groupKeys.forEach(gk=>{\n    const ranked=getGroupRanking(gk);\n    if(ranked.length>=3){\n      const t=ranked[2];\n      const gs=GROUP_STATS[gk]||{};\n      const s=gs[t]||{pts:0,gf:0,ga:0,p:0};\n      if(s.p>0)thirds.push({team:t,group:gk,...s});\n    }\n  });\n  thirds.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);\n  return thirds.slice(0,8).map(x=>x.team);\n}\n\nfunction updateBracketFromGroups(){\n  const groupKeys=Object.keys(GROUPS);\n  // Fill R32 slots from group results\n  groupKeys.forEach((gk,gi)=>{\n    const ranked=getGroupRanking(gk);\n    const gs=GROUP_STATS[gk]||{};\n    const anyPlayed=ranked.some(t=>(gs[t]||{p:0}).p>0);\n    const winner  = anyPlayed ? (ranked[0]||null) : null;\n    const runnerUp= anyPlayed ? (ranked[1]||null) : null;\n    // Fill R32 pairs based on seeding\n    R32_SEEDING.forEach((seed,matchIdx)=>{\n      const [sg,sp]=seed;\n      if(sg===gi){\n        if(sp===0) BRACKET.R32[matchIdx*2]  =winner;\n        if(sp===1) BRACKET.R32[matchIdx*2+1]=runnerUp;\n      }\n    });\n  });\n  // Fill best 3rd place slots (matches 12-15)\n  const best3=getBest3rdPlaces();\n  for(let i=0;i<4;i++){\n    BRACKET.R32[(12+i)*2]  =best3[i*2]  ||null;\n    BRACKET.R32[(12+i)*2+1]=best3[i*2+1]||null;\n  }\n}\n\nfunction getScore(roundKey,matchIdx){\n  if(!BRACKET.scores[roundKey])return{h:null,a:null};\n  return BRACKET.scores[roundKey][matchIdx]||{h:null,a:null};\n}\n\nfunction getWinner(roundKey,matchIdx){\n  const teams=getMatchTeams(roundKey,matchIdx);\n  const sc=getScore(roundKey,matchIdx);\n  if(sc.h===null||sc.a===null)return null;\n  if(sc.h>sc.a)return teams[0];\n  if(sc.a>sc.h)return teams[1];\n  // draw → check pen\n  if(sc.pen_h!==undefined&&sc.pen_a!==undefined){\n    return sc.pen_h>sc.pen_a?teams[0]:teams[1];\n  }\n  return null;\n}\n\nfunction getMatchTeams(roundKey,matchIdx){\n  // For R32: read from BRACKET.R32\n  if(roundKey==='R32') return [BRACKET.R32[matchIdx*2]||null, BRACKET.R32[matchIdx*2+1]||null];\n  // For later rounds: read from winners of previous round\n  const prevKey = roundKey==='R16'?'R32':roundKey==='QF'?'R16':roundKey==='SF'?'QF':'SF';\n  const teamA=getWinner(prevKey,matchIdx*2)||BRACKET[roundKey][matchIdx*2]||null;\n  const teamB=getWinner(prevKey,matchIdx*2+1)||BRACKET[roundKey][matchIdx*2+1]||null;\n  return [teamA,teamB];\n}\n\nfunction propagateWinners(){\n  // After each round, populate the next round's slots\n  const chain=[\n    {from:'R32',to:'R16',count:16},\n    {from:'R16',to:'QF', count:8},\n    {from:'QF', to:'SF', count:4},\n    {from:'SF', to:'F',  count:2},\n  ];\n  chain.forEach(({from,to,count})=>{\n    for(let i=0;i<count;i++){\n      const w=getWinner(from,i);\n      if(w) BRACKET[to][Math.floor(i/2)* (i%2===0?1:0) + (i%2===0?0:1)]= \n        i%2===0 ? w : (BRACKET[to][Math.floor(i/2)] ? BRACKET[to][Math.floor(i/2)] : w);\n    }\n    // Simpler approach:\n    BRACKET[to]=Array(count/2).fill(null).map((_,mi)=>{\n      const w1=getWinner(from,mi*2);\n      const w2=getWinner(from,mi*2+1);\n      return w1||w2||BRACKET[to][mi]||null;\n    });\n  });\n  BRACKET.W=getWinner('F',0)||BRACKET.W||null;\n}\n\n// Knockout matches → predictable feed.\n// The knockout stage lives in BRACKET (computed from group results). For users\n// to PREDICT these games and earn points, each fully-determined bracket slot is\n// mirrored into the normal MATCHES feed with a STABLE id (so a prediction stays\n// attached to its slot even as teams fill in). BRACKET stays the single source\n// of truth for the actual result/winner, so nothing is double-counted. Group\n// standings are untouched: updateGroupStats() early-returns for any group key\n// that isn't a real group letter (A–L), and 'R32'/'R16'/… never match.\nconst KO_ROUNDS = [\n  { key:'R32', count:16, base:5000, iso:'2026-06-28', label:'مرحله یک‌سی‌ودوم', dateLabel:'۲۸ ژوئن' },\n  { key:'R16', count:8,  base:5100, iso:'2026-07-04', label:'مرحله یک‌شانزدهم', dateLabel:'۴ ژوئیه' },\n  { key:'QF',  count:4,  base:5200, iso:'2026-07-09', label:'یک‌چهارم نهایی',    dateLabel:'۹ ژوئیه' },\n  { key:'SF',  count:2,  base:5300, iso:'2026-07-14', label:'نیمه‌نهایی',        dateLabel:'۱۴ ژوئیه' },\n  { key:'F',   count:1,  base:5400, iso:'2026-07-19', label:'فینال 🏆',          dateLabel:'۱۹ ژوئیه' },\n];\n\nfunction syncKnockoutMatches(){\n  KO_ROUNDS.forEach(r=>{\n    for(let mi=0; mi<r.count; mi++){\n      const id = r.base + mi;\n      const idx = MATCHES.findIndex(m=>m.id===id);\n      const [tA,tB] = getMatchTeams(r.key, mi);\n      // Only surface a knockout match once BOTH teams are known — no TBD cards.\n      if(!tA || !tB){ if(idx>=0) MATCHES.splice(idx,1); continue; }\n      const sc = getScore(r.key, mi);\n      const hasResult = sc.h!==null && sc.h!==undefined && sc.a!==null && sc.a!==undefined;\n      const entry = {\n        id, group:r.key, knockout:true, koLabel:r.label, matchday:null,\n        home:tA, away:tB, date:r.dateLabel, time:'', dateObj:`${r.iso}T18:00Z`,\n        status: hasResult ? 'finished' : 'upcoming',\n        homeScore: hasResult ? sc.h : null,\n        awayScore: hasResult ? sc.a : null,\n        extra: hasResult ? (sc.extra || (sc.h===sc.a ? 'pen' : 'none')) : undefined,\n      };\n      if(idx>=0) Object.assign(MATCHES[idx], entry); else MATCHES.push(entry);\n    }\n  });\n}\n\n// ── Render ─────────────────────────────────────────────────────────────────\nfunction renderBracket(){\n  updateBracketFromGroups();\n  propagateWinners();\n  syncKnockoutMatches();\n  const container=document.getElementById('bracketDiagram');\n  if(!container)return;\n\n  const ROUNDS=[\n    {key:'R32',label:'یک‌سی‌ودوم (۳۲)',   count:16, dateHint:'۲۸ ژوئن'},\n    {key:'R16',label:'یک‌شانزدهم (۱۶)',  count:8,  dateHint:'۷ ژوئیه'},\n    {key:'QF', label:'یک‌چهارم نهایی',   count:4,  dateHint:'۱۲ ژوئیه'},\n    {key:'SF', label:'نیمه نهایی',       count:2,  dateHint:'۱۶ ژوئیه'},\n    {key:'F',  label:'فینال 🏆',         count:1,  dateHint:'۱۹ ژوئیه'},\n  ];\n\n  // ── Header row ──\n  let headerHtml=`<div class=\"bk-stage-header\">`;\n  ROUNDS.forEach(r=>{\n    const hasGames=r.key!=='R32'\n      ?Object.values(BRACKET.scores[r.key]||{}).some(s=>s.h!==null)\n      :false;\n    headerHtml+=`<div class=\"bk-stage-th${hasGames?' active':''}\">\n      <div>${r.label}<\u002Fdiv>\n      <div style=\"font-size:9px;font-weight:400;color:var(--tx3);margin-top:2px;\">${r.dateHint}<\u002Fdiv>\n    <\u002Fdiv>`;\n  });\n  headerHtml+=`<div class=\"bk-stage-th\" style=\"background:linear-gradient(135deg,#fffdf0,#fef3c7);color:var(--gold);\">🏆 قهرمان<\u002Fdiv><\u002Fdiv>`;\n\n  // ── Grid ──\n  // We use a visual approach: 16 rows (one per R32 match), columns per round\n  // Each round's match spans 2× the number of rows of the previous round\n\n  const TOTAL_ROWS=16; // R32 has 16 matches\n\n  let gridHtml=`<div class=\"bk-grid\" style=\"grid-template-columns:repeat(5,1fr) 120px;grid-template-rows:repeat(${TOTAL_ROWS},minmax(52px,1fr));\">`;\n\n  ROUNDS.forEach((round,col)=>{\n    const matchCount=round.count;\n    const rowSpan=TOTAL_ROWS/matchCount; // how many rows each match spans\n\n    for(let mi=0;mi<matchCount;mi++){\n      const [tA,tB]=getMatchTeams(round.key,mi);\n      const sc=getScore(round.key,mi);\n      const winner=getWinner(round.key,mi);\n      const rowStart=mi*rowSpan+1;\n      const isFinal=round.key==='F';\n\n      const teamHtml=(team,score,penScore,isWon)=>{\n        if(!team) return `<div class=\"bk-team tbd\"><span class=\"bk-flag\">🏳️<\u002Fspan><span class=\"bk-name\">TBD<\u002Fspan><span class=\"bk-score\" style=\"opacity:.3\">—<\u002Fspan><\u002Fdiv>`;\n        const scoreDisp=score!==null?FN(score):'—';\n        const penDisp=penScore!==undefined&&penScore!==null?` <span style=\"font-size:9px;color:var(--tx3)\">(${FN(penScore)})<\u002Fspan>`:'';\n        return `<div class=\"bk-team${isWon?' won':''}\">\n          ${flag(team,18)}\n          <span class=\"bk-name\">${team}<\u002Fspan>\n          <span class=\"bk-score\">${scoreDisp}${penDisp}<\u002Fspan>\n        <\u002Fdiv>`;\n      };\n\n      const isLive=false; // TODO: hook to live match status\n      const borderRight=col<ROUNDS.length-1?'border-right:1px solid var(--brd2);':'';\n      const borderBottom=mi<matchCount-1?'border-bottom:1px solid var(--brd2);':'';\n\n      gridHtml+=`<div style=\"grid-column:${col+1};grid-row:${rowStart}/span ${rowSpan};\n        display:flex;flex-direction:column;justify-content:center;\n        ${borderRight}${borderBottom}\n        position:relative;background:${isFinal?'linear-gradient(135deg,#fffdf0,#fff8e6)':'#fff'};\n        transition:background .15s;\"\n        onmouseover=\"this.style.background='var(--sur2)'\"\n        onmouseout=\"this.style.background='${isFinal?'linear-gradient(135deg,#fffdf0,#fff8e6)':'#fff'}'\">\n        <div style=\"display:flex;flex-direction:column;margin:4px 0;\">\n          ${teamHtml(tA,sc.h,sc.pen_h,winner&&winner===tA)}\n          <div style=\"height:1px;background:var(--brd2);margin:0 6px;opacity:.5;\"><\u002Fdiv>\n          ${teamHtml(tB,sc.a,sc.pen_a,winner&&winner===tB)}\n        <\u002Fdiv>\n        ${rowSpan>1&&mi<matchCount-1?`<div style=\"position:absolute;bottom:0;left:10%;right:10%;height:1px;background:var(--brd2);\"><\u002Fdiv>`:''}\n      <\u002Fdiv>`;\n    }\n  });\n\n  // Champion cell\n  gridHtml+=`<div style=\"grid-column:6;grid-row:1/span ${TOTAL_ROWS};\n    display:flex;flex-direction:column;align-items:center;justify-content:center;\n    background:linear-gradient(160deg,#fffbea,#fef3c7);\n    padding:16px 8px;text-align:center;border-right:none;\">\n    ${BRACKET.W\n      ?`<div style=\"font-size:36px;margin-bottom:8px;\">${flag(BRACKET.W)}<\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:900;color:var(--tx);margin-bottom:6px;\">${BRACKET.W}<\u002Fdiv>\n        <div style=\"font-size:28px;\">🏆<\u002Fdiv>`\n      :`<div style=\"font-size:32px;opacity:.2;margin-bottom:8px;\">🏆<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--tx3);\">در انتظار<br>قهرمان...<\u002Fdiv>`}\n  <\u002Fdiv>`;\n\n  gridHtml+=`<\u002Fdiv>`;\n\n  // ── Legend ──\n  const legendHtml=`\n    <div style=\"display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--tx3);margin-top:12px;padding:10px 14px;background:var(--sur2);border-radius:var(--r3);\">\n      <span><span style=\"display:inline-block;width:10px;height:10px;background:rgba(10,191,111,.2);border-radius:2px;margin-left:4px;vertical-align:middle;\"><\u002Fspan>برنده بازی<\u002Fspan>\n      <span>عدد کنار اسم = گل زده<\u002Fspan>\n      <span>📌 دیاگرام هر ۶۰ ثانیه آپدیت می‌شود<\u002Fspan>\n    <\u002Fdiv>`;\n\n  // ── Admin panel (only the admin may post knockout results) ──\n  const adminHtml=!isAdmin?'':`\n    <div class=\"bk-admin-panel card\" style=\"margin-top:16px;\">\n      <div class=\"card-header\">\n        <div class=\"card-title\">⚙️ ثبت نتایج مراحل حذفی<\u002Fdiv>\n        <div class=\"card-action\" onclick=\"renderBracket()\">🔄 رفرش دیاگرام<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card-body\">\n        <div style=\"font-size:12px;color:var(--tx3);margin-bottom:14px;\">\n          پس از پایان هر بازی حذفی، نتیجه را اینجا وارد کنید. دیاگرام خودکار آپدیت می‌شود.\n        <\u002Fdiv>\n        ${buildAdminInputs()}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n\n  container.innerHTML = `\n    <div style=\"overflow-x:auto;padding-bottom:4px;\">\n      <div style=\"min-width:860px;\">\n        ${headerHtml}\n        ${gridHtml}\n      <\u002Fdiv>\n    <\u002Fdiv>\n    ${legendHtml}\n    ${adminHtml}\n  `;\n}\n\nfunction buildAdminInputs(){\n  const stages=[\n    {key:'R32',label:'یک‌سی‌ودوم',count:16,srcKey:null},\n    {key:'R16',label:'یک‌شانزدهم',count:8, srcKey:'R32'},\n    {key:'QF', label:'یک‌چهارم',  count:4, srcKey:'R16'},\n    {key:'SF', label:'نیمه نهایی',count:2, srcKey:'QF'},\n    {key:'F',  label:'فینال 🏆',  count:1, srcKey:'SF'},\n  ];\n  let html='';\n  stages.forEach(st=>{\n    html+=`<div class=\"bk-admin-stage\">\n      <div class=\"bk-admin-label\">${st.label}<\u002Fdiv>`;\n    for(let mi=0;mi<st.count;mi++){\n      const [tA,tB]=getMatchTeams(st.key,mi);\n      const sc=getScore(st.key,mi);\n      const nameA=tA||`تیم ${mi*2+1}`;\n      const nameB=tB||`تیم ${mi*2+2}`;\n      html+=`<div class=\"bk-admin-row\">\n        <div class=\"bk-admin-team\">${tA?flag(tA,18):'<span class=\\\"f-emoji\\\">🏳️<\u002Fspan>'}${nameA}<\u002Fdiv>\n        <input type=\"number\" min=\"0\" max=\"20\" value=\"${sc.h!==null?sc.h:''}\" placeholder=\"—\"\n          id=\"bsc-${st.key}-${mi}-h\" class=\"bk-score-inp\">\n        <span style=\"color:var(--tx3);font-weight:900;font-size:16px;\">:<\u002Fspan>\n        <input type=\"number\" min=\"0\" max=\"20\" value=\"${sc.a!==null?sc.a:''}\" placeholder=\"—\"\n          id=\"bsc-${st.key}-${mi}-a\" class=\"bk-score-inp\">\n        <div class=\"bk-admin-team\" style=\"text-align:left;justify-content:flex-end;\">${nameB}${tB?flag(tB,18):'<span class=\\\"f-emoji\\\">🏳️<\u002Fspan>'}<\u002Fdiv>\n        <div style=\"display:flex;gap:4px;align-items:center;\">\n          <button onclick=\"saveBracketMatch('${st.key}',${mi})\" class=\"btn btn-g btn-sm\">✅ ثبت<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    }\n    html+='<\u002Fdiv>';\n  });\n  return html;\n}\n\nfunction saveBracketMatch(stage,mi){\n  if(!isAdmin){toast('⛔ فقط ادمین می‌تواند نتیجه ثبت کند','e');return;}\n  const hEl=document.getElementById(`bsc-${stage}-${mi}-h`);\n  const aEl=document.getElementById(`bsc-${stage}-${mi}-a`);\n  const hs=parseInt(hEl?.value);const as=parseInt(aEl?.value);\n  if(isNaN(hs)||isNaN(as)){toast('لطفاً هر دو گل را وارد کنید','e');return;}\n  if(!BRACKET.scores[stage])BRACKET.scores[stage]={};\n  const [nmA,nmB]=getMatchTeams(stage,mi);\n  const rec={h:hs,a:as};\n  if(hs===as){\n    // Draw → decided on penalties. Capture the shoot-out score (needed both to\n    // pick the advancing team AND to score users who predicted 'پنالتی').\n    const ph=parseInt(prompt(`🥅 پنالتی — گل ${nmA||'میزبان'}:`));\n    const pa=parseInt(prompt(`🥅 پنالتی — گل ${nmB||'مهمان'}:`));\n    if(!isNaN(ph)&&!isNaN(pa)){ rec.pen_h=ph; rec.pen_a=pa; }\n    rec.extra='pen';\n  } else {\n    // Decisive → ask whether it needed extra time (for the +۲ bonus accuracy).\n    rec.extra = confirm('آیا این بازی در وقت اضافه به نتیجه رسید؟\\n\\nتأیید = وقت اضافه ⏱   |   لغو = در ۹۰ دقیقه') ? 'et' : 'none';\n  }\n  BRACKET.scores[stage][mi]=rec;\n  propagateWinners();\n  syncKnockoutMatches();   // mirror into the predictable MATCHES feed\n  rebuildAllStats();       // recompute every user's points incl. this knockout game\n  // Persist so EVERY client converges — knockout results were previously\n  // local-only and never reached other players.\n  if(fbReady) fbSet(`bracket/scores/${stage}/${mi}`, rec);\n  const winner=getWinner(stage,mi);\n  if(stage==='F'&&winner){BRACKET.W=winner;confetti();toast(`🏆 ${flagTxt(winner)} ${winner} قهرمان جام جهانی ۲۰۲۶! 🎉`,'s',8000);}\n  else if(winner) toast(`✅ برنده: ${flagTxt(winner)} ${winner}`,'s',3000);\n  addAct('ادمین',`نتیجه ${stage} ثبت شد${winner?' — برنده: '+winner:''}`, 'gold');\n  renderBracket();\n  renderAllMatches(); renderDashMatches(); renderMiniLb(); updateStats();\n}\n\n// ─── COMPARE PREDICTIONS ───────────────────────────────────────────────────\nfunction populateCompareSelect(){\n  const sel=document.getElementById('compareMatchSel');\n  if(!sel)return;\n  sel.innerHTML=`<option value=\"\">— یک بازی انتخاب کن —<\u002Foption>`\n    +MATCHES.map(m=>`<option value=\"${m.id}\">${flagTxt(m.home)} ${m.home} 🆚 ${m.away} ${flagTxt(m.away)} | گروه ${m.group}<\u002Foption>`).join('');\n}\n\nfunction renderCompare(){\n  const sel=document.getElementById('compareMatchSel');\n  const mid=parseInt(sel?.value);\n  const container=document.getElementById('compareContent');\n  if(!mid||!container){if(container)container.innerHTML='<div class=\"compare-empty\">یک بازی را از لیست انتخاب کنید<\u002Fdiv>';return;}\n  const match=MATCHES.find(m=>m.id===mid);\n  if(!match){container.innerHTML='<div class=\"compare-empty\">بازی پیدا نشد<\u002Fdiv>';return;}\n  const allUsers=Object.values(users);\n  const hf=flag(match.home);const af=flag(match.away);\n\n  // Header: match info + result if finished\n  let headerHtml=`<div class=\"compare-match-header\">\n    <span style=\"font-size:22px;\">${hf}<\u002Fspan>\n    <span>${match.home}<\u002Fspan>`;\n  if(match.status==='finished'&&match.homeScore!==null){\n    headerHtml+=`<div class=\"compare-score-box\">${FN(match.homeScore)} - ${FN(match.awayScore)}<\u002Fdiv>`;\n  }else if(match.status==='live'){\n    headerHtml+=`<div class=\"compare-score-box\" style=\"background:rgba(232,48,80,.3)\">🔴 ${FN(match.homeScore)} - ${FN(match.awayScore)}<\u002Fdiv>`;\n  }else{\n    headerHtml+=`<div class=\"compare-score-box\">VS<\u002Fdiv>`;\n  }\n  headerHtml+=`<span>${match.away}<\u002Fspan><span style=\"font-size:22px;\">${af}<\u002Fspan><\u002Fdiv>`;\n\n  // Stats bar\n  const predsForMatch=allUsers.filter(u=>u.preds&&u.preds[mid]&&u.preds[mid].saved);\n  const totalPreds=predsForMatch.length;\n  let homeWins=0,draws=0,awayWins=0,exactCount=0;\n  predsForMatch.forEach(u=>{\n    const p=u.preds[mid];\n    if(p.home>p.away)homeWins++;\n    else if(p.home===p.away)draws++;\n    else awayWins++;\n    if(match.status==='finished'&&p.home===match.homeScore&&p.away===match.awayScore)exactCount++;\n  });\n\n  let statsHtml='';\n  if(totalPreds>0){\n    const hw=Math.round(homeWins/totalPreds*100);\n    const dw=Math.round(draws/totalPreds*100);\n    const aw=Math.round(awayWins/totalPreds*100);\n    statsHtml=`<div class=\"card\" style=\"margin-bottom:14px;\">\n      <div class=\"card-body\">\n        <div style=\"font-size:12px;font-weight:700;color:var(--tx3);margin-bottom:10px;\">📊 آمار ${FN(totalPreds)} پیش‌بینی${match.status==='finished'?` • ${FN(exactCount)} نتیجه دقیق`:''}<\u002Fdiv>\n        <div style=\"display:flex;gap:0;border-radius:8px;overflow:hidden;height:32px;margin-bottom:6px;\">\n          ${hw>0?`<div style=\"width:${hw}%;background:linear-gradient(135deg,var(--green),var(--green2));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;\">${hw}٪<\u002Fdiv>`:''}\n          ${dw>0?`<div style=\"width:${dw}%;background:linear-gradient(135deg,var(--gold),#c9890a);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;\">${dw}٪<\u002Fdiv>`:''}\n          ${aw>0?`<div style=\"width:${aw}%;background:linear-gradient(135deg,var(--blue),#1a5fcc);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;\">${aw}٪<\u002Fdiv>`:''}\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);\">\n          <span><span style=\"color:var(--green);font-weight:800;\">●<\u002Fspan> ${hf} ${match.home} (${FN(homeWins)})<\u002Fspan>\n          <span><span style=\"color:var(--gold);font-weight:800;\">●<\u002Fspan> تساوی (${FN(draws)})<\u002Fspan>\n          <span><span style=\"color:var(--blue);font-weight:800;\">●<\u002Fspan> ${match.away} ${af} (${FN(awayWins)})<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }\n\n  // Individual predictions grid\n  let cardsHtml='<div class=\"compare-grid\">';\n  if(allUsers.length===0){\n    cardsHtml+='<div class=\"compare-empty\" style=\"grid-column:1/-1\">هنوز کاربری پیش‌بینی نکرده<\u002Fdiv>';\n  } else {\n    allUsers.forEach(u=>{\n      const isMe=currentUser&&u.name===currentUser.name;\n      const p=u.preds&&u.preds[mid]&&u.preds[mid].saved?u.preds[mid]:null;\n      let cardClass='compare-card';let resultBadge='';\n      if(p&&match.status==='finished'&&match.homeScore!==null){\n        const aw=match.homeScore>match.awayScore?'h':match.homeScore<match.awayScore?'a':'d';\n        const pw=p.home>p.away?'h':p.home<p.away?'a':'d';\n        if(p.home===match.homeScore&&p.away===match.awayScore){\n          cardClass+=' exact-hit';resultBadge=`<div class=\"compare-result-badge\" style=\"background:var(--gs);color:var(--green);\">🎯 دقیق +۵<\u002Fdiv>`;\n        }else if(aw===pw){\n          cardClass+=' winner-hit';resultBadge=`<div class=\"compare-result-badge\" style=\"background:var(--golds);color:var(--gold);\">✅ صحیح +۳<\u002Fdiv>`;\n        }else{\n          cardClass+=' wrong-hit';resultBadge=`<div class=\"compare-result-badge\" style=\"background:var(--reds);color:var(--red);\">❌ اشتباه<\u002Fdiv>`;\n        }\n      }\n      if(isMe)cardClass+=' mine';\n      cardsHtml+=`<div class=\"${cardClass}\">\n        <div style=\"display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:6px;\">\n          ${avatarEl(u.name,30,13)}\n          <div class=\"compare-user-name\">${u.name}${isMe?' <span style=\"font-size:9px;color:var(--blue)\">(من)<\u002Fspan>':''}<\u002Fdiv>\n        <\u002Fdiv>\n        ${p?`<div class=\"compare-pred\">${hf} ${FN(p.home)} - ${FN(p.away)} ${af}<\u002Fdiv>${resultBadge}`\n          :`<div class=\"compare-no-pred\">پیش‌بینی نشده<\u002Fdiv>`}\n      <\u002Fdiv>`;\n    });\n  }\n  cardsHtml+='<\u002Fdiv>';\n  container.innerHTML=headerHtml+statsHtml+cardsHtml;\n}\n\n// ===== LEADERBOARD =====\nfunction renderMiniLb(){\n  const sorted=getSorted();\n  const top=sorted.slice(0,5);\n  document.getElementById('miniLb').innerHTML=top.map((u,i)=>{\n    const rank=rankOf(u,sorted);\n    const medal=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank?FN(rank):'—';\n    return `\n    <div class=\"lb-item${currentUser&&u.name===currentUser.name?' me':''}\">\n      <div class=\"lb-rank ${rank===1?'r1':rank===2?'r2':rank===3?'r3':''}\">${medal}<\u002Fdiv>\n      ${avatarEl(u.name,28,12)}\n      <div class=\"lb-info\">\n        <div class=\"lb-name\">${u.name}${currentUser&&u.name===currentUser.name?' <span style=\"font-size:9px;color:var(--green)\">(من)<\u002Fspan>':''}<\u002Fdiv>\n        <div class=\"lb-sub\">${u.predictions?`دقت ${FN(Math.round((u.correct||0)/u.predictions*100))}٪`:'هنوز پیش‌بینی نشده'}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"lb-pts\"><div class=\"lb-pts-val\">${FN(u.points)}<\u002Fdiv><div class=\"lb-pts-lbl\">امتیاز<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>`;}).join('')||'<div style=\"padding:20px;text-align:center;color:var(--tx3)\">هنوز امتیازی ثبت نشده<\u002Fdiv>';\n}\n\nfunction renderPodium(){\n  const sorted=getSorted().filter(u=>(u.points||0)>0).slice(0,3);\n  if(!sorted.length){document.getElementById('podiumWrap').innerHTML='<div style=\"padding:20px;text-align:center;color:var(--tx3)\">هنوز کسی امتیاز نگرفته<\u002Fdiv>';return;}\n  const order=sorted.length>=3?[sorted[1],sorted[0],sorted[2]]:[sorted[0]];\n  const crowns=['🥈','👑','🥉'];const bases=['pb2','pb1','pb3'];const sizes=[[48,19],[56,22],[44,18]];\n  document.getElementById('podiumWrap').innerHTML=order.map((u,i)=>`\n    <div class=\"podium-item\">\n      <div style=\"font-size:18px\">${crowns[i]}<\u002Fdiv>\n      <div style=\"width:${sizes[i][0]}px;height:${sizes[i][0]}px;border-radius:50%;background:${astyle(u.name)};display:flex;align-items:center;justify-content:center;font-size:${sizes[i][1]}px;font-weight:800;color:#fff;\">${uinit(u.name)}<\u002Fdiv>\n      <div style=\"font-size:12px;font-weight:800;color:var(--tx)\">${u.name}<\u002Fdiv>\n      <div class=\"podium-base ${bases[i]}\"><div class=\"podium-pts\">${FN(u.points)}<\u002Fdiv><div style=\"font-size:9px;color:var(--tx3)\">امتیاز<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>`).join('');\n}\n\nfunction renderFullLb(filter=''){\n  const sorted=getSorted();\n  const list=filter?sorted.filter(u=>u.name.includes(filter)):sorted;\n  document.getElementById('fullLb').innerHTML=list.map((u,i)=>{\n    const rank=rankOf(u,sorted);const isMe=currentUser&&u.name===currentUser.name;\n    const acc=u.predictions?Math.round((u.correct||0)/u.predictions*100):0;\n    const rankCell=rank?(rank<=3?['🥇','🥈','🥉'][rank-1]:FN(rank)):'—';\n    return `<div class=\"flb-row${isMe?' me':''}\" dir=\"rtl\">\n      <div class=\"flb-cell\">${rankCell}<\u002Fdiv>\n      <div class=\"flb-cell left\" style=\"display:flex;align-items:center;gap:8px\">\n        ${avatarEl(u.name,28,12)}\n        <span style=\"font-weight:700\">${u.name}${isMe?'<span style=\"font-size:9px;color:var(--green)\"> (من)<\u002Fspan>':''}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"flb-cell pts\">${FN(u.points)}<\u002Fdiv>\n      <div class=\"flb-cell\">${FN(u.correct||0)}<\u002Fdiv>\n      <div class=\"flb-cell\" style=\"color:var(--gold)\">${FN(u.exact||0)}<\u002Fdiv>\n      <div class=\"flb-cell\">${u.predictions?FN(acc)+'٪':'—'}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('')||'<div style=\"padding:20px;text-align:center;color:var(--tx3)\">هنوز داده‌ای وجود ندارد<\u002Fdiv>';\n}\nfunction filterLb(v){renderFullLb(v);}\n\n// ===== ACTIVITY =====\nfunction renderMiniAct(){\n  document.getElementById('miniAct').innerHTML=activityFeed.slice(0,4).map(a=>`\n    <div class=\"act-item\"><div class=\"adot ${a.type}\"><\u002Fdiv>\n    <div><div class=\"atext\"><strong>${a.user}<\u002Fstrong> ${a.text}<\u002Fdiv><div class=\"atime\">${timeAgo(a.time)}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>`).join('')||'<div style=\"padding:12px 14px;font-size:12px;color:var(--tx3)\">هنوز فعالیتی ثبت نشده<\u002Fdiv>';\n}\nfunction renderFullAct(){\n  const el=document.getElementById('fullAct');if(!el)return;\n  el.innerHTML=activityFeed.map(a=>`\n    <div class=\"act-item\"><div class=\"adot ${a.type}\"><\u002Fdiv>\n    <div><div class=\"atext\"><strong>${a.user}<\u002Fstrong> ${a.text}<\u002Fdiv><div class=\"atime\">${timeAgo(a.time)}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>`).join('')||'<div style=\"padding:20px;text-align:center;color:var(--tx3)\">هنوز فعالیتی ثبت نشده<\u002Fdiv>';\n  const all=Object.values(users);\n  const el2=document.getElementById('actTot');if(el2)el2.textContent=FN(all.reduce((s,u)=>s+(u.predictions||0),0));\n  const el3=document.getElementById('actPts');if(el3)el3.textContent=FN(all.reduce((s,u)=>s+(u.points||0),0));\n  const el4=document.getElementById('actU');if(el4)el4.textContent=FN(all.length);\n}\n\n// ===== REPORTS =====\nfunction renderReports(){\n  const all=Object.values(users);\n  document.getElementById('repSum').innerHTML=`\n    <div class=\"rep-card\"><div class=\"rep-num g\">${FN(all.length)}<\u002Fdiv><div class=\"rep-lbl\">شرکت‌کنندگان<\u002Fdiv><\u002Fdiv>\n    <div class=\"rep-card\"><div class=\"rep-num b\">${FN(all.reduce((s,u)=>s+(u.predictions||0),0))}<\u002Fdiv><div class=\"rep-lbl\">کل پیش‌بینی‌ها<\u002Fdiv><\u002Fdiv>\n    <div class=\"rep-card\"><div class=\"rep-num gold\">${FN(all.reduce((s,u)=>s+(u.points||0),0))}<\u002Fdiv><div class=\"rep-lbl\">مجموع امتیازات<\u002Fdiv><\u002Fdiv>`;\n  const sorted=getSorted();\n  document.getElementById('repList').innerHTML=sorted.map((u,i)=>{\n    const isMe=currentUser&&u.name===currentUser.name;\n    const acc=u.predictions?Math.round((u.correct||0)/u.predictions*100):0;\n    const tc=Object.values(u.comments||{}).reduce((a,b)=>a+b.length,0);\n    const rank=rankOf(u,sorted);\n    const medal=rank?(rank<=3?['🥇','🥈','🥉'][rank-1]:FN(rank)):'—';\n    return `<div class=\"ur-card${isMe?' me':''}\" onclick=\"showUserDetail('${u.name}')\">\n      <div style=\"font-size:18px;font-weight:900;color:var(--tx3);min-width:30px;text-align:center\">${medal}<\u002Fdiv>\n      ${avatarEl(u.name,44,18)}\n      <div class=\"ur-info\">\n        <div class=\"ur-name\">${u.name}${isMe?' <span style=\"font-size:10px;color:var(--green)\">(من)<\u002Fspan>':''}<\u002Fdiv>\n        <div class=\"ur-stats\">\n          <div class=\"ur-stat\">پیش‌بینی: <span>${FN(u.predictions||0)}<\u002Fspan><\u002Fdiv>\n          <div class=\"ur-stat\">صحیح: <span style=\"color:var(--green)\">${FN(u.correct||0)}<\u002Fspan><\u002Fdiv>\n          <div class=\"ur-stat\">دقیق: <span style=\"color:var(--gold)\">${FN(u.exact||0)}<\u002Fspan><\u002Fdiv>\n          <div class=\"ur-stat\">دقت: <span>${u.predictions?FN(acc)+'٪':'—'}<\u002Fspan><\u002Fdiv>\n          <div class=\"ur-stat\">💬 <span>${FN(tc)}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ur-pts\"><div class=\"ur-pts-val\">${FN(u.points)}<\u002Fdiv><div class=\"ur-pts-lbl\">امتیاز<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('')||'<div style=\"padding:40px;text-align:center;color:var(--tx3)\">هنوز کاربری ثبت‌نام نکرده<\u002Fdiv>';\n}\n\nfunction showUserDetail(name){\n  const u=users[name];if(!u)return;\n  const acc=u.predictions?Math.round((u.correct||0)/u.predictions*100):0;\n  const sorted=getSorted();const rank=rankOf(u,sorted);\n  const tc=Object.values(u.comments||{}).reduce((a,b)=>a+b.length,0);\n  openModal(`📊 گزارش: ${name}`,`\n    <div style=\"text-align:center;margin-bottom:20px\">\n      <div style=\"width:60px;height:60px;border-radius:50%;background:${astyle(u.name)};display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;margin:0 auto 10px\">${uinit(u.name)}<\u002Fdiv>\n      <div style=\"font-size:18px;font-weight:900\">${u.name}<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--tx3)\">${rank?'رتبه #'+FN(rank):'بدون رتبه'}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;\">\n      <div style=\"padding:12px;background:var(--gs);border-radius:8px;text-align:center\"><div style=\"font-size:22px;font-weight:900;color:var(--green)\">${FN(u.points)}<\u002Fdiv><div style=\"font-size:11px;color:var(--tx3)\">امتیاز<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:12px;background:var(--blues);border-radius:8px;text-align:center\"><div style=\"font-size:22px;font-weight:900;color:var(--blue)\">${FN(u.predictions||0)}<\u002Fdiv><div style=\"font-size:11px;color:var(--tx3)\">پیش‌بینی<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:12px;background:var(--golds);border-radius:8px;text-align:center\"><div style=\"font-size:22px;font-weight:900;color:var(--gold)\">${FN(u.correct||0)}<\u002Fdiv><div style=\"font-size:11px;color:var(--tx3)\">صحیح<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:12px;background:var(--vios);border-radius:8px;text-align:center\"><div style=\"font-size:22px;font-weight:900;color:var(--vio)\">${FN(u.exact||0)}<\u002Fdiv><div style=\"font-size:11px;color:var(--tx3)\">دقیق<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:12px;padding:10px;background:var(--sur2);border-radius:8px;display:flex;justify-content:space-around;\">\n      <div style=\"text-align:center\"><div style=\"font-weight:900\">${u.predictions?FN(acc)+'٪':'—'}<\u002Fdiv><div style=\"font-size:11px;color:var(--tx3)\">دقت<\u002Fdiv><\u002Fdiv>\n      <div style=\"text-align:center\"><div style=\"font-weight:900;color:var(--blue)\">${FN(tc)}<\u002Fdiv><div style=\"font-size:11px;color:var(--tx3)\">کامنت<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>`);\n}\n\n// ===== PROFILE =====\nfunction renderProfile(){\n  if(!currentUser)return;\n  const u=currentUser;\n  const acc=u.predictions?Math.round((u.correct||0)/u.predictions*100):0;\n  const sorted=getSorted();const rank=rankOf(u,sorted);\n  document.getElementById('profAv').textContent=uinit(u.name);\n  document.getElementById('profAv').style.background=astyle(u.name);\n  document.getElementById('profName').textContent=u.name;\n  const totalPlayers=Object.values(users).filter(x=>!x.isAdmin).length;\n  let profTitle;\n  if(rank){\n    profTitle='رتبه #'+FN(rank)+' از '+FN(totalPlayers)+' در لیگ عمومی';\n  } else {\n    profTitle='هنوز امتیازی نگرفتی';\n  }\n  document.getElementById('profTitle').textContent=profTitle;\n  animateNum(document.getElementById('pPts'),u.points||0);\n  document.getElementById('pRank').textContent=rank?'#'+FN(rank):'—';\n  document.getElementById('pAcc').textContent=u.predictions?FN(acc)+'٪':'—';\n  document.getElementById('pExact').textContent=FN(u.exact||0);\n  const pStreakEl=document.getElementById('pStreak');\n  if(pStreakEl)pStreakEl.textContent=FN(u.streak||0);\n  const d=188-(188*acc/100);\n  const r=document.getElementById('accRing');if(r)r.setAttribute('stroke-dashoffset',d);\n  document.getElementById('accPct').textContent=u.predictions?FN(acc)+'٪':'—';\n  renderProfileRanks();\n  renderProfileGroups();\n}\n\n// ===== UPDATE MY STATS =====\nfunction updateStats(){\n  if(!currentUser)return;\n  const u=currentUser;\n  const sorted=getSorted();const rank=rankOf(u,sorted);\n  const acc=u.predictions?Math.round((u.correct||0)/u.predictions*100):0;\n  animateNum(document.getElementById('myPts'),u.points||0);\n  document.getElementById('myRank').textContent=rank?'#'+FN(rank):'—';\n  document.getElementById('myRankS').textContent=rank?`از ${FN(sorted.length)} شرکت‌کننده`:'هنوز امتیازی نگرفتی';\n  document.getElementById('myAcc').textContent=u.predictions?FN(acc)+'٪':'—';\n  document.getElementById('myCorrectC').textContent=u.predictions?`${FN(u.correct||0)} از ${FN(u.predictions)} بازی`:'';\n  document.getElementById('myExact').textContent=FN(u.exact||0);\n  document.getElementById('sbAv').textContent=uinit(u.name);\n  document.getElementById('sbAv').style.background=astyle(u.name);\n  document.getElementById('sbName').textContent=u.name;\n  if(isAdmin){\n    document.getElementById('sbRank').textContent='⚙️ مدیر سیستم';\n    document.getElementById('sbRank').style.color='var(--gold)';\n  } else {\n    document.getElementById('sbRank').textContent=rank===1?'👑 صدرنشین لیگ':rank?'رتبه #'+FN(rank):'⭐ بازیکن';\n    document.getElementById('sbRank').style.color='var(--green)';\n  }\n  document.getElementById('topAv').textContent=uinit(u.name);\n  document.getElementById('topAv').style.background=astyle(u.name);\n  document.getElementById('topAv').style.color='#fff';\n  renderMiniLb();\n}\n\n// ===== ADMIN =====\nfunction renderAdminMatches(){\n  // Group matches only — knockout results are entered on the «مرحله حذفی» page\n  // (which also advances the bracket); listing them here too would diverge.\n  document.getElementById('adminMatchList').innerHTML=MATCHES.filter(m=>!m.knockout).map(m=>`\n    <div class=\"amr\">\n      <div class=\"teams\">${flag(m.home)} ${m.home} vs ${m.away} ${flag(m.away)} <span style=\"font-size:10px;color:var(--tx3);margin-right:6px\">گروه ${m.group}<\u002Fspan><\u002Fdiv>\n      <div class=\"sinps\">\n        <input class=\"sinp-small\" type=\"number\" min=\"0\" max=\"20\" value=\"${m.homeScore??''}\" id=\"hs-${m.id}\" placeholder=\"؟\">\n        <span style=\"color:var(--tx3);font-weight:800;padding:0 3px\">:<\u002Fspan>\n        <input class=\"sinp-small\" type=\"number\" min=\"0\" max=\"20\" value=\"${m.awayScore??''}\" id=\"as-${m.id}\" placeholder=\"؟\">\n      <\u002Fdiv>\n      <span class=\"sbadge ${m.status}\">${m.status==='upcoming'?'پیش رو':m.status==='live'?'زنده':'پایان'}<\u002Fspan>\n      <button class=\"btn btn-g btn-sm\" onclick=\"adminSave(${m.id})\">✅ ثبت<\u002Fbutton>\n    <\u002Fdiv>`).join('');\n}\nfunction renderAdminUsers(){\n  const all=Object.values(users);\n  document.getElementById('adminUserList').innerHTML=all.length?all.map(u=>`\n    <div class=\"ucard\">\n      ${avatarEl(u.name,28,12)}\n      <div style=\"flex:1;min-width:0\"><div style=\"font-size:12px;font-weight:700\">${u.name}<\u002Fdiv>\n      <div style=\"font-size:10px;color:var(--tx3)\">${FN(u.points)} امتیاز • ${FN(u.predictions||0)} پیش‌بینی<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>`).join(''):'<div style=\"padding:14px;color:var(--tx3);font-size:12px\">هنوز کاربری ثبت‌نام نکرده<\u002Fdiv>';\n}\nfunction adminAddMatch(){\n  if(!isAdmin){toast('⛔ فقط ادمین می‌تواند بازی اضافه کند','e');return;}\n  const h=document.getElementById('aHome').value.trim();const a=document.getElementById('aAway').value.trim();\n  const hf2=document.getElementById('aHF').value.trim()||'🏳️';const af2=document.getElementById('aAF').value.trim()||'🏳️';\n  const d=document.getElementById('aDate').value.trim();const g=document.getElementById('aGroup').value.trim();\n  if(!h||!a){toast('نام تیم‌ها را وارد کنید','e');return;}\n  MATCHES.push({id:MATCHES.length+1,group:g||'?',home:h,away:a,date:d||'',time:'',dateObj:'',status:'upcoming',homeScore:null,awayScore:null});\n  FLAGS[h]=hf2;FLAGS[a]=af2;\n  ['aHome','aAway','aHF','aAF','aDate','aGroup'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});\n  renderAdminMatches();renderAllMatches();renderDashMatches();\n  toast('بازی جدید اضافه شد ✅','s');\n}\n\nfunction adminSave(matchId){\n  if(!isAdmin){toast('⛔ فقط ادمین می‌تواند نتایج ثبت کند','e');return;}\n  const m=MATCHES.find(m=>m.id===matchId);if(!m)return;\n  const hs=parseInt(document.getElementById('hs-'+matchId)?.value);\n  const as=parseInt(document.getElementById('as-'+matchId)?.value);\n  if(isNaN(hs)||isNaN(as)){toast('امتیاز معتبر وارد کنید','e');return;}\n  // Remove old group stats for this match if already set\n  m.homeScore=hs;m.awayScore=as;m.status='finished';\n  fbSaveMatch(matchId, hs, as, 'finished');  // ← ذخیره در Firebase\n  // Rebuild group stats from scratch\n  Object.keys(GROUPS).forEach(k=>{\n    GROUP_STATS[k]={};\n    GROUPS[k].teams.forEach(t=>{GROUP_STATS[k][t]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};});\n  });\n  MATCHES.filter(m=>m.status==='finished'&&m.homeScore!==null).forEach(m=>updateGroupStats(m.id));\n  // Update all users predictions\n  Object.values(users).forEach(u=>{\n    const p=u.preds[matchId];if(!p||!p.saved)return;\n    const pts=calcPoints(p,m);\n    if(pts>0){u.points=(u.points||0)+pts;u.correct=(u.correct||0)+1;}\n    if(p.home===hs&&p.away===as)u.exact=(u.exact||0)+1;\n  });\n  renderAdminMatches();renderAllMatches();renderDashMatches();renderMiniLb();updateStats();\n  updateGroupProgress();\n  // Auto-update bracket when group results change, and mirror any newly-unlocked\n  // knockout matches into the predictable feed.\n  updateBracketFromGroups();propagateWinners();syncKnockoutMatches();renderAllMatches();renderDashMatches();\n  // Notify current user of result\n  if(currentUser){\n    const p=currentUser.preds[matchId];\n    if(p&&p.saved){\n      const aw=hs>as?'h':hs<as?'a':'d';const pw=p.home>p.away?'h':p.home<p.away?'a':'d';\n      if(p.home===hs&&p.away===as){confetti();toast('🎯 نتیجه دقیق! +۵ امتیاز','s',5000);}\n      else if(aw===pw)toast('✅ برنده صحیح! +۳ امتیاز','s',3000);\n      else toast('❌ پیش‌بینی اشتباه بود','e',3000);\n    }\n  }\n  addAct('سیستم',`نتیجه ثبت شد: ${m.home} ${hs}-${as} ${m.away}`,'gold');\n  toast(`نتیجه ثبت شد: ${m.home} ${hs}-${as} ${m.away}`,'i');\n}\n\n// ===== COUNTDOWN =====\nfunction findNextMatch(){\n  const now=new Date();\n  // dateObj values are UTC (end with Z), Date() parses them correctly\n  const upcoming=MATCHES.filter(m=>m.status==='upcoming'&&m.dateObj)\n    .sort((a,b)=>new Date(a.dateObj)-new Date(b.dateObj));\n  return upcoming[0]||null;\n}\n\nfunction updateCountdown(){\n  const next=findNextMatch();\n  if(!next){\n    document.getElementById('cdMatchName').textContent='بازی آتی یافت نشد';\n    return;\n  }\n  document.getElementById('cdMatchName').innerHTML=`<span dir=\"ltr\" style=\"display:inline-flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap\">${flag(next.home,20)} <b style=\"font-size:11px;font-weight:700\">${next.home}<\u002Fb> <span style=\"opacity:.55\">🆚<\u002Fspan> <b style=\"font-size:11px;font-weight:700\">${next.away}<\u002Fb> ${flag(next.away,20)}<\u002Fspan>`;\n  const now=new Date();\n  const target=new Date(next.dateObj);\n  let diff=Math.max(0,Math.floor((target-now)/1000));\n  const h=Math.floor(diff/3600),mm=Math.floor((diff%3600)/60),ss=diff%60;\n  const fz=n=>FN(String(n).padStart(2,'0'));\n  document.getElementById('cdH').textContent=fz(h);\n  document.getElementById('cdM').textContent=fz(mm);\n  document.getElementById('cdS').textContent=fz(ss);\n}\n\nfunction updateGroupProgress(){\n  const finished=MATCHES.filter(m=>m.status==='finished').length;\n  const total=MATCHES.length;\n  const pct=Math.round(finished/total*100);\n  const el=document.getElementById('groupProgress');\n  if(el)el.style.width=pct+'%';\n}\n\n// ========================= LIVE DATA SYNC =========================\n// TheSportsDB API — key 123 (free), id 4429 = FIFA World Cup\n// Fields: strHomeTeam, strAwayTeam, intHomeScore, intAwayScore,\n//         strStatus, intRound, strGroup, strTimestamp, dateEvent\n// strStatus values: '' / null = upcoming, 'Match Finished' = done,\n//                   '1H' '2H' 'HT' = live\n\nconst SPORTSDB_BASE = 'https://www.thesportsdb.com/api/v1/json/123';\nconst WC_LEAGUE_ID  = '4429';\nconst WC_SEASON     = '2026';\n\n// English team name → Persian\nconst EN2FA = {\n  'Mexico':'مکزیک','South Africa':'آفریقای جنوبی','Korea Republic':'کره جنوبی',\n  'South Korea':'کره جنوبی','Czech Republic':'جمهوری چک','Czechia':'جمهوری چک',\n  'Canada':'کانادا','Bosnia and Herzegovina':'بوسنی','Bosnia-Herzegovina':'بوسنی',\n  'Qatar':'قطر','Switzerland':'سوئیس',\n  'Brazil':'برزیل','Morocco':'مراکش','Haiti':'هائیتی','Scotland':'اسکاتلند',\n  'United States':'آمریکا','USA':'آمریکا','US':'آمریکا',\n  'Paraguay':'پاراگوئه','Australia':'استرالیا','Turkey':'ترکیه','Türkiye':'ترکیه',\n  'Germany':'آلمان','Curacao':'کوراسائو','Curaçao':'کوراسائو',\n  \"Ivory Coast\":\"ساحل عاج\",\"Cote d'Ivoire\":\"ساحل عاج\",'Ecuador':'اکوادور',\n  'Netherlands':'هلند','Japan':'ژاپن','Sweden':'سوئد','Tunisia':'تونس',\n  'Iraq':'عراق','Norway':'نروژ',\n  'Argentina':'آرژانتین','Algeria':'الجزایر','Austria':'اتریش','Jordan':'اردن',\n  'Portugal':'پرتغال','DR Congo':'کنگو','Congo DR':'کنگو',\n  'Uzbekistan':'ازبکستان','Colombia':'کلمبیا',\n  'Spain':'اسپانیا','Cape Verde':'کیپ ورد','Saudi Arabia':'عربستان','Uruguay':'اروگوئه',\n  'France':'فرانسه','Senegal':'سنگال',\n  'England':'انگلیس','Croatia':'کرواسی','Ghana':'غنا','Panama':'پاناما',\n  'Belgium':'بلژیک','Egypt':'مصر','Iran':'ایران','IR Iran':'ایران',\n  'New Zealand':'نیوزیلند',\n};\n\n// Status string → app status\nfunction parseStatus(ev) {\n  const s = (ev.strStatus || '').toLowerCase();\n  const hs = ev.intHomeScore, as = ev.intAwayScore;\n  if (!s || s === 'not started' || s === 'ns') return 'upcoming';\n  if (s.includes('finish') || s.includes('ft') || s.includes('aet') || s.includes('pen')) return 'finished';\n  if (s === '1h' || s === '2h' || s === 'ht' || s.includes('live') || s.includes('play')) return 'live';\n  // fallback: if scores exist, assume finished\n  if (hs !== null && hs !== '' && as !== null && as !== '') return 'finished';\n  return 'upcoming';\n}\n\nlet syncTimer = null;\nlet lastSyncTime = null;\nlet syncCount = 0;\n\nfunction setSyncStatus(txt, color) {\n  const el = document.getElementById('syncStatus');\n  if (el) { el.textContent = txt; el.style.color = color || 'var(--tx3)'; }\n}\nfunction setSyncBtnSpin(on) {\n  const el = document.getElementById('syncBtnLabel');\n  if (el) { el.textContent = on ? '...' : 'زنده'; }\n}\n\n// Apply API data to app state\nfunction applyAPIData(events) {\n  if (!events || !events.length) return 0;\n  let updated = 0;\n  events.forEach(ev => {\n    const homeFa = EN2FA[ev.strHomeTeam];\n    const awayFa = EN2FA[ev.strAwayTeam];\n    if (!homeFa || !awayFa) return;\n    // Find matching fixture\n    const m = MATCHES.find(x =>\n      (x.home === homeFa && x.away === awayFa) ||\n      (x.home === awayFa && x.away === homeFa)\n    );\n    if (!m) return;\n    let hs = ev.intHomeScore !== null && ev.intHomeScore !== '' ? parseInt(ev.intHomeScore) : null;\n    let as_ = ev.intAwayScore !== null && ev.intAwayScore !== '' ? parseInt(ev.intAwayScore) : null;\n    const newStatus = parseStatus(ev);\n    // Swap scores if teams order reversed in our data\n    if (m.home === awayFa && m.away === homeFa) { const t = hs; hs = as_; as_ = t; }\n\n    // ── Capture the REAL kickoff time from the API ───────────────────────────\n    // All fixtures ship with a placeholder 18:00Z time, which was wrongly\n    // locking matches before they kicked off. Replace it with the true time.\n    let timeChanged = false;\n    let iso = null;\n    let ts = (ev.strTimestamp || '').trim();\n    if (ts) {\n      ts = ts.replace(' ', 'T');\n      // TheSportsDB timestamps are UTC; append Z when no tz designator present.\n      if (!/[Zz]$|[+-]\\d\\d:?\\d\\d$/.test(ts)) ts += 'Z';\n      const d = new Date(ts);\n      if (!isNaN(d)) iso = d.toISOString();\n    } else if (ev.dateEvent && ev.strTime) {\n      const d = new Date(`${ev.dateEvent}T${ev.strTime}Z`);\n      if (!isNaN(d)) iso = d.toISOString();\n    }\n    if (iso && (m.dateObj !== iso || !m.hasRealTime)) {\n      m.dateObj = iso; m.hasRealTime = true; timeChanged = true;\n      if (fbReady) fbUpdate(`matches/${m.id}`, { dateObj: iso, hasRealTime: true });\n    }\n\n    const changed = m.status !== newStatus || m.homeScore !== hs || m.awayScore !== as_;\n    if (!changed && !timeChanged) return;\n    if (changed) {\n      m.homeScore = hs; m.awayScore = as_; m.status = newStatus;\n      // Persist API results to Firebase so every client converges, even ones\n      // whose own API request fails or is rate-limited. update() (merge) is used\n      // so it never clobbers the dateObj/hasRealTime fields written above.\n      if (fbReady && newStatus !== 'upcoming') {\n        fbUpdate(`matches/${m.id}`, { homeScore: hs, awayScore: as_, status: newStatus });\n      }\n      // Only count as a real \"result\" when there's an actual score on the board\n      // (live or finished). A pure kickoff-time refresh must NOT be announced as\n      // a new result — that was the misleading \"N نتیجه دریافت شد\" message.\n      if (newStatus !== 'upcoming' && hs !== null && as_ !
