document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n:root{\n  --font:'Vazirmatn',sans-serif;\n  --sw:272px;--tr:all .26s cubic-bezier(.32,.72,0,1);\n  --r:22px;--r2:16px;--r3:12px;\n  --bg:#EEF2F1;--bg2:#fff;--bg3:#E4EAE8;\n  --sur:#fff;--sur2:#F1F5F4;--sur3:#F7FAF9;\n  --brd:rgba(13,42,33,.10);--brd2:rgba(13,42,33,.06);\n  --tx:#0C1A14;--tx2:#445248;--tx3:#8A988F;\n  --green:#05B06A;--green2:#02855A;--gs:#E2F8EE;\n  --gold:#E0961A;--golds:#FCF3DF;\n  --red:#EE3158;--reds:#FDE8EE;\n  --blue:#2C7BE5;--blues:#E9F1FD;\n  --vio:#7C3AED;--vios:#F2ECFF;\n  /* signature stadium-night gradient + glows */\n  --ink:#06140E;--ink2:#0A2419;--ink3:#0B3242;\n  --grad-g:linear-gradient(135deg,#0FD27E 0%,#03A964 55%,#00855A 100%);\n  --grad-gold:linear-gradient(135deg,#F6BE4B,#E0961A 60%,#C07A0C);\n  --sh:0 18px 48px -12px rgba(8,28,20,.22),0 4px 14px -4px rgba(8,28,20,.10);\n  --sh2:0 10px 30px -10px rgba(8,28,20,.16),0 2px 8px -3px rgba(8,28,20,.08);\n  --sh3:0 2px 10px -2px rgba(8,28,20,.08),0 1px 2px rgba(8,28,20,.05);\n  --sh-g:0 12px 30px -8px rgba(5,176,106,.45);\n  --inp:#EEF3F1;\n}\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}\nhtml{scroll-behavior:smooth;}\nbody{font-family:var(--font);background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;direction:rtl;}\n::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}\n::-webkit-scrollbar-thumb{background:rgba(10,191,111,.25);border-radius:10px;}\n\n/* ===LOGIN=== */\n.login-screen{\n  position:fixed;inset:0;z-index:1000;\n  background:linear-gradient(160deg,#064E3B 0%,#065F46 40%,#0D3B66 100%);\n  display:flex;align-items:flex-start;justify-content:center;\n  padding:20px 16px 80px;overflow-y:auto;\n}\n.login-screen.hide{animation:lhide .45s ease forwards;}\n@keyframes lhide{to{opacity:0;transform:scale(1.04);pointer-events:none;}}\n.login-flags{\n  position:fixed;top:14px;left:0;right:0;z-index:2;\n  display:flex;justify-content:center;gap:5px;flex-wrap:wrap;\n  font-size:20px;padding:0 12px;\n  animation:fslide .7s ease-out;letter-spacing:2px;\n}\n@keyframes fslide{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}\n.login-ball{\n  position:fixed;top:11%;left:50%;transform:translateX(-50%);\n  font-size:90px;z-index:2;pointer-events:none;\n  animation:bfloat 3.5s ease-in-out infinite;\n  filter:drop-shadow(0 18px 36px rgba(0,0,0,.5));\n}\n@keyframes bfloat{0%,100%{transform:translateX(-50%) rotate(-6deg);}50%{transform:translateX(-50%) translateY(-12px) rotate(6deg);}}\n.login-card{\n  position:relative;z-index:3;\n  background:#fff;\n  border-radius:24px;\n  padding:36px 30px 28px;\n  width:100%;max-width:400px;\n  box-shadow:0 32px 80px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.12);\n  animation:cardin .5s cubic-bezier(.175,.885,.32,1.275);\n  margin-top:160px;\n}\n@keyframes cardin{from{opacity:0;transform:translateY(28px) scale(.95);}to{opacity:1;transform:none;}}\n.lcard-badge{\n  display:inline-flex;align-items:center;gap:7px;\n  background:linear-gradient(135deg,var(--green),var(--green2));\n  border-radius:30px;padding:5px 16px 5px 10px;\n  font-size:12px;color:#fff;font-weight:700;margin-bottom:18px;\n}\n.lcard-badge-icon{width:26px;height:26px;background:rgba(255,255,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;}\n.lcard-title{font-size:22px;font-weight:900;color:var(--tx);margin-bottom:4px;line-height:1.25;}\n.lcard-sub{font-size:13px;color:var(--tx3);margin-bottom:22px;}\n.lfield{margin-bottom:14px;}\n.llabel{display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:6px;letter-spacing:.2px;}\n.linput{\n  display:block;\n  width:100%;height:48px;\n  background:#F0F4FA !important;\n  border:2px solid rgba(0,0,0,.1) !important;\n  border-radius:12px;\n  color:#1A2640 !important;\n  font-size:15px;font-family:var(--font);\n  padding:0 16px;outline:none;\n  transition:border-color .2s,box-shadow .2s;\n  direction:rtl;\n  -webkit-appearance:none;appearance:none;\n  box-sizing:border-box;\n}\n.linput:focus{border-color:var(--green) !important;background:#fff !important;box-shadow:0 0 0 4px rgba(10,191,111,.12) !important;}\n.linput::placeholder{color:#8294B0;opacity:1;}\n.lhint{font-size:11px;color:var(--tx3);margin-top:5px;}\n.lbtn{\n  display:block;width:100%;height:50px;margin-top:6px;\n  background:linear-gradient(135deg,#0ABF6F,#089958);\n  border:none;border-radius:12px;\n  color:#fff;font-size:15px;font-weight:800;font-family:var(--font);\n  cursor:pointer;transition:transform .2s,box-shadow .2s;\n  box-shadow:0 6px 24px rgba(10,191,111,.4);\n  letter-spacing:.3px;-webkit-appearance:none;\n}\n.lbtn:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(10,191,111,.5);}\n.lbtn:active{transform:translateY(0);}\n.lerr{font-size:12px;color:#E83050;min-height:18px;margin-top:8px;text-align:center;font-weight:600;}\n.ldiv{display:flex;align-items:center;gap:10px;margin:18px 0 14px;}\n.ldivl{flex:1;height:1px;background:rgba(0,0,0,.08);}\n.ldivt{font-size:11px;color:var(--tx3);}\n.lfoot{font-size:11px;color:var(--tx3);text-align:center;margin-top:16px;}\n.login-score-strip{\n  position:fixed;bottom:0;left:0;right:0;z-index:4;\n  display:flex;justify-content:center;\n  background:rgba(0,0,0,.28);backdrop-filter:blur(10px);\n  padding:10px 12px;gap:0;overflow:hidden;\n}\n.lss-item{display:flex;align-items:center;gap:5px;padding:4px 12px;font-size:11px;color:rgba(255,255,255,.8);border-right:1px solid rgba(255,255,255,.15);}\n.lss-item:last-child{border-right:none;}\n.lss-score{font-weight:900;color:#fff;font-size:13px;}\n@media(max-width:480px){\n  .login-ball{font-size:65px;top:9%;}\n  .login-card{padding:26px 20px 22px;margin-top:130px;border-radius:20px;}\n  .lcard-title{font-size:19px;}\n  .login-flags{font-size:17px;gap:3px;}\n}\n\n\n/* ===BRACKET=== */\n.bk-wrap{\n  display:flex;flex-direction:column;gap:0;\n  padding:16px 0 24px;\n  font-family:var(--font);\n}\n/* Each row = one match; columns = rounds */\n.bk-stage-header{\n  display:flex;gap:0;margin-bottom:0;border-bottom:2px solid var(--brd2);\n  background:var(--sur2);border-radius:var(--r2) var(--r2) 0 0;\n  overflow:hidden;\n}\n.bk-stage-th{\n  flex:1;text-align:center;font-size:10px;font-weight:800;\n  color:var(--tx3);text-transform:uppercase;letter-spacing:1px;\n  padding:9px 4px;border-right:1px solid var(--brd2);\n}\n.bk-stage-th:last-child{border-right:none;}\n.bk-stage-th.active{color:var(--green);background:var(--gs);}\n\n/* The actual bracket grid */\n.bk-grid{\n  display:grid;\n  /* R32=16matches, R16=8, QF=4, SF=2, F=1, Champion */\n  grid-template-columns: repeat(5,1fr) 120px;\n  min-width:860px;\n  border:1px solid var(--brd2);\n  border-radius:0 0 var(--r2) var(--r2);\n  overflow:hidden;\n  background:#fff;\n}\n.bk-col{\n  display:flex;flex-direction:column;\n  border-right:1px solid var(--brd2);\n  position:relative;\n}\n.bk-col:last-child{border-right:none;}\n\n.bk-match{\n  display:flex;flex-direction:column;\n  border-bottom:1px solid var(--brd2);\n  flex:1;min-height:56px;position:relative;\n  background:#fff;transition:background .15s;\n}\n.bk-match:last-child{border-bottom:none;}\n.bk-match:hover{background:var(--sur2);}\n.bk-match.final-match{background:linear-gradient(135deg,#fffdf0,#fff8e6);}\n.bk-team{\n  display:flex;align-items:center;gap:5px;\n  padding:6px 8px;font-size:11px;font-weight:600;\n  color:var(--tx2);flex:1;\n  border-bottom:1px solid rgba(0,0,0,.04);\n  min-height:27px;\n  overflow:hidden;\n}\n.bk-team:last-child{border-bottom:none;}\n.bk-team.won{color:var(--green);font-weight:800;background:rgba(10,191,111,.06);}\n.bk-team.tbd{color:var(--tx3);font-style:italic;}\n.bk-team .bk-flag{font-size:14px;flex-shrink:0;}\n.bk-team .bk-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;}\n.bk-team .bk-score{margin-right:auto;font-weight:900;font-size:12px;\n  min-width:16px;text-align:center;color:var(--tx3);flex-shrink:0;}\n.bk-team.won .bk-score{color:var(--green);}\n\n/* Champion cell */\n.bk-champ-cell{\n  display:flex;flex-direction:column;align-items:center;justify-content:center;\n  padding:16px 8px;text-align:center;flex:1;\n  background:linear-gradient(135deg,#fffbea,#fff8dc);\n}\n.bk-champ-flag{font-size:36px;margin-bottom:6px;}\n.bk-champ-name{font-size:13px;font-weight:900;color:var(--tx);}\n.bk-champ-trophy{font-size:24px;margin-top:4px;}\n.bk-tbd-champ{font-size:28px;opacity:.25;margin-bottom:4px;}\n\n/* Connector lines between rounds */\n.bk-connector{\n  position:absolute;top:0;right:-1px;bottom:0;\n  width:0;border-right:0;\n}\n\n/* Live pulsing dot */\n.bk-live-dot{\n  width:7px;height:7px;border-radius:50%;background:var(--red);\n  flex-shrink:0;animation:bkpulse 1.2s ease-in-out infinite;\n}\n@keyframes bkpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}\n\n/* Spacer cells in higher rounds */\n.bk-spacer{\n  flex:1;border-bottom:none;\n  display:flex;align-items:center;justify-content:center;\n}\n.bk-spacer-line{width:30%;height:1px;background:var(--brd2);}\n\n/* Admin input panel */\n.bk-admin-panel{margin-top:18px;}\n.bk-admin-stage{margin-bottom:14px;}\n.bk-admin-label{font-size:10px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding:6px 8px;background:var(--sur2);border-radius:var(--r3);}\n.bk-admin-row{\n  display:flex;align-items:center;gap:8px;padding:9px 12px;\n  background:#fff;border:1px solid var(--brd2);border-radius:var(--r3);\n  margin-bottom:6px;flex-wrap:wrap;transition:var(--tr);\n}\n.bk-admin-row:hover{border-color:rgba(10,191,111,.2);background:var(--gs);}\n.bk-admin-team{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;flex:1;min-width:100px;}\n.bk-score-inp{\n  width:42px;height:32px;border:1.5px solid var(--brd);border-radius:var(--r3);\n  text-align:center;font-size:14px;font-weight:900;font-family:var(--font);\n  background:#fff;color:var(--tx);outline:none;\n}\n.bk-score-inp:focus{border-color:var(--green);}\n\n/* Sync pulse animation */\n@keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.4}}\n.syncing{animation:syncPulse .8s ease-in-out infinite;}\n\n/* ===COMPARE=== */\n.compare-match-header{\n  background:linear-gradient(135deg,var(--green),var(--green2));\n  border-radius:var(--r2);padding:14px 18px;color:#fff;\n  display:flex;align-items:center;justify-content:center;gap:16px;\n  margin-bottom:16px;font-size:15px;font-weight:800;\n}\n.compare-score-box{\n  background:rgba(255,255,255,.2);border-radius:8px;\n  padding:4px 16px;font-size:20px;font-weight:900;letter-spacing:3px;\n}\n.compare-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}\n.compare-card{\n  background:#fff;border:1.5px solid var(--brd2);border-radius:var(--r2);\n  padding:14px;text-align:center;transition:var(--tr);box-shadow:var(--sh3);\n}\n.compare-card:hover{transform:translateY(-2px);box-shadow:var(--sh2);}\n.compare-card.exact-hit{border-color:rgba(10,191,111,.4);background:var(--gs);}\n.compare-card.winner-hit{border-color:rgba(232,156,10,.4);background:var(--golds);}\n.compare-card.wrong-hit{border-color:rgba(232,48,80,.25);background:var(--reds);}\n.compare-card.mine{box-shadow:0 0 0 2px var(--blue),var(--sh2);}\n.compare-user-name{font-size:13px;font-weight:800;color:var(--tx);margin-bottom:6px;}\n.compare-pred{font-size:22px;font-weight:900;color:var(--tx);margin:6px 0;}\n.compare-result-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-block;}\n.compare-no-pred{font-size:12px;color:var(--tx3);margin-top:8px;}\n.compare-empty{padding:40px;text-align:center;color:var(--tx3);}\n\n/* ===APP=== */\n.app-layout{display:flex;min-height:100vh;}\n.sidebar{\n  width:var(--sw);background:#fff;border-left:1px solid var(--brd2);\n  position:fixed;top:0;right:0;bottom:0;z-index:100;\n  display:flex;flex-direction:column;\n  transition:t ius:var(--r);padding:16px;text-align:center;}\n.cd-lbl{font-size:10px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}\n.cd-match{font-size:12px;font-weight:800;color:var(--tx);margin-bottom:12px;}\n.cd-grid{display:flex;align-items:center;justify-content:center;gap:8px;direction:ltr;}\n.cd-unit{display:flex;flex-direction:column;align-items:center;}\n.cd-val{font-size:26px;font-weight:900;color:var(--green);background:#fff;border:1.5px solid rgba(10,191,111,.2);border-radius:var(--r3);padding:5px 10px;line-height:1;min-width:50px;text-align:center;box-shadow:var(--sh3);}\n.cd-sep{font-size:20px;font-weight:900;color:var(--tx3);}\n.cd-unit-lbl{font-size:9px;color:var(--tx3);margin-top:3px;font-weight:600;}\n\n/* ACTIVITY */\n.act-list{display:flex;flex-direction:column;}\n.act-item{display:flex;align-items:flex-start;gap:9px;padding:9px 14px;border-bottom:1px solid var(--brd2);transition:var(--tr);}\n.act-item:hover{background:var(--sur2);}\n.act-item:last-child{border-bottom:none;}\n.adot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}\n.adot.g{background:var(--green);}\n.adot.gold{background:var(--gold);}\n.adot.r{background:var(--red);}\n.adot.b{background:var(--blue);}\n.adot.v{background:var(--vio);}\n.atext{font-size:12px;color:var(--tx2);line-height:1.5;}\n.atime{font-size:10px;color:var(--tx3);margin-top:2px;}\n\n/* BADGES */\n.badges-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}\n.bcard{background:#fff;border:1.5px solid var(--brd2);border-radius:var(--r2);padding:14px 10px;text-align:center;transition:var(--tr);cursor:pointer;box-shadow:var(--sh3);}\n.bcard.unlocked{background:var(--gs);border-color:rgba(10,191,111,.25);}\n.bcard:hover{transform:translateY(-2px);box-shadow:var(--sh2);}\n.bicon{font-size:28px;margin-bottom:6px;}\n.bcard:not(.unlocked) .bicon{filter:grayscale(1);opacity:.3;}\n.bname{font-size:11px;font-weight:800;color:var(--tx);}\n.bcard:not(.unlocked) tion:column;gap:8px;}\n.toast{background:#fff;border:1px solid var(--brd);border-radius:var(--r3);padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;max-width:300px;animation:tin .3s ease-out;box-shadow:var(--sh);color:var(--tx);}\n.toast.s{border-color:rgba(10,191,111,.3);}\n.toast.e{border-color:rgba(232,48,80,.3);}\n.toast.i{border-color:rgba(45,127,232,.3);}\n@keyframes tin{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}\n\n.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden;}\n.cp{position:absolute;top:-10px;border-radius:2px;animation:cf linear forwards;}\n@keyframes cf{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}\n\n.dash-grid{display:grid;grid-template-columns:1fr 298px;gap:16px;}\n.dash-main{display:flex;flex-direction:column;gap:16px;}\n.dash-side{display:flex;flex-direction:column;gap:16px;}\n\n/* REPORTS */\n.rep-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}\n.rep-card{background:#fff;border:1px solid var(--brd2);border-radius:var(--r2);padding:16px;box-shadow:var(--sh3);text-align:center;}\n.rep-num{font-size:28px;font-weight:900;}\n.rep-num.g{color:var(--green);}\n.rep-num.b{color:var(--blue);}\n.rep-num.gold{color:var(--gold);}\n.rep-lbl{font-size:11px;color:var(--tx3);margin-top:4px;}\n.ur-card{background:#fff;border:1px solid var(--brd2);border-radius:var(--r2);padding:14px;box-shadow:var(--sh3);display:flex;align-items:center;gap:12px;margin-bottom:10px;transition:var(--tr);cursor:pointer;}\n.ur-card:hover{border-color:rgba(10,191,111,.2);box-shadow:var(--sh2);}\n.ur-card.me{background:var(--gs);border-color:rgba(10,191,111,.2);}\n.ur-av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;}\n.ur-info{flex:1;min-width:0;}\n.ur-name{font-size:14px;font-weight:800;color:var(--tx);}\n.ur-stats{display:f \n@media(max-width:880px){\n  .bnav{display:grid;}\n  main{padding-bottom:80px !important;}\n}\n\n/* ── FRIEND GROUPS (mini-leagues) ─────────────────────────────── */\n.fg-hero{position:relative;overflow:hidden;border-radius:var(--r);padding:26px 24px;margin-bottom:18px;color:#fff;\n  background:radial-gradient(700px 300px at 90% -20%,#0FD27E55,transparent 60%),linear-gradient(150deg,#072018,#0a3242);\n  box-shadow:var(--sh2);}\n.fg-hero h2{font-size:23px;font-weight:900;margin-bottom:7px;letter-spacing:-.3px;}\n.fg-hero p{font-size:13.5px;color:rgba(255,255,255,.72);line-height:1.8;max-width:520px;margin-bottom:18px;}\n.fg-hero-actions{display:flex;gap:10px;flex-wrap:wrap;}\n.fg-btn{display:inline-flex;align-items:center;gap:8px;border:none;font-family:var(--font);font-weight:800;font-size:13.5px;\n  padding:12px 18px;border-radius:13px;cursor:pointer;transition:var(--tr);}\n.fg-btn-primary{background:var(--grad-g);color:#fff;box-shadow:var(--sh-g);}\n.fg-btn-primary:hover{transform:translateY(-2px);}\n.fg-btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18);}\n.fg-btn-ghost:hover{background:rgba(255,255,255,.2);}\n.fg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}\n.fg-card{background:#fff;border:1px solid var(--brd2);border-radius:var(--r);padding:18px;box-shadow:var(--sh3);transition:var(--tr);cursor:pointer;position:relative;overflow:hidden;}\n.fg-card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:rgba(5,176,106,.25);}\n.fg-card-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}\n.fg-emoji{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;background:var(--gs);}\n.fg-card-name{font-size:16px;font-weight:900;color:var(--tx);}\n.fg-card-meta{font-size:11.5px;color:var(--tx3);font-weight:600;margin-top:2px;}\n.fg-mini-lb{display:flex;flex-direction:column;gap:4px;margin-bott       <!-- GROUPS -->\n      <div class=\"page\" id=\"page-groups\">\n        <div id=\"groupTablesContainer\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- KNOCKOUT BRACKET -->\n      <div class=\"page\" id=\"page-bracket\">\n        <div id=\"bracketDiagram\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- FRIENDS — mini-leagues -->\n      <div class=\"page\" id=\"page-friends\">\n        <div id=\"friendsContainer\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- COMPARE PREDICTIONS -->\n      <div class=\"page\" id=\"page-compare\">\n        <div style=\"margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;\">\n          <select id=\"compareMatchSel\" onchange=\"renderCompare()\" style=\"height:38px;background:#fff;border:1.5px solid var(--brd);border-radius:var(--r3);color:var(--tx);font-size:13px;font-family:var(--font);padding:0 12px;outline:none;flex:1;min-width:200px;direction:rtl;\"><\u002Fselect>\n          <button class=\"btn btn-g btn-sm\" onclick=\"renderCompare()\">🔍 نمایش<\u002Fbutton>\n        <\u002Fdiv>\n        <div id=\"compareContent\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- LEADERBOARD -->\n      <div class=\"page\" id=\"page-leaderboard\">\n        <div class=\"podium-wrap\" id=\"podiumWrap\"><\u002Fdiv>\n        <div class=\"card\">\n          <div class=\"card-header\">\n            <div class=\"card-title\">🏅 جدول کامل امتیازات<\u002Fdiv>\n            <input class=\"sinp\" type=\"text\" placeholder=\"جستجوی کاربر...\" style=\"width:160px;height:30px;font-size:11px;\" oninput=\"filterLb(this.value)\">\n          <\u002Fdiv>\n          <div class=\"flb-header\" dir=\"rtl\">\n            <div>#<\u002Fdiv><div>کاربر<\u002Fdiv>\n            <div class=\"flb-cell\">امتیاز<\u002Fdiv>\n            <div class=\"flb-cell\">صحیح<\u002Fdiv>\n            <div class=\"flb-cell\">دقیق<\u002Fdiv>\n            <div class=\"flb-cell pts\">دقت<\u002Fdiv>\n          <\u002Fdiv>\n          <div id=\"fullLb\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ACTIVITY -->\n      <div class=\"page\" id=\"page-activity\">\n        <div class=\"stats-grid\" style=\"grid-template-columns:repeat(3,1fr)\">\n          <div class=\"sc cg\"><div class=\"sc-label\">کل پیش‌بینی‌ها<\u002Fdiv><div class=\"sc-val g\" id=\"actTot\">۰<\u002Fdiv><\u002Fdiv>\n          <div class=\"sc cgold\"><div class=\"sc-label\">مجموع امتیازات<\u002Fdiv><div class=\"sc-val gold\" id=\"actPts\">۰<\u002Fdiv><\u002Fdiv>\n          <div class=\"sc cb\"><div class=\"sc-label\">کاربران فعال<\u002Fdiv><div class=\"sc-val b\" id=\"actU\">۰<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <div class=\"card-header\"><div class=\"card-title\">📢 فید فعالیت‌ها<\u002Fdiv><\u002Fdiv>\n          <div class=\"act-list\" id=\"fullAct\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- REPORTS -->\n      <div class=\"page\" id=\"page-reports\">\n        <div class=\"rep-grid\" id=\"repSum\"><\u002Fdiv>\n        <div class=\"section-title\">📊 گزارش کامل همه کاربران<\u002Fdiv>\n        <div id=\"repList\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- RULES -->\n      <div class=\"page\" id=\"page-rules\">\n        <div class=\"card\" style=\"max-width:680px;margin:0 auto;\">\n          <div class=\"card-header\">\n            <div class=\"card-title\">📜 قوانین لیگ پیش‌بینی جام جهانی ۲۰۲۶<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card-body\" style=\"display:flex;flex-direction:column;gap:20px;\">\n\n            <!-- Scoring -->\n            <div>\n              <div style=\"font-size:13px;font-weight:800;color:var(--tx);margin-bottom:10px;display:flex;align-items:center;gap:6px;\">\n                <span style=\"font-size:18px;\">⭐<\u002Fspan> سیستم امتیازدهی\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:7px;\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--gs);border-radius:var(--r3);border:1px solid rgba(10,191,111,.15);\">\n                  <span style=\"font-size:13px;\">🎯 <strong>نتیجه کاملاً دقیق<\u002Fstrong> — گل به گل صحیح<\u002Fspan>\n                  <span style=\"font-size:16px;font-weight:900;color:var(--green)\">۱۰ امتیاز<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--vios);border-radius:var(--r3);border:1px solid rgba(124,58,237,.15);\">\n                  <span style=\"font-size:13px;\">⚡ <strong>برنده + تفاضل گل<\u002Fstrong> درست (مثلاً ۲-۰ زدی، ۳-۱ شد)<\u002Fspan>\n                  <span style=\"font-size:16px;font-weight:900;color:var(--vio)\">۷ امتیاز<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--blues);border-radius:var(--r3);border:1px solid rgba(45,127,232,.15);\">\n                  <span style=\"font-size:13px;\">✅ <strong>فقط برنده<\u002Fstrong> یا <strong>تساوی<\u002Fstrong> درست<\u002Fspan>\n                  <span style=\"font-size:16px;font-weight:900;color:var(--blue)\">۴ امتیاز<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--golds);border-radius:var(--r3);border:1px solid rgba(232,156,10,.15);\">\n                  <span style=\"font-size:13px;\">🏟️ <strong>وقت اضافه یا پنالتی<\u002Fstrong> درست (فقط مراحل حذفی)<\u002Fspan>\n                  <span style=\"font-size:16px;font-weight:900;color:var(--gold)\">+۲ بونوس<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--reds);border-radius:var(--r3);border:1px solid rgba(232,48,80,.15);\">\n                  <span style=\"font-size:13px;\">❌ <strong>اشتباه<\u002Fstrong><\u002Fspan>\n                  <span style=\"font-size:16px;font-weight:900;color:var(--red)\">۰ امتیاز<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- Bonuses -->\n            <div>\n              <div style=\"font-size:13px;font-weight:800;color:var(--tx);margin-bottom:10px;display:flex;align-items:center;gap:6px;\">\n                <span style=\"font-size:18px;\">🎁<\u002Fspan> بونوس‌های ویژه\n              <\u002Fdiv>\n              <div style=\"font-size:12px;color:var(--tx3);background:var(--sur2);border-radius:var(--r3);padding:9px 12px;margin-bottom:10px;line-height:1.7;\">بونوس امتیاز جداگانه نیست — این‌ها امتیاز <b>اضافه<\u002Fb> روی امتیاز اصلیِ همان بازی‌اند و مستقیم به امتیاز کل تو افزوده می‌شوند.<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:7px;\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--golds);border-radius:var(--r3);border:1px solid rgba(232,156,10,.15);\">\n                  <div>\n                    <div style=\"font-size:13px;font-weight:700;\">🔥 Streak — ۳ بازی پشت سر هم درست<\u002Fdiv>\n                    <div style=\"font-size:11px;color:var(--tx3);margin-top:2px;\">هر بار که ۳ پیش‌بینی درست پشت سر هم داشتی<\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font-size:16px;font-weight:900;color:var(--gold)\">+۳ بونوس<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- Time Rules -->\n            <div>\n              <div style=\"font-size:13px;font-weight:800;color:var(--tx);margin-bottom:10px;display:flex;align-items:center;gap:6px;\">\n                <span style=\"font-size:18px;\">⏰<\u002Fspan> قوانین زمانی\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:7px;\">\n                <div style=\"padding:12px 14px;background:var(--sur2);border-radius:var(--r3);border:1px solid var(--brd2);\">\n                  <div style=\"font-size:13px;font-weight:700;margin-bottom:4px;\">🔒 قفل پیش‌بینی<\u002Fdiv>\n                  <div style=\"font-size:12px;color:var(--tx2);\">پیش‌بینی هر بازی <strong>۵ دقیقه قبل از شروع<\u002Fstrong> قفل می‌شود. بعد از آن امکان ثبت یا ویرایش وجود ندارد.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:12px 14px;background:var(--sur2);border-radius:var(--r3);border:1px solid var(--brd2);\">\n                  <div style=\"font-size:13px;font-weight:700;margin-bottom:4px;\">✏️ ویرایش آزاد<\u002Fdiv>\n                  <div style=\"font-size:12px;color:var(--tx2);\">تا قبل از قفل شدن می‌توانی هر چند بار که بخواهی پیش‌بینی‌ات را تغییر دهی.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:12px 14px;background:var(--sur2);border-radius:var(--r3);border:1px solid var(--brd2);\">\n                  <div style=\"font-size:13px;font-weight:700;margin-bottom:4px;\">🌐 زمان‌ها به وقت تهران<\u002Fdiv>\n                  <div style=\"font-size:12px;color:var(--tx2);\">تمام ساعت‌های بازی به وقت ایران (UTC+3:30) نمایش داده می‌شود.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- General Rules -->\n            <div>\n              <div style=\"font-size:13px;font-weight:800;color:var(--tx);margin-bottom:10px;display:flex;align-items:center;gap:6px;\">\n                <span style=\"font-size:18px;\">📋<\u002Fspan> قوانین کلی\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--tx2);\">\n                <div style=\"padding:10px 14px;background:var(--sur2);border-radius:var(--r3);border-right:3px solid var(--green);\">\n                  👤 هر کاربر با نام دلخواه وارد می‌شود. اسمت در جدول امتیازات نمایش داده می‌شود.\n                <\u002Fdiv>\n                <div style=\"padding:10px 14px;background:var(--sur2);border-radius:var(--r3);border-right:3px solid var(--blue);\">\n                  📊 جدول امتیازات real-time است و بعد از هر بازی به‌روز می‌شود.\n                <\u002Fdiv>\n                <div style=\"padding:10px 14px;background:var(--sur2);border-radius:var(--r3);border-right:3px solid var(--gold);\">\n                  🔄 ادمین نتایج را ثبت می‌کند — بلافاصله همه کاربران امتیاز می‌گیرند.\n                <\u002Fdiv>\n                <div style=\"padding:10px 14px;background:var(--sur2);border-radius:var(--r3);border-right:3px solid var(--vio);\">\n                  💬 می‌توانی زیر هر بازی کامنت بگذاری و پیش‌بینی بقیه را در «مقایسه» ببینی.\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- PROFILE -->\n      <div class=\"page\" id=\"page-profile\">\n        <div class=\"profile-hero\">\n          <div class=\"profile-avatar\" id=\"profAv\">؟<\u002Fdiv>\n          <div style=\"flex:1\">\n            <div class=\"profile-name\" id=\"profName\">کاربر<\u002Fdiv>\n            <div class=\"profile-title\" id=\"profTitle\">⭐ بازیکن<\u002Fdiv>\n            <div class=\"profile-stats\">\n              <div class=\"pstat\"><div class=\"pstat-val\" id=\"pPts\">۰<\u002Fdiv><div class=\"pstat-lbl\">امتیاز<\u002Fdiv><\u002Fdiv>\n              <div class=\"pstat\"><div class=\"pstat-val\" id=\"pRank\" style=\"color:var(--gold)\">#؟<\u002Fdiv><div class=\"pstat-lbl\">رتبه<\u002Fdiv><\u002Fdiv>\n              <div class=\"pstat\"><div class=\"pstat-val\" id=\"pAcc\">—<\u002Fdiv><div class=\"pstat-lbl\">دقت<\u002Fdiv><\u002Fdiv>\n              <div class=\"pstat\"><div class=\"pstat-val\" id=\"pExact\" style=\"color:var(--gold)\">۰<\u002Fdiv><div class=\"pstat-lbl\">دقیق<\u002Fdiv><\u002Fdiv>\n              <div class=\"pstat\"><div class=\"pstat-val\" id=\"pStreak\" style=\"color:var(--red)\">۰<\u002Fdiv><div class=\"pstat-lbl\">🔥 streak<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"acc-ring\">\n            <svg width=\"80\" height=\"80\" viewBox=\"0 0 80 80\">\n              <circle cx=\"40\" cy=\"40\" r=\"30\" fill=\"none\" stroke=\"rgba(0,0,0,0.07)\" stroke-width=\"8\"><\u002Fcircle>\n              <circle cx=\"40\" cy=\"40\" r=\"30\" fill=\"none\" stroke=\"url(#gr1)\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"188\" id=\"accRing\" stroke-dashoffset=\"188\"><\u002Fcircle>\n              <defs><linearGradient id=\"gr1\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"><stop offset=\"0%\" style=\"stop-color:#0ABF6F\"><\u002Fstop><stop offset=\"100%\" style=\"stop-color:#E89C0A\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n            <\u002Fsvg>\n            <div class=\"acc-ring-text\"><div class=\"acc-pct\" id=\"accPct\">—<\u002Fdiv><div class=\"acc-lbl\">دقت<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"section-title\">📊 رتبه‌های من<\u002Fdiv>\n        <div id=\"profileRanks\"><\u002Fdiv>\n        <div class=\"section-title\">👥 لیگ‌های دوستانه‌ام<\u002Fdiv>\n        <div id=\"profileGroups\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ADMIN -->\n      <div class=\"page\" id=\"page-admin\">\n        <div class=\"admin-section\">\n          <div class=\"admin-title\">➕ افزودن بازی جدید<\u002Fdiv>\n          <div class=\"admin-form\">\n            <div class=\"fg\"><label class=\"flabel\">تیم میزبان<\u002Flabel><input class=\"finput\" id=\"aHome\" placeholder=\"آرژانتین\"><\u002Fdiv>\n            <div class=\"fg\"><label class=\"flabel\">تیم مهمان<\u002Flabel><input class=\"finput\" id=\"aAway\" placeholder=\"فرانسه\"><\u002Fdiv>\n            <div class=\"fg\"><label class=\"flabel\">پرچم میزبان<\u002Flabel><input class=\"finput\" id=\"aHF\" placeholder=\"🇦🇷\"><\u002Fdiv>\n            <div class=\"fg\"><label class=\"flabel\">پرچم مهمان<\u002Flabel><input class=\"finput\" id=\"aAF\" placeholder=\"🇫🇷\"><\u002Fdiv>\n            <div class=\"fg\"><label class=\"flabel\">تاریخ/ساعت<\u002Flabel><input class=\"finput\" id=\"aDate\" placeholder=\"یکشنبه ۱۱ ژوئن ۲۱:۰۰\"><\u002Fdiv>\n            <div class=\"fg\"><label class=\"flabel\">گروه<\u002Flabel><input class=\"finput\" id=\"aGroup\" placeholder=\"گروه A\"><\u002Fdiv>\n            <div class=\"ff\"><button class=\"btn btn-g\" onclick=\"adminAddMatch()\">✅ افزودن بازی<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"admin-section\">\n          <div class=\"admin-title\">📝 ثبت نتایج (همه کاربران خودکار آپدیت میشن)<\u002Fdiv>\n          <div id=\"adminMatchList\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"admin-section\">\n          <div class=\"admin-title\">👥 کاربران ثبت‌نام کرده<\u002Fdiv>\n          <div class=\"ugrid\" id=\"adminUserList\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fmain>\n    <!-- MOBILE BOTTOM NAV -->\n    <nav class=\"bnav\" id=\"bnav\">\n      <button class=\"bni active\" data-page=\"dashboard\" onclick=\"nav('dashboard')\"><span class=\"bni-ic\">🏠<\u002Fspan><span class=\"bni-lb\">خانه<\u002Fspan><\u002Fbutton>\n      <button class=\"bni\" data-page=\"predictions\" onclick=\"nav('predictions')\"><span class=\"bni-ic\">🎯<\u002Fspan><span class=\"bni-lb\">پیش‌بینی<\u002Fspan><\u002Fbutton>\n      <button class=\"bni\" data-page=\"friends\" onclick=\"nav('friends')\"><span class=\"bni-ic\">👥<\u002Fspan><span class=\"bni-lb\">دوستان<\u002Fspan><\u002Fbutton>\n      <button class=\"bni\" data-page=\"leaderboard\" onclick=\"nav('leaderboard')\"><span class=\"bni-ic\">🏆<\u002Fspan><span class=\"bni-lb\">رتبه‌ها<\u002Fspan><\u002Fbutton>\n      <button class=\"bni\" data-page=\"profile\" onclick=\"nav('profile')\"><span class=\"bni-ic\">👤<\u002Fspan><span class=\"bni-lb\">من<\u002Fspan><\u002Fbutton>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"modal-overlay\" id=\"modalOverlay\" onclick=\"closeModal(event)\">\n  <div class=\"modal\" id=\"modalBox\">\n    <div class=\"modal-close\" onclick=\"closeModal()\">✕<\u002Fdiv>\n    <div class=\"modal-title\" id=\"modalTitle\"><\u002Fdiv>\n    <div id=\"modalBody\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n// ========================= REAL WORLD CUP 2026 DATA =========================\n// Sources: ESPN, CBS Sports, NBC Sports, FIFA (June 2026)\n\nconst GROUPS = {\n  A:{name:'گروه A',teams:['مکزیک','آفریقای جنوبی','کره جنوبی','جمهوری چک'],flags:{مکزیک:'🇲🇽',آفریقای_جنوبی:'🇿🇦','کره جنوبی':'🇰🇷','جمهوری چک':'🇨🇿'}},\n  B:{name:'گروه B',teams:['کانادا','بوسنی','قطر','سوئیس'],flags:{کانادا:'🇨🇦',بوسنی:'🇧🇦',قطر:'🇶🇦',سوئیس:'🇨🇭'}},\n  C:{name:'گروه C',teams:['برزیل','مراکش','هائیتی','اسکاتلند'],flags:{برزیل:'🇧🇷',مراکش:'🇲🇦',هائیتی:'🇭🇹',اسکاتلند:'🏴󠁧󠁢󠁳󠁣󠁴󠁿'}},\n  D:{name:'گروه D',teams:['آمریکا','پاراگوئه','استرالیا','ترکیه'],flags:{آمریکا:'🇺🇸',پاراگوئه:'🇵🇾',استرالیا:'🇦🇺',ترکیه:'🇹🇷'}},\n  E:{name:'گروه E',teams:['آلمان','کوراسائو','ساحل عاج','اکوادور'],flags:{آلمان:'🇩🇪',کوراسائو:'🇨🇼','ساحل عاج':'🇨🇮',اکوادور:'🇪🇨'}},\n  F:{name:'گروه F',teams:['هلند','ژاپن','سوئد','تونس'],flags:{هلند:'🇳🇱',ژاپن:'🇯🇵',سوئد:'🇸🇪',تونس:'🇹🇳'}},\n  G:{name:'گروه G',teams:['بلژیک','مصر','ایران','نیوزیلند'],flags:{بلژیک:'🇧🇪',مصر:'🇪🇬',ایران:'🇮🇷',نیوزیلند:'🇳🇿'}},\n  H:{name:'گروه H',teams:['اسپانیا','کیپ ورد','عربستان','اروگوئه'],flags:{اسپانیا:'🇪🇸','کیپ ورد':'🇨🇻',عربستان:'🇸🇦',اروگوئه:'🇺🇾'}},\n  I:{name:'گروه I',teams:['فرانسه','سنگال','عراق','نروژ'],flags:{فرانسه:'🇫🇷',سنگال:'🇸🇳',عراق:'🇮🇶',نروژ:'🇳🇴'}},\n  J:{name:'گروه J',teams:['آرژانتین','الجزایر','اتریش','اردن'],flags:{آرژانتین:'🇦🇷',الجزایر:'🇩🇿',اتریش:'🇦🇹',اردن:'🇯🇴'}},\n  K:{name:'گروه K',teams:['پرتغال','کنگو','ازبکستان','کلمبیا'],flags:{پرتغال:'🇵🇹',کنگو:'🇨🇩',ازبکستان:'🇺🇿',کلمبیا:'🇨🇴'}},\n  L:{name:'گروه L',teams:['انگلیس','کرواسی','غنا','پاناما'],flags:{انگلیس:'🏴󠁧󠁢󠁥󠁮󠁧󠁿',کرواسی:'🇭🇷',غنا:'🇬🇭',پاناما:'🇵🇦'}},\n};\n\n// ── Country code map (ISO 3166-1 alpha-2) ─────────────────────────────────────\n// flagcdn.com delivers 20x15 / 40x30 png flags for free, no key needed\n// URL: https://flagcdn.com/w40/{code}.png\nconst COUNTRY_CODES = {\n  // Group A\n  'مکزیک':'mx','آفریقای جنوبی':'za','آفریقای_جنوبی':'za',\n  'کره جنوبی':'kr','کره_جنوبی':'kr','جمهوری چک':'cz','جمهوری_چک':'cz',\n  // Group B\n  'کانادا':'ca','بوسنی':'ba','قطر':'qa','سوئیس':'ch',\n  // Group C\n  'برزیل':'br','مراکش':'ma','هائیتی':'ht','اسکاتلند':'gb-sct',\n  // Group D\n  'آمریکا':'us','پاراگوئه':'py','استرالیا':'au','ترکیه':'tr',\n  // Group E\n  'آلمان':'de','کوراسائو':'cw','ساحل عاج':'ci','ساحل_عاج':'ci','اکوادور':'ec',\n  // Group F\n  'هلند':'nl','ژاپن':'jp','سوئد':'se','تونس':'tn',\n  // Group I\n  'عراق':'iq','نروژ':'no',\n  // Group G\n  'آرژانتین':'ar','الجزایر':'dz','اتریش':'at','اردن':'jo',\n  // Group H\n  'پرتغال':'pt','کنگو':'cd','ازبکستان':'uz','کلمبیا':'co',\n  // Group I\n  'اسپانیا':'es','کیپ ورد':'cv','کیپ_ورد':'cv','عربستان':'sa','اروگوئه':'uy',\n  // Group J\n  'فرانسه':'fr','سنگال':'sn',\n  // Group K\n  'انگلیس':'gb-eng','کرواسی':'hr','غنا':'gh','پاناما':'pa',\n  // Group L\n  'بلژیک':'be','مصر':'eg','ایران':'ir','نیوزیلند':'nz',\n};\n\n// Also build emoji fallback for cases where image fails\nconst FLAGS = {\n  'مکزیک':'🇲🇽','آفریقای جنوبی':'🇿🇦','آفریقای_جنوبی':'🇿🇦',\n  'کره جنوبی':'🇰🇷','کره_جنوبی':'🇰🇷','جمهوری چک':'🇨🇿','جمهوری_چک':'🇨🇿',\n  'کانادا':'🇨🇦','بوسنی':'🇧🇦','قطر':'🇶🇦','سوئیس':'🇨🇭',\n  'برزیل':'🇧🇷','مراکش':'🇲🇦','هائیتی':'🇭🇹','اسکاتلند':'🏴󠁧󠁢󠁳󠁣󠁴󠁿',\n  'آمریکا':'🇺🇸','پاراگوئه':'🇵🇾','استرالیا':'🇦🇺','ترکیه':'🇹🇷',\n  'آلمان':'🇩🇪','کوراسائو':'🇨🇼','ساحل عاج':'🇨🇮','ساحل_عاج':'🇨🇮','اکوادور':'🇪🇨',\n  'هلند':'🇳🇱','ژاپن':'🇯🇵','سوئد':'🇸🇪','تونس':'🇹🇳','عراق':'🇮🇶','نروژ':'🇳🇴',\n  'آرژانتین':'🇦🇷','الجزایر':'🇩🇿','اتریش':'🇦🇹','اردن':'🇯🇴',\n  'پرتغال':'🇵🇹','کنگو':'🇨🇩','ازبکستان':'🇺🇿','کلمبیا':'🇨🇴',\n  'اسپانیا':'🇪🇸','کیپ ورد':'🇨🇻','کیپ_ورد':'🇨🇻','عربستان':'🇸🇦','اروگوئه':'🇺🇾',\n  'فرانسه':'🇫🇷','سنگال':'🇸🇳',\n  'انگلیس':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','کرواسی':'🇭🇷','غنا':'🇬🇭','پاناما':'🇵🇦',\n  'بلژیک':'🇧🇪','مصر':'🇪🇬','ایران':'🇮🇷','نیوزیلند':'🇳🇿',\n};\n// Populate from GROUPS too\nObject.values(GROUPS).forEach(g=>{Object.entries(g.flags||{}).forEach(([k,v])=>{\n  FLAGS[k]=v;FLAGS[k.replace(/_/g,' ')]=v;FLAGS[k.replace(/ /g,'_')]=v;\n});});\n// flag(t, size) → HTML <img> tag — use inside innerHTML / template literals\nfunction flag(t, size=22) {\n  if (!t) return '<span class=\"f-emoji\">🏳️<\u002Fspan>';\n  const norm = t.replace(/_/g,' ');\n  const code = COUNTRY_CODES[t] || COUNTRY_CODES[norm] || COUNTRY_CODES[t.replace(/ /g,'_')];\n  const emoji = FLAGS[t] || FLAGS[norm] || '🏳️';\n  if (code) {\n    const w = size <= 20 ? 20 : 40;\n    return `<img src=\"https://flagcdn.com/w${w}/${code}.png\" `\n      + `alt=\"${norm}\" loading=\"lazy\" `\n      + `style=\"width:${size}px;height:${Math.round(size*0.67)}px;border-radius:2px;`\n      + `vertical-align:middle;display:inline-block;object-fit:cover;flex-shrink:0;\" `\n      + `onerror=\"this.replaceWith(Object.assign(document.createElement('span'),{className:'f-emoji',textContent:'${emoji}'}))\">`;\n  }\n  return `<span class=\"f-emoji\" style=\"font-size:${Math.round(size*1.1)}px\">${emoji}<\u002Fspan>`;\n}\n\n// flagTxt(t) → plain emoji string — use in textContent, option values, toast\nfunction flagTxt(t) {\n  if (!t) return '🏳️';\n  const norm = t.replace(/_/g,' ');\n  return FLAGS[t] || FLAGS[norm] || FLAGS[t.replace(/ /g,'_')] || '🏳️';\n}\n\n// MATCHES — full 72-match group stage, generated from the official FIFA 2026 final draw.\n// Round-robin per group (FIFA fixed positions 1-4 = GROUPS[x].teams order):\n//   MD1: 1v2, 3v4   ·   MD2: 1v3, 4v2   ·   MD3: 4v1, 2v3\n// Dates are the official FIFA match dates (June 2026), shown as Persian \"DD ژوئن\".\nconst _faDigits = v => String(v).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);\n// June day numbers per group → [ [MD1a,MD1b], [MD2a,MD2b], [MD3a,MD3b] ]\nconst GROUP_SCHEDULE = {\n  A:[[11,11],[18,18],[24,24]], B:[[12,13],[18,18],[24,24]],\n  C:[[13,13],[19,19],[24,24]], D:[[12,13],[19,19],[25,25]],\n  E:[[14,14],[20,20],[25,25]], F:[[14,14],[20,20],[25,25]],\n  G:[[15,15],[21,21],[26,26]], H:[[15,15],[21,21],[26,26]],\n  I:[[16,16],[22,22],[26,26]], J:[[16,16],[22,22],[27,27]],\n  K:[[17,17],[23,23],[27,27]], L:[[17,17],[23,23],[27,27]],\n};\nconst MD_PAIRS = [[[0,1],[2,3]], [[0,2],[3,1]], [[3,0],[1,2]]];\nconst MATCHES = (function(){\n  const out = [];\n  Object.keys(GROUPS).forEach(gk => {\n    const t = GROUPS[gk].teams;\n    for (let md = 0; md < 3; md++) {\n      MD_PAIRS[md].forEach((pair, i) => {\n        out.push({ group: gk, home: t[pair[0]], away: t[pair[1]], day: GROUP_SCHEDULE[gk][md][i], matchday: md + 1 });\n      });\n    }\n  });\n  out.sort((a, b) => a.day - b.day || a.group.localeCompare(b.group) || a.matchday - b.matchday);\n  return out.map((m, idx) => ({\n    id: idx + 1, group: m.group, home: m.home, away: m.away, matchday: m.matchday,\n    date: _faDigits(m.day) + ' ژوئن', time: '',\n    dateObj: `2026-06-${String(m.day).padStart(2, '0')}T18:00Z`,\n    status: 'upcoming', homeScore: null, awayScore: null\n  }));\n})();\n\n// Persian weekday from match dateObj — computed in Tehran time to match the displayed date\nlet _wdFmt;\ntry{ _wdFmt=new Intl.DateTimeFormat('fa-IR',{weekday:'long',timeZone:'Asia/Tehran'}); }catch(_){ _wdFmt=null; }\nfunction matchWeekday(m){\n  if(!m||!m.dateObj)return '';\n  const d=new Date(m.dateObj);\n  if(isNaN(d))return '';\n  if(_wdFmt)return _wdFmt.format(d);\n  return ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'][d.getDay()];\n}\n// \"جمعه ۱۲ ژوئن\" — weekday + existing date label\nfunction matchDateLabel(m){\n  const wd=matchWeekday(m);\n  return wd ? wd+' '+m.date : m.date;\n}\n\n// Group standings state\nconst GROUP_STATS = {};\nObject.keys(GROUPS).forEach(k=>{\n  GROUP_STATS[k]={};\n  GROUPS[k].teams.forEach(t=>{GROUP_STATS[k][t]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};});\n});\n\nconst BADGES = [\n  {icon:'🔮',name:'اوراکل',desc:'۱۰ پیش‌بینی درست',min:10,field:'correct'},\n  {icon:'⚽',name:'ماشین گل',desc:'۵ نتیجه دقیق',min:5,field:'exact'},\n  {icon:'👑',name:'پادشاه',desc:'رتبه اول لیگ',special:'rank1'},\n  {icon:'🎯',name:'تک‌تیرانداز',desc:'۳ نتیجه دقیق متوالی',min:3,field:'exact'},\n  {icon:'🔥',name:'آتشین',desc:'۷ پیش‌بینی صحیح',min:7,field:'correct'},\n  {icon:'💎',name:'الماس',desc:'۲۰ امتیاز',min:20,field:'points'},\n  {icon:'🏆',name:'قهرمان',desc:'برنده لیگ',special:'winner'},\n  {icon:'🌍',name:'جهانی',desc:'پیش‌بینی از ۶ گروه',special:'sixgroups'},\n];\n\n// ===== STATE =====\n// ── Admin credentials (change password here) ──────────────────────────────\nconst ADMIN_USER = 'samira-admin';\nconst ADMIN_PASS = 'WC2026@Admin';\n\n// ═══════════════════════════════════════════════════════════════════════════\n// ██  FIREBASE CONFIG  ██\n// ۱. به console.firebase.google.com برو\n// ۲. پروژه جدید بساز\n// ۳. Realtime Database فعال کن (در test mode)\n// ۴. Project Settings → Your apps → Web app → firebaseConfig را کپی کن\n// ۵. مقادیر زیر را با مقادیر پروژه خودت جایگزین کن\n// ═══════════════════════════════════════════════════════════════════════════\nconst FIREBASE_CONFIG = {\n  apiKey:            \"AIzaSyDXtw8T580e0408eYX5NTm7oftlcGfqkxI\",\n  authDomain:        \"worldcup2026-9578b.firebaseapp.com\",\n  databaseURL:       \"https://worldcup2026-9578b-default-rtdb.firebaseio.com\",\n  projectId:         \"worldcup2026-9578b\",\n  storageBucket:     \"worldcup2026-9578b.firebasestorage.app\",\n  messagingSenderId: \"118608499360\",\n  appId:             \"1:118608499360:web:38751c38a972f41b75afc5\",\n  measurementId:     \"G-4ZE4JQPTH7\"\n};\n\n// ── Firebase DB helper ───────────────────────────────────────────────────────\nlet db = null;\nlet fbReady = false;\nlet fbListenersAttached = false;\nlet _fbConnected = false;     // true once the realtime socket is up\nlet _fbDataArrived = false;   // true once we've received the users snapshot\nlet _connErrShown = false;\n\nfunction initFirebase() {\n  // Check if config has been filled in\n  if (FIREBASE_CONFIG.apiKey === 'YOUR_API_KEY') {\n    console.warn('Firebase not configured — running in local mode (data lost on refresh)');\n    showFbBanner();\n    return;\n  }\n  try {\n    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);\n    db = firebase.database();\n    // ── Anonymous Auth ───────────────────────────────────────────────────────\n    // The database rules now require `auth != null`, so we sign every visitor\n    // in anonymously before any read/write. fbReady only flips true AFTER auth\n    // succeeds — until then the write helpers no-op (they all guard on fbReady),\n    // which is fine since sign-in resolves in a few hundred ms.\n    firebase.auth().onAuthStateChanged(user => {\n      if (user && !fbReady) {\n        fbReady = true;\n        console.log('Firebase connected ✅ (anon uid:', user.uid + ')');\n        attachFbListeners();\n        // Register this user now that we're authenticated (name only — see note\n        // at the original startup call site about not zeroing stats here).\n        if (currentUser && !currentUser.isAdmin) {\n          fbUpdate(`users/${currentUser.name}`, { name: currentUser.name });\n        }\n      }\n    });\n    firebase.auth().signInAnonymously().catch(e => {\n      console.error('Anonymous auth failed:', e);\n      // auth/operation-not-allowed → Anonymous sign-in is OFF in the console.\n      if (isAdmin) {\n        const bar = document.getElementById('fbBanner');\n        if (bar) {\n          bar.style.display = 'flex';\n          bar.style.background = 'rgba(232,48,80,.1)';\n          bar.style.color = 'var(--red)';\n          bar.innerHTML = (e.code === 'auth/operation-not-allowed')\n            ? '❌ ورود ناشناس در Firebase فعال نیست — به Console → Authentication → Sign-in method → Anonymous → Enable برو.'\n            : '❌ خطا در احراز هویت Firebase: ' + (e.code || e.message);\n        }\n      }\n    });\n  } catch(e) {\n    console.error('Firebase init failed:', e);\n    showFbBanner('error');\n  }\n}\n\n// Player-visible connection error (NOT admin-gated)\nfunction showConnError(kind) {\n  if (_fbDataArrived) return;            // data already loaded → nothing wrong\n  if (_connErrShown) return;\n  _connErrShown = true;\n  const bar = document.getElementById('fbBanner');\n  if (!bar) return;\n  let msg = '⚠️ ارتباط با سرور لیگ برقرار نشد — جدول و امتیازها بارگذاری نشد.';\n  if (isAdmin) {\n    msg += (kind === 'offline')\n      ? ' — socket وصل نشد (شبکه؟ databaseURL؟).'\n      : ' — خواندن رد شد: مطمئن شو Anonymous Auth در Console فعال است و قوانین Realtime Database روی auth != null تنظیم شده.';\n  }\n  bar.style.display = 'flex';\n  bar.style.background = 'rgba(232,48,80,.1)';\n  bar.style.borderBottom = '1px solid rgba(232,48,80,.25)';\n  bar.style.color = 'var(--red)';\n  bar.innerHTML = msg +\n    ` <button onclick=\"location.reload()\" style=\"margin-right:8px;padding:3px 12px;border-radius:6px;background:var(--red);color:#fff;border:none;font-family:var(--font);font-size:11px;cursor:pointer;font-weight:700\">🔄 تلاش مجدد<\u002Fbutton>`;\n}\nfunction hideConnError() {\n  _connErrShown = false;\n  const bar = document.getElementById('fbBanner');\n  if (bar && bar.style.color === 'var(--red)') { bar.style.display = 'none'; }\n}\n\nfunction showFbBanner(mode) {\n  if (!isAdmin) return; // developers/admin only — regular players never see infra warnings\n  const bar = document.getElementById('fbBanner');\n  if (!bar) return;\n  if (!mode) {\n    bar.style.display = 'flex';\n    bar.innerHTML = `⚠️ Firebase پیکربندی نشده — داده‌ها فقط در این مرورگر ذخیره می‌شوند\n      <button onclick=\"openFbSettings()\" style=\"margin-right:8px;padding:3px 10px;border-radius:6px;background:var(--gold);color:#fff;border:none;font-family:var(--font);font-size:11px;cursor:pointer;font-weight:700\">⚙️ تنظیم Firebase<\u002Fbutton>\n      <button onclick=\"this.closest('#fbBanner').style.display='none'\" style=\"padding:3px 8px;border-radius:6px;background:var(--brd);color:var(--tx3);border:none;font-family:var(--font);font-size:11px;cursor:pointer\">✕<\u002Fbutton>`;\n  } else {\n    bar.style.display = 'flex';\n    bar.style.background = 'rgba(232,48,80,.1)';\n    bar.innerHTML = `❌ خطا در اتصال به Firebase — حالت محلی فعال است`;\n  }\n}\n\n// ── Write helpers ─────────────────────────────────────────────────────────────\nfunction fbSet(path, data) {\n  if (!fbReady) return Promise.resolve();\n  return db.ref(path).set(data).catch(e => console.warn('fbSet error:', e));\n}\nfunction fbUpdate(path, data) {\n  if (!fbReady) return Promise.resolve();\n  return db.ref(path).update(data).catch(e => console.warn('fbUpdate error:', e));\n}\nfunction fbPush(path, data) {\n  if (!fbReady) return Promise.resolve();\n  return db.ref(path).push(data).catch(e => console.warn('fbPush error:', e));\n}\n\n// ── Real-time listeners ───────────────────────────────────────────────────────\n// ── One-time data migration: clean predictions left on now-wrong match ids ───\n// When the group draw was corrected to the official FIFA result, the fixture\n// behind each match id changed. A prediction the kids saved on an OLD id was for\n// a DIFFERENT pairing, so it must be cleared — but predictions whose pairing is\n// unchanged (same id → same teams) are kept untouched. Runs once ever, gated by\n// a Firebase flag so it never re-fires and never touches new predictions.\nconst OLD_FIX = {\n  1:['مکزیک','آفریقای جنوبی'],2:['کره جنوبی','جمهوری چک'],\n  3:['کانادا','بوسنی'],4:['قطر','سوئیس'],\n  5:['آمریکا','پاراگوئه'],6:['استرالیا','ترکیه'],\n  7:['برزیل','مراکش'],8:['هائیتی','اسکاتلند'],\n  9:['آلمان','کوراسائو'],10:['ساحل عاج','ژاپن'],\n  11:['هلند','ژاپن'],\n  12:['آرژانتین','الجزایر'],13:['اتریش','اردن'],\n  14:['اسپانیا','کیپ ورد'],15:['عربستان','اروگوئه'],\n  16:['پرتغال','کنگو'],17:['ازبکستان','کلمبیا'],\n  18:['فرانسه','سنگال'],19:['عراق','نروژ'],\n  20:['انگلیس','کرواسی'],21:['غنا','پاناما'],\n  22:['بلژیک','نیوزیلند'],23:['مصر','ایران'],\n  24:['مکزیک','کره جنوبی'],25:['جمهوری چک','آفریقای جنوبی'],\n  26:['آرژانتین','اتریش'],27:['اردن','الجزایر'],\n  28:['اسپانیا','عربستان'],29:['فرانسه','عراق'],\n  30:['بلژیک','مصر'],31:['ایران','نیوزیلند'],32:['انگلیس','غنا'],\n};\nlet _migRan = false;\nfunction migrateFixV2(){\n  if(!fbReady || _migRan) return;\n  _migRan = true;\n  db.ref('migrations/fixGroupsV2').once('value').then(snap=>{\n    if(snap.val()) return;                 // already cleaned once — never touch again\n    const dirty = [];\n    Object.keys(OLD_FIX).forEach(k=>{\n      const id = Number(k);\n      const nm = MATCHES.find(m=>m.id===id);\n      const o  = OLD_FIX[k];\n      if(!nm || nm.home!==o[0] || nm.away!==o[1]) dirty.push(id); // fixture changed\n    });\n    const updates = {}; let removed = 0;\n    Object.values(users).forEach(u=>{\n      if(!u || !u.preds) return;\n      dirty.forEach(id=>{\n        if(u.preds[id]!==undefined){\n          updates[`users/${u.name}/preds/${id}`] = null; // delete in Firebase\n          delete u.preds[id];                            // delete in memory\n          removed++;\n        }\n      });\n      u.predictions = Object.values(u.preds||{}).filter(p=>p&&p.saved).length;\n    });\n    const finish = ()=> db.ref('migrations/fixGroupsV2').set(Date.now()).then(()=>{\n      if(removed){\n        rebuildAllStats();\n        renderMiniLb(); updateStats(); updateGroupProgress();\n        renderAllMatches(); renderDashMatches();\n        console.log('🧹 پیش‌بینی‌های روی بازی اشتباه پاک شد:', removed);\n      }\n    });\n    (Object.keys(updates).length ? db.ref().update(updates) : Promise.resolve())\n      .then(finish).catch(e=>console.warn('migrate apply fail', e));\n  }).catch(e=>console.warn('migrate check fail', e));\n}\n\nfunction attachFbListeners() {\n  if (!fbReady || fbListenersAttached) return;\n  fbListenersAttached = true;\n\n  // Connection + permission watchdog (visible to ALL players). If we never\n  // connect, or connect but the first read is denied/empty, the player would\n  // otherwise just see a blank leaderboard with no explanation.\n  db.ref('.info/connected').on('value', s => {\n    _fbConnected = !!s.val();\n    if (_fbConnected && _fbDataArrived) hideConnError();\n  });\n  setTimeout(() => {\n    if (!_fbDataArrived) showConnError(_fbConnected ? 'denied' : 'offline');\n  }, 9000);\n\n  // ── Users (scores/predictions) ──────────────────────────────────────────\n  db.ref('users').on('value', snap => {\n    _fbDataArrived = true;\n    hideConnError();\n    const data = snap.val();\n    if (!data) return;\n    Object.entries(data).forEach(([name, u]) => {\n      if (!users[name]) users[name] = {name, points:0, predictions:0, correct:0, exact:0, preds:{}, comments:{}};\n      const local = users[name];\n      // Merge remote data but keep current session preds/comments\n      local.points      = u.points      || 0;\n      local.predictions = u.predictions || 0;\n      local.correct     = u.correct     || 0;\n      local.exact       = u.exact       || 0;\n      if (u.preds)    Object.assign(local.preds,    u.preds);\n      if (u.comments) Object.assign(local.comments, u.comments);\n    });\n    migrateFixV2();\n    // Remote scalar stats can be stale (they're only written by each user's own\n    // session). If we already know any finished results, recompute everyone's\n    // points/accuracy locally from preds + results — never trust stale scalars.\n    if (MATCHES.some(m => m.status === 'finished' && m.homeScore !== null)) rebuildAllStats();\n    renderMiniLb();\n    updateStats();\n    if (document.getElementById('page-leaderboard').classList.contains('active')) { renderPodium(); renderFullLb(); }\n    if (document.getElementById('page-reports').classList.contains('active')) renderReports();\n  }, err => {\n    console.error('users read denied:', err && err.code, err && err.message);\n    showConnError('denied');\n  });\n\n  // ── Match results (admin writes here) ────────────────────────────────────\n  db.ref('matches').on('value', snap => {\n    const data = snap.val();\n    if (!data) return;\n    let changed = false;\n    Object.entries(data).forEach(([id, m]) => {\n      const local = MATCHES.find(x => x.id === parseInt(id));\n      if (!local) return;\n      if (m.status && (local.status !== m.status || local.homeScore !== (m.homeScore ?? null) || local.awayScore !== (m.awayScore ?? null))) {\n        local.status = m.status;\n        local.homeScore = m.homeScore ?? null;\n        local.awayScore = m.awayScore ?? null;\n        changed = true;\n      }\n      // Real kickoff time synced by any client — apply so locks/countdown are\n      // correct everywhere, even on devices whose own API call failed.\n      if (m.dateObj && (local.dateObj !== m.dateObj || !local.hasRealTime)) {\n        local.dateObj = m.dateObj;\n        local.hasRealTime = true;\n        changed = true;\n      }\n    });\n    if (changed) {\n      // Recompute the bracket FIRST so any newly-decided knockout teams exist in\n      // MATCHES before we tally points.\n      updateBracketFromGroups(); propagateWinners(); syncKnockoutMatches();\n      rebuildAllStats();\n      renderDashMatches(); renderAllMatches(); renderMiniLb();\n      updateStats(); updateGroupProgress();\n      if (document.getElementById('page-groups').classList.contains('active')) renderGroupTables();\n    }\n  });\n\n  // ── Knockout results (admin writes here; mirrored into the MATCHES feed) ────\n  // Knockout scores live in their own node so they sync independently of the\n  // group results in `matches/`. Either listener triggers a full recompute.\n  db.ref('bracket/scores').on('value', snap => {\n    BRACKET.scores = snap.val() || {};\n    updateBracketFromGroups(); propagateWinners(); syncKnockoutMatches();\n    rebuildAllStats();\n    renderDashMatches(); renderAllMatches(); renderMiniLb(); updateStats();\n    if (document.getElementById('page-bracket')?.classList.contains('active')) renderBracket();\n  });\n\n  // ── Activity feed ─────────────────────────────────────────────────────────\n  db.ref('activity').limitToLast(50).on('value', snap => {\n    const data = snap.val();\n    if (!data) return;\n    const remote = Object.values(data).reverse();\n    // Merge: remote is source of truth for activity\n    activityFeed = remote;\n    renderMiniAct();\n    if (document.getElementById('page-activity').classList.contains('active')) renderFullAct();\n  });\n\n  // ── Comments per match ───────────────────────────────────────────────────\n  db.ref('comments').on('value', snap => {\n    const data = snap.val();\n    if (!data) return;\n    Object.entries(data).forEach(([mid, cmts]) => {\n      const midInt = parseInt(mid);\n      Object.entries(cmts).forEach(([uname, userCmts]) => {\n        if (!users[uname]) users[uname] = getUser(uname);\n        if (!users[uname].comments[midInt]) users[uname].comments[midInt] = [];\n        const existing = new Set(users[uname].comments[midInt].map(c => c.text + c.time));\n        Object.values(userCmts).forEach(cmt => {\n          if (!existing.has(cmt.text + cmt.time)) {\n            users[uname].comments[midInt].unshift(cmt);\n          }\n        });\n      });\n    });\n    if (document.getElementById('page-predictions').classList.contains('active')) renderAllMatches();\n  });\n\n  // ── Friend groups (mini-leagues) ─────────────────────────────────────────\n  db.ref('friendGroups').on('value', snap => {\n    const data = snap.val() || {};\n    friendGroups = data;\n    if (document.getElementById('page-friends').classList.contains('active')) renderFriends();\n    if (document.getElementById('page-profile').classList.contains('active')) renderProfileGroups();\n  });\n}\n\n// ── Save current user's scalar stats to Firebase (NEVER touches preds tree) ──\nlet _lastSavedStats = '';\nfunction fbSaveUser() {\n  if (!fbReady || !currentUser || currentUser.isAdmin) return;\n  const u = currentUser;\n  // IMPORTANT: do NOT write the whole `preds` object here. Writing the full\n  // object replaces the remote preds node and wipes any prediction not present\n  // in this session (e.g. made on another device / before sync) → \"deleted\n  // predictions\". Stats only; predictions are saved per-match in fbSavePred().\n  const payload = {\n    name:        u.name,\n    points:      u.points      || 0,\n    predictions: u.predictions || 0,\n    correct:     u.correct     || 0,\n    exact:       u.exact       || 0,\n  };\n  const key = JSON.stringify(payload);\n  if (key === _lastSavedStats) return; // skip identical writes (prevents echo loops)\n  _lastSavedStats = key;\n  fbUpdate(`users/${u.name}`, payload);\n}\n\n// ── Save ONE prediction at its own path so siblings are never clobbered ──────\n// Returns the RAW write promise (resolves only on server ack, rejects on\n// permission error, stays pending while offline) so callers can confirm the\n// prediction actually reached the server instead of just the local device.\nfunction fbSavePred(matchId, predObj) {\n  if (!fbReady || !currentUser || currentUser.isAdmin) return Promise.resolve('skip');\n  fbSaveUser();\n  return db.ref(`users/${currentUser.name}/preds/${matchId}`).update(predObj);\n}\n\n// ── Save comment to Firebase (stores full object incl. reply target) ─────────\nfunction fbSaveComment(matchId, cobj) {\n  if (!fbReady || !currentUser) return;\n  fbPush(`comments/${matchId}/${currentUser.name}`, cobj);\n}\n\n// ── Save match result to Firebase (admin only) ────────────────────────────────\nfunction fbSaveMatch(matchId, homeScore, awayScore, status) {\n  if (!fbReady) return;\n  fbSet(`matches/${matchId}`, { homeScore, awayScore, status });\n}\n\n// ── Settings modal ────────────────────────────────────────────────────────────\nfunction openFbSettings() {\n  openModal('⚙️ تنظیمات Firebase', `\n    <div style=\"font-size:13px;line-height:1.9\">\n      <p style=\"color:var(--tx2);margin-bottom:14px\">\n        برای ذخیره‌سازی دائمی داده‌ها، یک پروژه Firebase رایگان بساز و\n        اطلاعات زیر را از <strong>Project Settings → Your apps → Web app<\u002Fstrong> کپی کن:\n      <\u002Fp>\n      <div style=\"background:var(--sur2);border-radius:var(--r3);padding:12px;margin-bottom:14px\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;\">\n          ${['apiKey','authDomain','databaseURL','projectId','storageBucket','messagingSenderId','appId'].map(k=>`\n            <div class=\"fg\" style=\"grid-column:${k==='databaseURL'||k==='authDomain'?'1/-1':'auto'}\">\n              <label class=\"flabel\">${k}<\u002Flabel>\n              <input class=\"finput\" id=\"fb_${k}\" placeholder=\"${k}\" value=\"${FIREBASE_CONFIG[k]!=='YOUR_'+k.toUpperCase()?FIREBASE_CONFIG[k]:''}\" style=\"font-size:11px\">\n            <\u002Fdiv>`).join('')}\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"btn btn-g\" style=\"width:100%\" onclick=\"saveFbConfig()\">\n        🔥 اتصال به Firebase\n      <\u002Fbutton>\n      <div style=\"margin-top:10px;font-size:11px;color:var(--tx3)\">\n        console.firebase.google.com → پروژه جدید → Realtime Database → test mode\n      <\u002Fdiv>\n    <\u002Fdiv>`);\n}\n\nfunction saveFbConfig() {\n  const keys = ['apiKey','authDomain','databaseURL','projectId','storageBucket','messagingSenderId','appId'];\n  let valid = true;\n  keys.forEach(k => {\n    const el = document.getElementById('fb_' + k);\n    if (el && el.value.trim()) FIREBASE_CONFIG[k] = el.value.trim();\n    else if (k === 'apiKey' || k === 'databaseURL') valid = false;\n  });\n  if (!valid) { toast('حداقل apiKey و databaseURL باید پر باشد', 'e'); return; }\n  closeModal();\n  toast('در حال اتصال به Firebase...', 'i', 2000);\n  // Re-initialize\n  if (firebase.apps.length) firebase.apps[0].delete().then(() => { fbReady=false; fbListenersAttached=false; initFirebase(); attachFbListeners(); });\n  else { initFirebase(); attachFbListeners(); }\n}\n\nlet currentUser=null, users={}, activityFeed=[], currentFilter='all';\nlet isAdmin=false;\nlet cdTarget=null;\n\n// ===== HELPERS =====\nconst FN=n=>{if(n===null||n===undefined)return'';return String(n).replace(/\\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);};\nconst AVCOLORS=['#0ABF6F,#089958','#E89C0A,#b57800','#E83050,#b01a30','#2D7FE8,#1a5fcc','#7C3AED,#5b28b5','#FF6B35,#cc4400','#06B6D4,#0891B2','#EC4899,#be185d','#84CC16,#65a30d','#F97316,#c45d00'];\nfunction ucolor(n){let h=0;for(let c of n)h+=c.charCodeAt(0);return AVCOLORS[h%AVCOLORS.length];}\nfunction uinit(n){return n?n[0]:'؟';}\nfunction astyle(n){return `linear-gradient(135deg,${ucolor(n)})`;}\nfunction avatarEl(n,size=30,fs=13){return `<div style=\"width:${size}px;height:${size}px;border-radius:50%;background:${astyle(n)};display:flex;align-items:center;justify-content:center;font-size:${fs}px;font-weight:800;color:#fff;flex-shrink:0;\">${uinit(n)}<\u002Fdiv>`;}\nfunction getUser(n){if(!users[n])users[n]={name:n,points:0,predictions:0,correct:0,exact:0,preds:{},comments:{}};return users[n];}\nfunction now(){return Date.now();}\n// Format a stored timestamp as a Persian relative time. Legacy entries were\n// stored as the literal string 'همین الان' — show those as-is.\nfunction timeAgo(t){\n  if(typeof t!=='number') return t||'';\n  const s=Math.max(0,Math.floor((Date.now()-t)/1000));\n  if(s<60)  return 'همین الان';\n  const m=Math.floor(s/60);  if(m<60) return FN(m)+' دقیقه پیش';\n  const h=Math.floor(m/60);  if(h<24) return FN(h)+' ساعت پیش';\n  const d=Math.floor(h/24);  if(d<7)  return FN(d)+' روز پیش';\n  try{ return new Intl.DateTimeFormat('fa-IR',{day:'numeric',month:'long'}).format(new Date(t)); }\n  catch(_){ return FN(d)+' روز پیش'; }\n}\nfunction accOf(u){return u.predictions?(u.correct||0)/u.predictions:0;}\n// Sort: points → exact results → correct → accuracy → name (so ties are deterministic, not random)\nfunction cmpUsers(a,b){\n  return (b.points||0)-(a.points||0)\n    ||(b.exact||0)-(a.exact||0)\n    ||(b.correct||0)-(a.correct||0)\n    ||accOf(b)-accOf(a)\n    ||String(a.name).localeCompare(String(b.name),'fa');\n}\nfunction getSorted(){return Object.values(users).filter(u=>!u.isAdmin).sort(cmpUsers);}\nfunction rankKey(u){return [(u.points||0),(u.exact||0),(u.correct||0),Math.round(accOf(u)*1000)].join('|');}\n// Competition ranking: equal scores share the same rank (1,1,3…). Returns null\n// for anyone with 0 points — they are NOT \"top of the table\" / صدرنشین yet.\nfunction rankOf(u,sorted){\n  if((u.points||0)<=0) return null;\n  sorted=sorted||getSorted();\n  let rank=0,seen=0,prevKey=null;\n  for(const x of sorted){\n    seen++;\n    const k=rankKey(x);\n    if(k!==prevKey){rank=seen;prevKey=k;}\n    if(x.name===u.name) return rank;\n  }\n  return null;\n}\n\n// ── Count-up number animation (only animates when the value changes) ──\nfunction animateNum(el,target,fmt){\n  if(!el)return; fmt=fmt||FN;\n  const prev=parseInt(el.dataset.v||'0',10)||0;\n  el.dataset.v=target;\n  if(prev===target||matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent=fmt(target); return; }\n  const dur=750, t0=performance.now();\n  (function tick(t){\n    const k=Math.min(1,(t-t0)/dur);\n    const e=1-Math.pow(1-k,3); // ease-out cubic\n    el.textContent=fmt(Math.round(prev+(target-prev)*e));\n    if(k<1)requestAnimationFrame(tick);\n  })(t0);\n}\n\nfunction toast(msg,type='s',dur=3000){\n  const tc=document.getElementById('toastC');\n  const t=document.createElement('div');\n  t.className=`toast ${type}`;\n  const ic={s:'✅',e:'❌',i:'ℹ️'};\n  t.innerHTML=`<span>${ic[type]||'ℹ️'}<\u002Fspan><span>${msg}<\u002Fspan>`;\n  tc.appendChild(t);\n  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},dur);\n}\n\nfunction confetti(){\n  const cc=['#0ABF6F','#E89C0A','#E83050','#2D7FE8','#7C3AED'];\n  const c=document.getElementById('confettiC');\n  for(let i=0;i<70;i++){\n    const p=document.createElement('div');p.className='cp';\n    p.style.cssText=`left:${Math.random()*100}%;animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.8}s;background:${cc[Math.floor(Math.random()*cc.length)]};width:${6+Math.random()*6}px;height:${6+Math.random()*6}px;border-radius:${Math.random()>.5?'50%':'2px'};`;\n    c.appendChild(p);setTimeout(()=>p.remove(),3500);\n  }\n}\n\nfunction addAct(user,text,type='g'){\n  const entry={user,text,type,time:now()};\n  activityFeed.unshift(entry);\n  renderMiniAct();renderFullAct();\n  document.getElementById('actBadge').style.display='';\n  fbPush('activity', entry);  // ← ذخیره در Firebase\n}\n\n// ===== LOGIN =====\n// Show password field only if user types \"admin\" or \"ادمین\"\ndocument.addEventListener('DOMContentLoaded',()=>{\n  const ni=document.getElementById('loginName');\n  const pw=document.getElementById('passFieldWrap');\n  const pinWrap=document.getElementById('pinFieldWrap');\n  if(ni){\n    ni.addEventListener('input',()=>{\n      const v=ni.value.trim();\n      const isAdm=(v===ADMIN_USER);\n      if(pw) pw.style.display=isAdm?'block':'none';\n      if(pinWrap) pinWrap.style.display=isAdm?'none':'block';\n    });\n  }\n});\n\nfunction buildQuickUsers(){\n  const el=document.getElementById('quickUsers');\n  const names=Object.keys(users).slice(0,8);\n  if(!names.length){el.innerHTML='<span style=\"font-size:11px;color:var(--tx3)\">اولین نفر باش!<\u002Fspan>';return;}\n  el.innerHTML=names.map(n=>`<button onclick=\"ql('${n}')\" style=\"padding:5px 12px;border-radius:20px;border:1.5px solid var(--brd);background:var(--sur2);font-size:12px;font-family:var(--font);color:var(--tx2);cursor:pointer;transition:all .2s;font-weight:600;\" onmouseover=\"this.style.background='var(--gs)';this.style.borderColor='rgba(10,191,111,.3)';this.style.color='var(--green)'\" onmouseout=\"this.style.background='var(--sur2)';this.style.borderColor='var(--brd)';this.style.color='var(--tx2)'\">${uinit(n)} ${n}<\u002Fbutton>`).join('');\n}\nfunction ql(n){\n  const ni=document.getElementById('loginName');\n  if(ni)ni.value=n;\n  const pi=document.getElementById('loginPin');\n  if(pi)pi.focus();\n}\n\n// ── PIN helpers ──────────────────────────────────────────────────\nfunction fbKey(s){ return s.replace(/[.#$\\[\\]/]/g,'_'); }\n\nfunction _completeLogin(){\n  const n=isAdmin?null:(currentUser?currentUser.name:null);\n  const ls=document.getElementById('loginScreen');\n  document.getElementById('appLayout').style.display='flex';\n  ls.classList.add('hide');\n  setTimeout(()=>{ls.style.display='none';},500);\n  try{ if(!isAdmin&&n) localStorage.setItem('wc26_user', n); }catch(_){}\n  initApp();\n}\n\nasync function doLogin(){\n  const nameInp=document.getElementById('loginName');\n  const passInp=document.getElementById('loginPass');\n  const pinInp=document.getElementById('loginPin');\n  const btn=document.getElementById('loginBtnTxt');\n  const n=(nameInp?nameInp.value:'').trim();\n  const p=(passInp?passInp.value:'').trim();\n  const pin=(pinInp?pinInp.value:'').trim();\n  const e=document.getElementById('loginError');\n  if(e)e.textContent='';\n  if(!n){if(e)e.textContent='لطفاً نامت را وارد کن';if(nameInp)nameInp.focus();return;}\n  if(n.length<2){if(e)e.textContent='نام باید حداقل ۲ حرف باشد';return;}\n\n  // Admin login\n  if(n===ADMIN_USER){\n    if(p!==ADMIN_PASS){if(e)e.textContent='❌ رمز ادمین اشتباه است';if(passInp)passInp.focus();return;}\n    isAdmin=true;\n    currentUser={name:'ادمین 👑',isAdmin:true,preds:{},comments:{},points:0,predictions:0,correct:0,exact:0};\n    _completeLogin();\n    return;\n  }\n\n  // PIN: if empty just focus it\n  if(!pin){if(pinInp)pinInp.focus();return;}\n  if(pin.length<4){if(e)e.textContent='کد ورود باید حداقل ۴ رقم باشد';if(pinInp)pinInp.focus();return;}\n  if(!/^\\d+$/.test(pin)){if(e)e.textContent='کد ورود فقط عدد باشد';if(pinInp)pinInp.focus();return;}\n\n  if(btn){btn.textContent='...';}\n  const loginBtn=document.getElementById('loginBtn');\n  if(loginBtn)loginBtn.disabled=true;\n\n  try{\n    if(fbReady){\n      const snap=await db.ref('userPins/'+fbKey(n)).once('value');\n      const stored=snap.val();\n      if(stored===null){\n        // New user — register PIN\n        await db.ref('userPins/'+fbKey(n)).set(pin);\n        toast('رمزت ثبت شد 🔑 دفعه بعد همین کد رو بنویس','i',4500);\n      } else if(stored!==pin){\n        if(e)e.textContent='❌ کد اشتباهه! دوباره امتحان کن';\n        if(pinInp){pinInp.value='';pinInp.focus();}\n        if(btn)btn.textContent='ورود';\n        if(loginBtn)loginBtn.disabled=false;\n        return;\n      }\n    } else {\n      // Local fallback (no Firebase)\n      const lp=localStorage.getItem('wc26_pin_'+n);\n      if(lp&&lp!==pin){\n        if(e)e.textContent='❌ کد اشتباهه! دوباره امتحان کن';\n        if(pinInp){pinInp.value='';pinInp.focus();}\n        if(btn)btn.textContent='ورود';\n        if(loginBtn)loginBtn.disabled=false;\n        return;\n      }\n      if(!lp) localStorage.setItem('wc26_pin_'+n,pin);\n    }\n  } catch(err){\n    console.warn('PIN check error:',err);\n    // Fail open to avoid locking out users on Firebase errors\n  }\n\n  if(btn)btn.textContent='ورود';\n  if(loginBtn)loginBtn.disabled=false;\n  isAdmin=false;\n  currentUser=getUser(n);\n  _completeLogin();\n}\n\nfunction doLogout(){\n  currentUser=null; isAdmin=false;\n  try{ localStorage.removeItem('wc26_user'); }catch(_){}\n  const ls=document.getElementById('loginScreen');\n  ls.style.display='flex';ls.classList.remove('hide');\n  document.getElementById('appLayout').style.display='none';\n  const ni=document.getElementById('loginName');const pi=document.getElementById('loginPass');const pn=document.getElementById('loginPin');\n  if(ni)ni.value='';if(pi)pi.value='';if(pn)pn.value='';\n  const btn=document.getElementById('loginBtnTxt');if(btn)btn.textContent='ورود';\n  const loginBtn=document.getElementById('loginBtn');if(loginBtn)loginBtn.disabled=false;\n  const e=document.getElementById('loginError');if(e)e.textContent='';\n  build
