# Local or single-server deployment: PostgreSQL + the site.
#   cp .env.example .env   # fill in PAYLOAD_SECRET etc.
#   docker compose up -d --build
#   docker compose exec app npm run seed   # first run only
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: samira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: samira
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U samira']
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://samira:${POSTGRES_PASSWORD:-change-me}@db:5432/samira
    ports:
      - '3000:3000'
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
